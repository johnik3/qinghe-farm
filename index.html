function drawCrow(c) {
  const x = X(c.x),
    y = Y(c.y),
    s = U * 0.4,
    eat = c.phase === 'eat';
  if (eat) {
    const k = 1 - c.t / 8;
    ctx.strokeStyle = `rgba(216,69,91,${0.5 + 0.4 * Math.sin(T * 8)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, U * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k));
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y - (eat ? 0 : s * 0.3));
  ctx.scale(c.dir || 1, 1);
  const fl = eat ? 0 : Math.sin(c.f * 18);
  const pk = eat && Math.sin(T * 9) > 0.3 ? s * 0.12 : 0;
  ell(ctx, 0, 0, s * 0.45, s * 0.28, '#2b2b36');
  poly(
    ctx,
    [
      [-s * 0.4, 0],
      [-s * 0.75, -s * 0.1],
      [-s * 0.7, s * 0.12]
    ],
    '#22222b'
  );
  circ(ctx, s * 0.38, -s * 0.18 + pk, s * 0.2, '#2b2b36');
  poly(
    ctx,
    [
      [s * 0.55, -s * 0.2 + pk],
      [s * 0.78, -s * 0.12 + pk],
      [s * 0.55, -s * 0.08 + pk]
    ],
    '#6b6b70'
  );
  circ(ctx, s * 0.42, -s * 0.24 + pk, s * 0.05, '#fff');
  circ(ctx, s * 0.43, -s * 0.24 + pk, s * 0.025, '#111');
  poly(
    ctx,
    [
      [-s * 0.1, -s * 0.05],
      [s * 0.15, -s * 0.05],
      [-s * 0.05, -s * 0.05 - s * 0.55 * fl]
    ],
    '#3a3a48'
  );
  if (eat) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s * 0.05, s * 0.25);
    ctx.lineTo(-s * 0.08, s * 0.38);
    ctx.moveTo(s * 0.1, s * 0.25);
    ctx.lineTo(s * 0.12, s * 0.38);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCat() {
  const x = X(CAT.x),
    y = Y(CAT.y),
    s = U * 0.36,
    fur = '#e9a25f',
    dk = '#c47a3a';
  shadow(x, y, s * 0.55, s * 0.12, 0.2);
  if (cat.awake <= 0) {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x - s * 0.05, y - s * 0.2, s * 0.42, 0.3, 1.7);
    ctx.stroke();
    ell(ctx, x, y - s * 0.25, s * 0.48, s * 0.26, fur);
    ctx.strokeStyle = dk;
    ctx.lineWidth = s * 0.06;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * s * 0.18 - s * 0.05, y - s * 0.48);
      ctx.lineTo(x + k * s * 0.16 - s * 0.05, y - s * 0.32);
      ctx.stroke();
    }
    circ(ctx, x + s * 0.38, y - s * 0.24, s * 0.22, fur);
    poly(
      ctx,
      [
        [x + s * 0.22, y - s * 0.36],
        [x + s * 0.26, y - s * 0.58],
        [x + s * 0.38, y - s * 0.42]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.42, y - s * 0.42],
        [x + s * 0.56, y - s * 0.56],
        [x + s * 0.57, y - s * 0.34]
      ],
      fur
    );
    ctx.strokeStyle = '#5c3920';
    ctx.lineWidth = 1.3;
    for (const ex of [0.31, 0.47]) {
      ctx.beginPath();
      ctx.arc(x + s * ex, y - s * 0.24, s * 0.05, 0.3, Math.PI - 0.3);
      ctx.stroke();
    }
    const ph = (T * 0.45) % 1;
    ctx.globalAlpha = 1 - ph;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(U * (0.15 + ph * 0.1))}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('z', x + s * 0.7 + ph * s * 0.3, y - s * 0.75 - ph * s * 0.7);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y - s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.55, y - s * 0.2, x - s * 0.45 + Math.sin(T * 6) * s * 0.12, y - s * 0.6);
    ctx.stroke();
    ell(ctx, x, y - s * 0.35, s * 0.3, s * 0.36, fur);
    ell(ctx, x + s * 0.02, y - s * 0.28, s * 0.15, s * 0.24, '#fbeedd');
    circ(ctx, x, y - s * 0.82, s * 0.26, fur);
    poly(
      ctx,
      [
        [x - s * 0.24, y - s * 0.9],
        [x - s * 0.2, y - s * 1.18],
        [x - s * 0.04, y - s * 1.02]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.24, y - s * 0.9],
        [x + s * 0.2, y - s * 1.18],
        [x + s * 0.04, y - s * 1.02]
      ],
      fur
    );
    circ(ctx, x - s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    circ(ctx, x + s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    poly(
      ctx,
      [
        [x - s * 0.04, y - s * 0.75],
        [x + s * 0.04, y - s * 0.75],
        [x, y - s * 0.7]
      ],
      '#e86a7a'
    );
  }
}

function drawDog() {
  const x = X(dog.x),
    y = Y(dog.y),
    s = U * 0.42,
    mv = dog.w <= 0,
    sp = dog.run ? 18 : 10,
    b = mv ? Math.abs(Math.sin(T * sp)) * s * 0.08 : 0,
    lg = mv ? Math.sin(T * sp) * s * 0.08 : 0,
    fur = '#d98a3d',
    cr = '#fbeedd';
  shadow(x, y, s * 0.5, s * 0.12, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(dog.dir || 1, 1);
  ctx.fillStyle = '#b86e2a';
  ctx.fillRect(-s * 0.3 + lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.fillRect(s * 0.2 - lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.strokeStyle = fur;
  ctx.lineWidth = s * 0.12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(-s * 0.4, -s * 0.6, s * 0.14, Math.PI * 0.2 + Math.sin(T * (mv ? 12 : 6)) * 0.3, Math.PI * 1.7);
  ctx.stroke();
  ell(ctx, 0, -s * 0.38, s * 0.42, s * 0.22, fur);
  ell(ctx, s * 0.05, -s * 0.3, s * 0.25, s * 0.1, cr);
  ctx.fillStyle = fur;
  ctx.fillRect(-s * 0.25 - lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.fillRect(s * 0.25 + lg, -s * 0.25, s * 0.1, s * 0.25);
  const hx = s * 0.42,
    hy = -s * 0.64;
  ell(ctx, hx - s * 0.1, hy + s * 0.2, s * 0.12, s * 0.06, '#d8455b');
  circ(ctx, hx, hy, s * 0.24, fur);
  ell(ctx, hx + s * 0.14, hy + s * 0.08, s * 0.13, s * 0.1, cr);
  circ(ctx, hx + s * 0.26, hy + s * 0.04, s * 0.045, '#2a1d14');
  poly(
    ctx,
    [
      [hx - s * 0.18, hy - s * 0.1],
      [hx - s * 0.12, hy - s * 0.38],
      [hx - s * 0.02, hy - s * 0.16]
    ],
    '#b86e2a'
  );
  poly(
    ctx,
    [
      [hx + s * 0.02, hy - s * 0.18],
      [hx + s * 0.1, hy - s * 0.4],
      [hx + s * 0.16, hy - s * 0.14]
    ],
    '#b86e2a'
  );
  circ(ctx, hx + s * 0.06, hy - s * 0.04, s * 0.04, '#2a1d14');
  if (!mv || dog.run) ell(ctx, hx + s * 0.2, hy + s * 0.18, s * 0.05, s * 0.07, '#e86a7a');
  ctx.restore();
}

function drawHand() {
  if (!S.up.hand) return;

    lg = mv ? Math.sin(T * 11) * s * 0.07 : 0,

  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(hand.dir || 1, 1);
  ctx.fillStyle = '#3d5f8a';
  ctx.fillRect(-s * 0.16 + lg, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillRect(s * 0.04 - lg, -s * 0.38, s * 0.12, s * 0.38);

  ctx.fillStyle = '#4a78a8';

  ctx.fillRect(-s * 0.16, -s * 0.86, s * 0.07, s * 0.22);
  ctx.fillRect(s * 0.09, -s * 0.86, s * 0.07, s * 0.22);
  ctx.strokeStyle = '#f2c9a0';
  ctx.lineWidth = s * 0.1;
  ctx.lineCap = 'round';

  ell(ctx, s * 0.13, -s * 1.0, s * 0.05, s * 0.03, 'rgba(230,120,110,.5)');
  ell(ctx, 0, -s * 1.22, s * 0.36, s * 0.08, '#d9b45a');
  poly(
    ctx,
    [
      [-s * 0.18, -s * 1.22],
      [-s * 0.12, -s * 1.42],
      [s * 0.14, -s * 1.42],
      [s * 0.2, -s * 1.22]
    ],
    '#e3c26a'
  );

  ctx.fillRect(-s * 0.18, -s * 1.27, s * 0.38, s * 0.05);
  ctx.fillStyle = '#a87448';
  rrect(ctx, -s * 0.42, -s * 0.62, s * 0.26, s * 0.2, s * 0.05);
  ctx.fill();
  ctx.restore();
}
// 自动喷灌：田边的喷头转着洒水
function drawSprinklers() {
  if (S.up.water < 4 || raining()) return;
  for (const [sx, sy] of [
    [0.86, 3.12],
    [7.14, 3.12],
    [0.86, 8.42],
    [7.14, 8.42],
    [0.82, 5.75],
    [7.18, 5.75]
  ]) {
    const x = X(sx),
      y = Y(sy);
    if (y < -U || y > ch + U) continue;
    ctx.fillStyle = '#7a8a90';
    ctx.fillRect(x - U * 0.03, y - U * 0.18, U * 0.06, U * 0.18);
    circ(ctx, x, y - U * 0.2, U * 0.05, '#9fb0b6');
    for (let k = 0; k < 7; k++) {
      const a = T * 2.2 + sx + k * 0.12,
        r = U * (0.5 + ((T * 1.5 + k * 0.37) % 1) * 1.4);
      ctx.globalAlpha = 0.8 * (1 - ((T * 1.5 + k * 0.37) % 1));
      circ(ctx, x + Math.cos(a) * r, y - U * 0.2 + Math.sin(a) * r * 0.45, U * 0.04, '#d6f0ff');
    }
    ctx.globalAlpha = 1;
  }
}

/* 绘制南岸：河、桥、果园、湖与码头、集市 */
function drawSouth() {
  const st = S.quest.stage,
    si = season(),
    win = si === 3,
    y0 = Y(RIVER.y),
    h = RIVER.h * U;
  if (y0 > ch + U * 0.5 || Y(WH) < -U) return;
  ctx.fillStyle = win ? '#dfe6e8' : '#c9b583';
  ctx.fillRect(0, y0 - U * 0.12, cw, h + U * 0.24);
  ctx.fillStyle = lg(ctx, y0, y0 + h, win ? '#e4f2f8' : '#6cc0e0', win ? '#b3d4e2' : '#3b88b0');
  ctx.fillRect(0, y0, cw, h);
  ctx.lineCap = 'round';
  if (!win) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 16; k++) {
      const x = ((k * 137 + T * 40) % (cw + 160)) - 80,
        yy = y0 + h * (0.2 + (k % 4) * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + U * 0.35, yy);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 8; k++) {
      const x = (k * 173) % cw;
      ctx.beginPath();
      ctx.moveTo(x, y0 + h * 0.3);
      ctx.lineTo(x + U * 0.4, y0 + h * 0.6);
      ctx.lineTo(x + U * 0.7, y0 + h * 0.4);
      ctx.stroke();
    }
  }
  const bx = X(BRIDGE.x),
    by = Y(BRIDGE.y),
    bw = BRIDGE.w * U,
    bh = BRIDGE.h * U;
  ell(ctx, bx + bw / 2, y0 + h * 0.6, bw * 0.6, h * 0.3, 'rgba(20,40,60,.18)');
  const post = (px, py) => {
    ctx.fillStyle = '#5c3920';
    rrect(ctx, px - U * 0.06, py - U * 0.12, U * 0.12, U * 0.22, U * 0.03);
    ctx.fill();
  };
  if (st >= 1) {
    ctx.fillStyle = '#a87448';
    rrect(ctx, bx, by, bw, bh, U * 0.06);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.5;
    for (let k = 1; k < 9; k++) {
      const yy = by + (bh * k) / 9;
      ctx.beginPath();
      ctx.moveTo(bx + 2, yy);
      ctx.lineTo(bx + bw - 2, yy);
      ctx.stroke();
    }
    ctx.strokeStyle = '#7a5232';
    ctx.lineWidth = U * 0.06;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.04, by);
    ctx.lineTo(bx + U * 0.04, by + bh);
    ctx.moveTo(bx + bw - U * 0.04, by);
    ctx.lineTo(bx + bw - U * 0.04, by + bh);
    ctx.stroke();
    for (const k of [0, 0.5, 1]) {
      post(bx + U * 0.04, by + bh * k);
      post(bx + bw - U * 0.04, by + bh * k);
    }
    if (win) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(bx + U * 0.1, by, bw - U * 0.2, bh);
    }
  } else {
    ctx.fillStyle = '#8d6440';
    ctx.fillRect(bx + U * 0.08, by, bw - U * 0.16, bh * 0.28);
    ctx.fillRect(bx + U * 0.08, by + bh * 0.78, bw - U * 0.16, bh * 0.22);
    ctx.save();
    ctx.translate(bx + bw * 0.55, by + bh * 0.5);
    ctx.rotate(0.5);
    ctx.fillRect(-bw * 0.3, -U * 0.05, bw * 0.6, U * 0.1);
    ctx.restore();
    ctx.strokeStyle = '#c9a66b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.06, by + bh * 0.28);
    ctx.quadraticCurveTo(bx + U * 0.25, by + bh * 0.55, bx + U * 0.06, by + bh * 0.78);
    ctx.stroke();
    post(bx + U * 0.06, by);
    post(bx + bw - U * 0.06, by);
    post(bx + U * 0.06, by + bh);
    post(bx + bw - U * 0.06, by + bh);
  }
  const O = ORCH;
  ctx.fillStyle = win ? 'rgba(255,255,255,.3)' : 'rgba(120,90,50,.16)';
  rrect(ctx, X(O.x), Y(O.y), O.w * U, O.h * U, U * 0.15);
  ctx.fill();
  fenceRect(O.x, O.y + 0.15, O.w, O.h - 0.15, [O.x + 2.55, O.x + 3.15]);
  if (st < 1) {
    for (let k = 0; k < 6; k++)
      drawTree({

  } else TSLOT.forEach(([tx, ty], i) => drawFruitTree(tx, ty, S.trees[i], i));
  const L = LAKE,

  ell(ctx, lx, ly, rx, ry, lgd);
  if (!win) {

      ctx.moveTo(px, py);

      ctx.fill();

    for (let k = 0; k < 6; k++) {
      const rxp = lx + rx * (0.72 + (k % 3) * 0.08),

        sw = Math.sin(T + k) * 2;
      ctx.strokeStyle = '#5f8a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rxp, ryp);
      ctx.lineTo(rxp + sw, ryp - U * 0.35);
      ctx.stroke();
      ell(ctx, rxp + sw, ryp - U * 0.38, U * 0.03, U * 0.08, '#8a5a2b');
    }
    const jp = (T * 0.3) % 4;
    if (jp < 1) {
      const a = jp * Math.PI,
        fx = lx + rx * 0.1 + jp * U * 0.6,
        fy = ly + ry * 0.1 - Math.sin(a) * U * 0.5;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(-Math.cos(a) * 0.9);
      ell(ctx, 0, 0, U * 0.13, U * 0.05, '#cf9a3c');
      ctx.restore();
    } else if (jp < 1.6) {
      ctx.strokeStyle = `rgba(255,255,255,${1.6 - jp})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(
        lx + rx * 0.1 + U * 0.6,
        ly + ry * 0.1,
        U * Math.max(0.01, jp - 0.8) * 0.5,
        U * Math.max(0.01, jp - 0.8) * 0.2,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }
  }
  if (st >= 2) {
    const dx0 = X(L.x - 0.05),
      dy0 = Y(L.y + L.h * 0.42);
    ctx.fillStyle = '#a87448';
    rrect(ctx, dx0, dy0, U * 1.3, U * 0.38, U * 0.04);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < 7; k++) {
      ctx.beginPath();
      ctx.moveTo(dx0 + (k * U * 1.3) / 7, dy0);
      ctx.lineTo(dx0 + (k * U * 1.3) / 7, dy0 + U * 0.38);
      ctx.stroke();

    for (const k of [0, 0.5, 1]) circ(ctx, dx0 + k * U * 1.25 + U * 0.03, dy0 + U * 0.4, U * 0.05, '#5c3920');
    const bxx = X(L.x + L.w * 0.62),
      byy = Y(L.y + L.h * 0.68) + Math.sin(T * 1.5) * 2;
    ctx.beginPath();
    ctx.moveTo(bxx - U * 0.42, byy);
    ctx.quadraticCurveTo(bxx, byy + U * 0.3, bxx + U * 0.42, byy);
    ctx.closePath();
    ctx.fillStyle = '#8d5b36';
    ctx.fill();
    ctx.fillStyle = '#b07a4c';
    ctx.fillRect(bxx - U * 0.32, byy - U * 0.03, U * 0.64, U * 0.05);
  } else sign(L.x + L.w * 0.3, L.y + 0.2, '码头', '复兴第二步');
  const M = MARKET;
  if (st >= 3) {
    const cols = [
        ['#d8455b', '#fff'],
        ['#4a8fd0', '#fff'],
        ['#e6a92a', '#fff']
      ],
      goods = [
        ['tomato', 'pumpkin', 'melon'],
        ['egg', 'milk', 'cheese'],
        ['apple', 'cake', 'flour']
      ];
    for (let k = 0; k < 3; k++) {
      const sx = X(M.x + 0.15 + k * 1.17),
        sy = Y(M.y + 0.15),
        sw = U,
        sh = U * 0.8;
      shadow(sx + sw / 2, sy + sh, sw * 0.55, U * 0.1);
      ctx.fillStyle = '#a87448';
      ctx.fillRect(sx + U * 0.05, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillRect(sx + sw - U * 0.11, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillStyle = '#c9a06a';
      ctx.fillRect(sx, sy + sh * 0.6, sw, sh * 0.35);
      for (let j = 0; j < 5; j++) {
        ctx.fillStyle = cols[k][j % 2];
        ctx.beginPath();
        ctx.moveTo(sx + (j * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy + U * 0.28);
        ctx.arc(sx + ((j + 0.5) * sw) / 5, sy + U * 0.28, sw / 10, 0, Math.PI);
        ctx.closePath();

      }

    }
    ctx.strokeStyle = 'rgba(90,60,30,.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X(M.x), Y(M.y));
    ctx.quadraticCurveTo(X(M.x + M.w / 2), Y(M.y + 0.3), X(M.x + M.w), Y(M.y));
    ctx.stroke();
    for (let k = 0; k < 11; k++) {
      const t2 = k / 10,
        px = X(M.x + M.w * t2),

      poly(

        [

      own.forEach((k, j) => {

        ctx.fillText(SHOPS[k].n[0], fx + U * 0.17, fy + U * 0.13 + fl * 0.4);

/* 绘制青禾茶山：山坡、石阶、梯田茶树、蜂箱、茶坊、半山茶亭、老茶馆，未开放时的云雾 */
const HILL_TONE = [
  ['#93c463', '#76ad4c', '#5f9440'],
  ['#74ad4c', '#5a963d', '#477d31'],
  ['#b9ad62', '#a1964f', '#86803f'],
  ['#e9f0f1', '#d6e2e5', '#c4d3d8']
];
function hillBase(si) {
  const [a, b] = HILL_TONE[si],
    y0 = Y(HILL.y),
    y1 = Y(WH + 0.5);
  const gr = ctx.createLinearGradient(0, y0 - U * 0.4, 0, y1);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.06, a);
  gr.addColorStop(1, b);
  ctx.fillStyle = gr;
  ctx.fillRect(0, y0 - U * 0.4, cw, y1 - y0 + U * 0.4);
  // 山坡上的草纹
  ctx.strokeStyle = si === 3 ? 'rgba(150,170,175,.35)' : 'rgba(40,80,30,.18)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let k = 0; k < 60; k++) {
    const gx = ((k * 0.61) % 8) + 0.1,
      gy = HILL.y + 0.4 + ((k * 1.37) % 8.2);
    ctx.moveTo(X(gx), Y(gy));
    ctx.lineTo(X(gx) + 2, Y(gy) - U * 0.12);
  }
  ctx.stroke();
}
// 石阶小路：后花园 → 右侧 → 老茶馆门口
function hillPath(si) {
  const stones = [];
  for (let y = 22.75; y < 28.2; y += 0.36) stones.push([5.0 + Math.sin(y * 2.1) * 0.06, y]);
  for (let k = 0; k < 4; k++) stones.push([4.85 - k * 0.24, 28.3 + k * 0.1]);
  const c = si === 3 ? ['#c9d3d6', '#b4c0c4'] : ['#c2b8a0', '#a89d84'];
  for (const [x, y] of stones) {
    ell(ctx, X(x), Y(y) + 2, U * 0.2, U * 0.085, 'rgba(40,40,20,.15)');
    ell(ctx, X(x), Y(y), U * 0.2, U * 0.085, c[0]);
    ell(ctx, X(x) - U * 0.03, Y(y) - U * 0.015, U * 0.12, U * 0.04, c[1]);
  }
}
function terraceBand(t, si) {
  const y0 = TERR.y + t * TERR.h,
    x0 = X(TERR.x),
    x1 = X(TERR.x + TERR.w),
    top = Y(y0),
    bot = Y(y0 + TERR.h),
    open = terrOpen(t),
    win = si === 3;
  // 台面
  ctx.fillStyle = open
    ? win
      ? '#e3e9e6'
      : ['#8a6a44', '#7d5f3b', '#8a6a44', '#9a8a70'][si]
    : win
      ? '#dfe7e8'
      : HILL_TONE[si][2];
  ctx.beginPath();
  ctx.moveTo(x0 + U * 0.1, top + U * 0.05);
  ctx.quadraticCurveTo((x0 + x1) / 2, top - U * 0.06, x1 - U * 0.1, top + U * 0.05);
  ctx.lineTo(x1, bot - U * 0.16);
  ctx.quadraticCurveTo((x0 + x1) / 2, bot - U * 0.04, x0, bot - U * 0.16);
  ctx.closePath();
  ctx.fill();
  if (open && !win) {
    // 垄沟
    ctx.strokeStyle = 'rgba(60,40,20,.25)';
    ctx.lineWidth = 1.2;
    for (const f of [0.35, 0.62]) {
      ctx.beginPath();
      ctx.moveTo(x0 + U * 0.2, top + (bot - top) * f);
      ctx.quadraticCurveTo(
        (x0 + x1) / 2,
        top + (bot - top) * (f + 0.06),
        x1 - U * 0.2,
        top + (bot - top) * f
      );
      ctx.stroke();
    }
  }
  // 石坎
  const n = Math.round(TERR.w / 0.3);
  for (let k = 0; k < n; k++) {
    const sx = x0 + ((x1 - x0) * (k + 0.5)) / n,
      sy = bot - U * 0.1 + Math.sin(k * 1.3) * U * 0.01 - Math.sin((k / n) * Math.PI) * U * 0.04;
    ctx.fillStyle = k % 3 === 0 ? '#9d9a8a' : k % 3 === 1 ? '#b0ad9c' : '#8f8c7c';
    rrect(ctx, sx - U * 0.15, sy - U * 0.09, U * 0.28, U * 0.18, U * 0.06);
    ctx.fill();
  }
  if (win)
    for (let k = 0; k < n; k += 2)
      ell(ctx, x0 + ((x1 - x0) * (k + 0.5)) / n, bot - U * 0.19, U * 0.13, U * 0.03, '#fbfdff');
  if (!open) {
    // 荒着：杂草和石头
    for (let k = 0; k < 9; k++) {
      const gx = TERR.x + 0.3 + ((k * 0.53) % 4.1),
        gy = y0 + 0.3 + ((k * 0.37) % 0.4);
      ctx.strokeStyle = win ? '#9db4a3' : '#3f6e2c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (const d of [-0.08, 0, 0.08]) {
        ctx.moveTo(X(gx + d), Y(gy));
        ctx.lineTo(X(gx + d * 1.8), Y(gy - 0.2));
      }
      ctx.stroke();
      if (k % 3 === 0) ell(ctx, X(gx + 0.2), Y(gy + 0.05), U * 0.08, U * 0.05, '#9d9c8e');
    }
    if (t === S.hill.terr && hillOpen())
      sign(
        TERR.x + TERR.w / 2,
        y0 + 0.08,
        '开垦梯田',
        S.lvl >= TERR_LVL[t] ? TERR_COST[t] + ' 金币' : TERR_LVL[t] + '级解锁'
      );
  }
}
function drawBush(i, si, night) {
  const b = S.hill.bush[i],
    q = bushXY(i),
    x = X(q.x),
    y = Y(q.y);
  if (!b) {
    if (!terrOpen(Math.floor(i / 4))) return;
    ell(ctx, x, y - U * 0.05, U * 0.22, U * 0.08, 'rgba(60,40,20,.35)');
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.font = `bold ${Math.round(U * 0.24)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', x, y - U * 0.08);
    return;
  }
  const B = BUSH[b.k],
    sc = 0.45 + 0.55 * Math.min(1, b.g / B.grow),
    grown = b.g >= B.grow,
    win = si === 3,
    sw = Math.sin(T * 1.3 + i) * U * 0.01;
  ell(ctx, x, y, U * 0.34 * sc, U * 0.09 * sc, 'rgba(30,40,20,.25)');
  if (b.k === 'osman') {
    ctx.fillStyle = '#6e4a2c';
    ctx.fillRect(x - U * 0.035 * sc, y - U * 0.45 * sc, U * 0.07 * sc, U * 0.45 * sc);
    const cy = y - U * 0.62 * sc;
    const cs = win ? ['#4a6a52', '#5d7d62'] : ['#2f6b33', '#3f8040'];
    circ(ctx, x + sw, cy, U * 0.34 * sc, cs[0]);
    circ(ctx, x - U * 0.12 * sc + sw, cy - U * 0.1 * sc, U * 0.2 * sc, cs[1]);
    circ(ctx, x + U * 0.14 * sc + sw, cy - U * 0.04 * sc, U * 0.18 * sc, cs[1]);
    if (grown && b.f)
      for (let k = 0; k < b.f * 3; k++) {
        const a = k * 2.39,
          rr = U * 0.26 * sc * Math.sqrt(((k * 7) % 10) / 10);
        circ(
          ctx,
          x + Math.cos(a) * rr + sw,
          cy + Math.sin(a) * rr * 0.8,
          U * 0.035,
          k % 2 ? '#f2b13a' : '#f7c85a'
        );
      }
    if (win) ell(ctx, x + sw, cy - U * 0.22 * sc, U * 0.24 * sc, U * 0.07 * sc, '#fbfdff');

    a = Math.max(0, Math.min(1, (h - 4.5) / 1, (9 - h) / 1.5));
  if (a <= 0) return;
  ctx.globalAlpha = 0.22 * a;
  for (let k = 0; k < 5; k++) {
    const fy = HILL.y + 1.2 + k * 1.6,
      fx = ((k * 2.3 + T * 0.08) % 11) - 1.5;
    ell(ctx, X(fx), Y(fy), U * 2.4, U * 0.35, '#ffffff');
  }
  ctx.globalAlpha = 1;
}
function drawHill() {
  if (Y(HILL.y) > ch + U || Y(WH + 0.5) < 0) return;
  const si = season(),
    night = darkness() > 0.3;
  hillBase(si);
  hillPath(si);
  for (let t = 0; t < 5; t++) {
    terraceBand(t, si);
    if (hillOpen()) for (let c = 0; c < 4; c++) drawBush(t * 4 + c, si, night);
  }
  if (hillOpen()) label('青禾茶山', X(5.0), Y(22.88));
  drawTeaWorks(si, night);
  for (let i = 0; i < 3; i++) if (hillOpen()) drawHive(i, si, night);
  drawPavilion(si, night);
  drawOldTea(si, night);
  if (!hillOpen()) drawHillFog();
  else hillMist();
}

/* 绘制叠加层：新手箭头、季节大字 */
function drawTut() {
  if (S.sheet) return;
  let tx, ty, txt, i;
  if (S.tut >= 4) {
    const g = hillGuide();
    if (!g) return;
    [tx, ty, txt] = g;
    return tutArrow(tx, ty, txt);
  }
  const at = k => {
    const q = plotXY(k);
    tx = q.x + 0.5;
    ty = q.y + 0.22;
  };
  if (S.tut === 0) {
    i = S.plots.findIndex(p => !p.L && !p.c);
    if (i < 0) return;
    at(i);
    txt = '点这里播种';
  } else if (S.tut === 1) {
    i = S.plots.findIndex(p => p.c && p.m <= 0 && p.g < CROPS[p.c].time);
    if (i < 0) return;
    at(i);
    txt = '土是干的，点它浇水';
  } else if (S.tut === 2) {
    i = S.plots.findIndex(p => p.c && p.g >= CROPS[p.c].time);
    if (i >= 0) {
      at(i);
      txt = '熟了！点它收获';
    } else {
      i = S.plots.findIndex(p => p.c && p.m <= 0);
      if (i < 0) return;
      at(i);
      txt = '又干了，再浇一次';
    }
  } else if (S.orders.some(canDeliver)) {
    tx = BOARD.x + BOARD.w * 0.5;
    ty = BOARD.y + 0.55;
    txt = '订单够交了！点这里交货，比卖给集市赚得多';
  } else {
    tx = HOUSE.x + HOUSE.w * 0.5;
    ty = HOUSE.y + 0.75;
    txt = '点仓库，把收成卖掉';
  }
  tutArrow(tx, ty, txt);
}
function tutArrow(tx, ty, txt) {
  const x = X(tx),
    y = Y(ty) - Math.abs(Math.sin(T * 4)) * U * 0.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-U * 0.18, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.22);
  ctx.lineTo(U * 0.18, -U * 0.22);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5c3920';
  ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(U * 0.26)}px ${FONT}`;
  const w = ctx.measureText(txt).width + U * 0.32,
    bx = Math.max(w / 2 + 4, Math.min(cw - w / 2 - 4, x));
  ctx.fillStyle = 'rgba(92,57,32,.94)';
  rrect(ctx, bx - w / 2, y - U * 0.92, w, U * 0.38, U * 0.13);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, y - U * 0.72);
}

function drawBanner() {
  if (!banner) return;
  const a = Math.max(0, Math.min(1, banner.t / 0.6, (3 - banner.t) / 0.4)),
    sc = 1 + (3 - banner.t) * 0.04;
  ctx.globalAlpha = a;
  ctx.save();
  ctx.translate(cw / 2, ch * 0.42);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = SEA[season()].c;
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(U * 1.4)}px ${FONT}`;
  ctx.lineWidth = U * 0.2;
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillText(banner.text, 0, 0);
  ctx.font = `${Math.round(U * 0.34)}px ${FONT}`;
  ctx.lineWidth = U * 0.1;
  ctx.strokeText(banner.sub, 0, U * 0.95);
  ctx.fillText(banner.sub, 0, U * 0.95);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 绘制工坊街：四个工坊，以及每个工坊头顶的进度圈和排队数 */
const WSTYLE = {
  kitchen: { wall: '#f1e2c4', roof: '#b8452e', trim: '#7a3a26' },
  dairy: { wall: '#f6f7f2', roof: '#4a7fb5', trim: '#2f5a86' },
  press: { wall: '#d2a46c', roof: '#4f8a3c', trim: '#2f5a2a' },

};
// 做好了冒气泡；正在做显示进度圈和「+排队数」
function drawWorkStatus(k, x, y) {
  const w = W(k);
  if (!w.built) return;
  const ol = Object.keys(w.out)
    .filter(r => w.out[r] > 0)
    .slice(0, 3)
    .map(r => [r, w.out[r]]);
  if (ol.length) return bubble(x, y, ol);
  const j = w.q[0];
  if (!j) return;
  const pr = 1 - j.t / RECIPES[j.r].t,
    r = U * 0.27,
    yy = y + Math.sin(T * 3) * U * 0.03;
  circ(ctx, x, yy, r + U * 0.06, 'rgba(255,255,255,.95)');
  ctx.lineCap = 'round';
  ctx.lineWidth = U * 0.06;
  ctx.strokeStyle = '#dfe9d0';
  ctx.beginPath();
  ctx.arc(x, yy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#7cc24e';
  ctx.beginPath();
  ctx.arc(x, yy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, pr));
  ctx.stroke();
  drawItem(ctx, j.r, x, yy, U * 0.15);
  if (w.q.length > 1) {
    const bx = x + r * 0.95,
      by = yy - r * 0.85;
    circ(ctx, bx, by, U * 0.13, '#e6a92a');
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(U * 0.17)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+' + (w.q.length - 1), bx, by + 1);
  }
}
function drawWorkshop(k) {
  const R = WRECT[k],
    B = WORKS[k],
    w = W(k),
    st = WSTYLE[k],
    x0 = X(R.x),
    y0 = Y(R.y),
    bw = R.w * U,
    bh = R.h * U,
    win = season() === 3;

    ctx.fillStyle = 'rgba(120,90,50,.22)';
    rrect(ctx, x0 + bw * 0.08, y0 + bh * 0.5, bw * 0.84, bh * 0.5, U * 0.08);
    ctx.fill();
    for (let i = 0; i < 6; i++)
      ell(
        ctx,
        x0 + bw * (0.15 + i * 0.14),
        y0 + bh * 0.95,
        U * 0.08,
        U * 0.05,
        i % 2 ? '#b3b2a3' : '#9d9c8e'

    sign(R.x + R.w / 2, R.y + 0.3, '建' + B.n, S.lvl >= B.lvl ? B.cost + ' 金币' : B.lvl + '级解锁');
    return;
  }
  shadow(x0 + bw / 2, y0 + bh, bw * 0.52, U * 0.13, 0.22);
  if (k === 'kitchen') {
    ctx.fillStyle = '#9a5c45';
    ctx.fillRect(x0 + bw * 0.68, y0 + bh * 0.05, bw * 0.1, bh * 0.3);
    if (w.q.length)
      for (let i = 0; i < 3; i++) {
        const ph = (T * 0.5 + i / 3) % 1;
        ctx.globalAlpha = 0.5 * (1 - ph);
        circ(
          ctx,
          x0 + bw * 0.73 + ph * U * 0.2,
          y0 + bh * 0.02 - ph * U * 0.7,
          U * (0.07 + ph * 0.12),
          '#eeeeea'

      }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = st.wall;
  ctx.fillRect(x0 + bw * 0.08, y0 + bh * 0.42, bw * 0.84, bh * 0.58);
  ctx.strokeStyle = 'rgba(80,60,40,.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(x0 + bw * 0.08, y0 + bh * (0.42 + i * 0.14));
    ctx.lineTo(x0 + bw * 0.92, y0 + bh * (0.42 + i * 0.14));
    ctx.stroke();
  }
  poly(
    ctx,
    [
      [x0 - bw * 0.02, y0 + bh * 0.47],
      [x0 + bw * 0.5, y0 + bh * 0.04],
      [x0 + bw * 1.02, y0 + bh * 0.47]
    ],
    st.roof
  );
  ctx.strokeStyle = st.trim;
  ctx.lineWidth = U * 0.05;
  ctx.lineJoin = 'round';
  ctx.stroke();
  if (win)
    poly(
      ctx,
      [
        [x0 + bw * 0.12, y0 + bh * 0.36],
        [x0 + bw * 0.5, y0 + bh * 0.06],
        [x0 + bw * 0.88, y0 + bh * 0.36],
        [x0 + bw * 0.5, y0 + bh * 0.22]
      ],
      '#fbfdff'
    );
  ctx.fillStyle = '#6e4a2c';
  rrect(ctx, x0 + bw * 0.4, y0 + bh * 0.66, bw * 0.2, bh * 0.34, bw * 0.05);
  ctx.fill();
  const lit = darkness() > 0.3;
  ctx.fillStyle = st.trim;
  ctx.fillRect(x0 + bw * 0.14, y0 + bh * 0.58, bw * 0.2, bh * 0.2);
  ctx.fillStyle = lit ? '#ffd47a' : '#bfe0ec';
  ctx.fillRect(x0 + bw * 0.155, y0 + bh * 0.595, bw * 0.17, bh * 0.17);
  // 招牌
  ctx.strokeStyle = '#5c3920';

  ctx.beginPath();
  ctx.moveTo(x0 + bw * 0.78, y0 + bh * 0.48);
  ctx.lineTo(x0 + bw * 0.78, y0 + bh * 0.54);
  ctx.stroke();
  circ(ctx, x0 + bw * 0.78, y0 + bh * 0.68, U * 0.17, '#fffaf0');
  ctx.lineWidth = 2;
  ctx.strokeStyle = st.trim;
  ctx.beginPath();
  ctx.arc(x0 + bw * 0.78, y0 + bh * 0.68, U * 0.17, 0, Math.PI * 2);
  ctx.stroke();
  drawItem(ctx, B.icon, x0 + bw * 0.78, y0 + bh * 0.69, U * 0.11);
  if (k === 'press') {
    ell(ctx, x0 + bw * 0.04, y0 + bh * 0.92, U * 0.16, U * 0.2, '#8d5b36');
    ctx.strokeStyle = '#4a3a2c';
    ctx.lineWidth = 1.5;
    for (const dy of [-0.1, 0.08]) {
      ctx.beginPath();
      ctx.ellipse(x0 + bw * 0.04, y0 + bh * 0.92 + U * dy, U * 0.16, U * 0.05, 0, 0, Math.PI);
      ctx.stroke();
    }
  }
  if (k === 'dairy') drawItem(ctx, 'milk', x0 + bw * 0.02, y0 + bh * 0.9, U * 0.14);
  if (k === 'loom') drawItem(ctx, 'yarn', x0 + bw * 0.98, y0 + bh * 0.92, U * 0.13);
  drawWorkStatus(k, x0 + bw / 2, y0 - U * 0.2);
  label(B.n, x0 + bw / 2, y0 + bh + U * 0.06);
}
function drawWorks() {
  const y0 = Y(16.82);

  g.save();
  g.translate(x, y);
  ell(g, 0, 0, s * 0.3, s * 0.07, 'rgba(30,50,20,.2)');
  switch (k) {
    case 'pot': {
      poly(
        g,
        [
          [-s * 0.17, -s * 0.28],
          [s * 0.17, -s * 0.28],
          [s * 0.12, 0],
          [-s * 0.12, 0]
        ],
        '#c8663f'
      );
      g.fillStyle = '#a8502e';
      g.fillRect(-s * 0.19, -s * 0.33, s * 0.38, s * 0.07);
      leaf(g, 0, -s * 0.33, s * 0.24, -2.3, s * 0.07, '#5da34a');
      leaf(g, 0, -s * 0.33, s * 0.24, -0.85, s * 0.07, '#4d9140');
      const fc =
        si === 3
          ? ['#d8455b', '#c93a4e', '#d8455b']
          : si === 2
            ? ['#f2c14a', '#e07a35', '#f2c14a']
            : ['#f7b6cf', '#ffffff', '#e65b84'];
      [
        [-s * 0.12, -s * 0.5],
        [s * 0.11, -s * 0.52],
        [0, -s * 0.62]
      ].forEach(([fx, fy], i) => {
        for (let p = 0; p < 5; p++)
          circ(
            g,
            fx + Math.cos(p * 1.257) * s * 0.045,
            fy + Math.sin(p * 1.257) * s * 0.045,
            s * 0.036,
            fc[i]
          );
        circ(g, fx, fy, s * 0.026, '#f7d34d');

      break;
    }
    case 'hay': {
      g.beginPath();
      g.moveTo(-s * 0.34, 0);
      g.quadraticCurveTo(-s * 0.34, -s * 0.62, 0, -s * 0.66);
      g.quadraticCurveTo(s * 0.34, -s * 0.62, s * 0.34, 0);

// ---------- 茶山：连采 ----------
function bushAt(p) {
  if (p.x < TERR.x || p.x > TERR.x + TERR.w || p.y < TERR.y || p.y > TERR.y + TERR.h * 5) return -1;
  let bi = -1,
    bd = 0.6;
  for (let i = 0; i < 20; i++) {
    if (!terrOpen(Math.floor(i / 4))) continue;
    const q = bushXY(i),
      d = Math.hypot(p.x - q.x, p.y - (q.y - 0.3));
    if (d < bd) {
      bd = d;
      bi = i;
    }
  }
  return bi;
}

// ---------- 茶山上山引导 ----------
function hillGuide() {
  if (!hillOpen() || S.sheet || placing || areaNow() !== 2) return null;
  if (!S.hill.bush.some(Boolean)) {
    const q = bushXY(0);
    return [q.x, q.y - 0.55, '点这里种第一棵茶树'];
  }
  if (!W('tea').built && S.lvl >= WORKS.tea.lvl)
    return [WRECT.tea.x + WRECT.tea.w / 2, WRECT.tea.y + 0.45, '建茶坊，把鲜叶做成茶'];
  if (!S.hill.hive[0]) return [HIVES[0][0], HIVES[0][1] - 0.85, '安个蜂箱，蜜蜂自己酿蜜'];
  return null;
}

/* v1.3 青禾丰收赛：作物品质、镇上委托、丰收赛、入股分红、商行信誉 */

// ---------- 品质 ----------
const QN = ['普通', '优', '特优'],
  QM = [1, 1.25, 1.6];
const qOpen = () => S.lvl >= 6;
function qNorm(id) {
  const v = S.qv[id];
  if (!v) return;
  let over = v[0] + v[1] - (S.inv[id] || 0);
  if (over > 0) {
    const d = Math.min(v[0], over);
    v[0] -= d;
    over -= d;
    v[1] = Math.max(0, v[1] - over);
  }
}
// [普通, 优, 特优]
function qCounts(id) {
  qNorm(id);
  const v = S.qv[id] || [0, 0],
    n = S.inv[id] || 0;
  return [n - v[0] - v[1], v[0], v[1]];
}
function addQ(id, n, q) {
  if (!q || !n) return;
  if (!S.qv[id]) S.qv[id] = [0, 0];
  S.qv[id][q - 1] += n;
}
// 从 minQ 档起由低到高拿；够就扣掉并返回 true
function takeInv(id, n, minQ = 0) {
  const c = qCounts(id);
  let have = 0;
  for (let q = minQ; q < 3; q++) have += c[q];
  if (have < n) return false;
  let left = n;
  for (let q = minQ; q < 3 && left > 0; q++) {
    const d = Math.min(c[q], left);
    c[q] -= d;
    left -= d;
  }
  S.inv[id] -= n;
  if (S.qv[id]) S.qv[id] = [c[1], c[2]];
  return true;
}
const haveQ = (id, minQ) =>
  qCounts(id)
    .slice(minQ)
    .reduce((a, b) => a + b, 0);
// 卖掉 n 个（先卖低档）能得多少钱
function sellValue(id, n) {
  const c = qCounts(id),
    pr = priceOf(id);
  let g = 0;
  for (let q = 0; q < 3 && n > 0; q++) {
    const d = Math.min(c[q], n);
    g += Math.round(pr * QM[q]) * d;
    n -= d;
  }
  return g;
}
// 收获时定档
function harvestQ(p) {
  if (!qOpen()) return 0;
  if (p.gold) return 2;
  const C = CROPS[p.c];
  let s = 0;
  if (C.ss.includes(season())) s++;
  if ((p.dry || 0) < C.time * 0.15) s++;
  if (S.up.fert >= 2) s++;
  if ((p.ov || 0) < 60) s++;
  const ex = [0, 0, 0.05, 0.2, 0.45][s] + (s >= 2 ? S.res.seed * 0.02 : 0),
    gd = [0, 0.15, 0.45, 0.6, 0.5][s],
    r = rand();
  return r < ex ? 2 : r < ex + gd ? 1 : 0;
}
const qTag = q => (q ? `<i class="qt q${q}">${QN[q]}</i>` : '');

// ---------- 商行信誉、店铺 ----------
const SHOPS = {

  cloth: {

  },

    lvl: 18,
    rep: 10,

  },

  },

    cost: 200000,
    div: 2000,
    perk: '委托时限 +25%，村民订单报酬 +5%',
    c: '#4a7fb5'
  }
};
const SHARE_COST = [1, 1.6, 2.4],
  SHARE_DIV = [0, 1, 2.2, 3.6];
const shopLv = k => S.town.shops[k] || 0;
const shareCost = k => Math.round(SHOPS[k].cost * SHARE_COST[shopLv(k)]);
const divPerDay = () => Object.keys(SHOPS).reduce((a, k) => a + SHOPS[k].div * SHARE_DIV[shopLv(k)], 0);
function shopBonus(id) {
  if (!S.town) return 0;
  let b = 0;
  if (shopLv('grain') && CROPS[id]) b += 0.05;
  if (shopLv('cloth') && (id === 'wool' || id === 'yarn' || id === 'scarf')) b += 0.1;
  if (shopLv('tea') && TEA_GOODS.includes(id)) b += 0.1;
  if (shopLv('inn') && RECIPES[id] && (RECIPES[id].w === 'kitchen' || RECIPES[id].w === 'dairy')) b += 0.1;
  return b;
}
function buyShare(k) {
  const D = SHOPS[k],
    l = shopLv(k);
  if (l >= 3 || S.lvl < D.lvl || S.town.rep < D.rep || S.coins < shareCost(k)) return;
  S.coins -= shareCost(k);
  S.town.shops[k] = l + 1;
  sfx('level');
  toast(
    `入股${D.n}${l ? `，加到 ${l + 1} 股` : ''}！以后每天分红 ${Math.round(D.div * SHARE_DIV[l + 1])} 金币`,
    'gold'
  );
}
function takeDiv() {

// 每个游戏日：分红入账、委托刷新
function townNewDay() {

// ---------- 委托 ----------
const CT = [
  { n: '铜', mult: 2.2, time: 900, rep: 1, need: 0, kinds: 2, base: l => 600 + l * 120 },
  { n: '银', mult: 3, time: 1500, rep: 2, need: 3, kinds: 3, base: l => 1500 + l * 250 },
  { n: '金', mult: 4, time: 2400, rep: 4, need: 10, kinds: 3, base: l => 3500 + l * 500 }
];
const townOpen = () => S.lvl >= 8 && S.quest.stage >= 3;
// 时限内大概能产出多少（按现有动物、工坊、茶树、果树估一半多一点），委托不会要做不出来的量
function cCap(id, t) {
  const lim = CT[t].time,
    k = 0.6;
  if (CROPS[id]) return [12, 16, 20][t];
  if (RECIPES[id]) {
    const w = W(RECIPES[id].w);
    return Math.floor(((lim * [0.35, 0.45, 0.55][t]) / RECIPES[id].t) * (w.p2 ? 2 : 1));
  }
  if (ANIM_OF[id]) {
    const a = ANIM_OF[id];
    return Math.floor(((S.an[a].length * lim) / ANIM[a].t) * k);
  }
  if (id === 'honey') return Math.floor(((S.hill.hive.filter(Boolean).length * lim) / 90) * k);
  for (const bk in BUSH)
    if (BUSH[bk].item === id) {
      if (!BUSH[bk].ss.includes(season())) return 0;
      return Math.floor(
        ((S.hill.bush.filter(b => b && b.k === bk && bushReady(b)).length * lim) / BUSH[bk].every) * k
      );
    }
  for (const tk in TREES)
    if (TREES[tk].fruit === id) {
      if (!TREES[tk].ss.includes(season())) return 0;
      return Math.min(
        10,
        Math.floor(
          ((S.trees.filter(x => x && x.k === tk && x.g >= TREES[tk].grow).length * lim) / TREES[tk].every) * k
        )
      );
    }
  return 0;
}
// 鱼和要用鱼、要三种水果的东西产量看运气，不进委托
const C_SKIP = ['fishsoup', 'juice'];
function cPool() {
  const pool = [];
  for (const k in CROPS) if (CROPS[k].lvl <= S.lvl) pool.push(k);
  for (const k in ANIM) if (S.an[k].length) pool.push(ANIM[k].prod);
  for (const r in RECIPES) if (W(RECIPES[r].w).built && RECIPES[r].lvl <= S.lvl) pool.push(r);
  for (const tr of S.trees)
    if (tr && tr.g >= TREES[tr.k].grow && !pool.includes(TREES[tr.k].fruit)) pool.push(TREES[tr.k].fruit);
  if (hillOpen()) {
    for (const b of S.hill.bush)
      if (bushReady(b) && !pool.includes(BUSH[b.k].item)) pool.push(BUSH[b.k].item);
    if (S.hill.hive.some(Boolean)) pool.push('honey');
  }
  return pool;
}
function genContract(t) {
  const T = CT[t],
    pool = cPool().filter(id => !C_SKIP.includes(id) && cCap(id, t) >= 2);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // 越到后期越要值钱的东西
  const minV = T.base(S.lvl) / T.kinds / 30;
  pool.sort((a, b) => (ITEMS[b].sell >= minV) - (ITEMS[a].sell >= minV));
  const crops = pool
      .filter(k => CROPS[k])
      .sort((a, b) => ITEMS[b].sell - ITEMS[a].sell)
      .slice(0, 4),
    others = pool.filter(k => !CROPS[k]);
  for (let i = crops.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [crops[i], crops[j]] = [crops[j], crops[i]];
  }
  const pick = [];
  if (t >= 1 && crops.length) pick.push(crops[0]);
  if (t === 2) {
    const pr = others.find(k => RECIPES[k]);
    if (pr) pick.push(pr);
  }
  for (const k of pool)
    if (pick.length < T.kinds + (t === 2 && rand() < 0.4 ? 1 : 0) && !pick.includes(k)) pick.push(k);
  const per = T.base(S.lvl) / pick.length;
  // 每样数量控制在 2~24 份，便宜货不会要上百个
  const items = pick.map(id => {
    const minQ = CROPS[id] && qOpen() ? Math.min(t, 2) : 0;
    return [id, Math.max(2, Math.min(cCap(id, t), Math.round(per / (ITEMS[id].sell * QM[minQ])))), minQ];
  });
  const val = items.reduce((a, [id, n, q]) => a + ITEMS[id].sell * QM[q] * n, 0),
    R = Math.round((val * T.mult) / 10) * 10;
  return { t, items, R, D: Math.round(R * 0.2), time: Math.round(T.time * (shopLv('ship') ? 1.25 : 1)) };
}
function townOffers() {
  if (!S.town.offers || !S.town.offers.length) S.town.offers = [0, 1, 2].map(genContract);
  return S.town.offers;
}
function takeContract(i) {
  const o = townOffers()[i];
  if (!o || S.town.active || S.town.rep < CT[o.t].need || S.coins < o.D) return;
  S.coins -= o.D;
  S.town.active = { ...o, given: {}, left: o.time };
  S.town.offers[i] = genContract(o.t);
  sfx('plant');
  toast(`接下${CT[o.t].n}档委托，${Math.round(o.time / 60)} 分钟内交齐`, 'gold');
}
const cLeft = a => a.items.filter(([id, n]) => (a.given[id] || 0) < n);
function giveContract() {
  const a = S.town.active;
  if (!a) return;
  let any = 0;
  for (const [id, n, q] of a.items) {
    const need = n - (a.given[id] || 0),
      g = Math.min(need, haveQ(id, q));
    if (g > 0 && takeInv(id, g, q)) {
      a.given[id] = (a.given[id] || 0) + g;
      any += g;
    }
  }
  if (!any) return toast('仓库里还没有能交的');
  sfx('coin');
  if (!cLeft(a).length) finishContract(true);
  else toast(`交了 ${any} 件，还差 ${cLeft(a).length} 样`);
}
function finishContract(ok) {
  const a = S.town.active;
  if (!a) return;
  S.town.active = null;
  if (ok) {
    const g = a.R + a.D;
    addCoins(g);
    flyAt(innerWidth / 2, innerHeight * 0.4, g);
    S.town.rep += CT[a.t].rep;
    S.town.cdone = (S.town.cdone || 0) + 1;
    gainXP(Math.round(a.R / 40));
    sfx('ach');
    confetti(4, 26);
    toast(`${CT[a.t].n}档委托完成！拿到 ${a.R} 金币，押金退回，商行信誉 +${CT[a.t].rep}`, 'gold');
  } else {
    const back = Math.floor(a.D / 2);
    addCoins(back);
    toast(`委托超时了，押金退回一半（${back} 金币）。下次挑把握大的接`, 'gold');
  }
  if (S.sheet === 'town') renderSheet();
}
function abandonContract() {
  if (S.town.active) finishContract(false);
}
// 只在玩的时候计时
function tickTown(dt, off) {
  const a = S.town && S.town.active;
  if (!a || off) return;

// ---------- 丰收赛 ----------
const CAT_OF = id =>
  CROPS[id]
    ? '作物'
    : FRUIT.includes(id)
      ? '水果'
      : ['egg', 'milk', 'wool'].includes(id)
        ? '畜产'
        : TEA_GOODS.includes(id)
          ? '茶山'
          : RECIPES[id]
            ? '加工'
            : '鱼';
const contestOpen = () => S.lvl >= 10;
const contestYear = () => Math.floor((S.day - 1) / (SDAYS * 4)) + 1;
const contestKey = () => Math.floor((S.day - 1) / SDAYS);
const contestLines = () => {
  // 每年高 5%，最多高 25%：满分篮子大约 330 分，金牌线封顶 300，始终拿得到
  const m = Math.min(1.25, 1 + 0.05 * (contestYear() - 1));
  return [100, 170, 240].map(x => Math.round(x * m));
};
const contestFee = () => Math.min(3000, 300 + 200 * contestYear());
function contestPts(id, q) {
  const sb = CROPS[id] && CROPS[id].ss.includes(season()) ? 1.2 : 1;
  return Math.round(Math.sqrt(ITEMS[id].sell) * 3 * [1, 1.5, 2.2][q] * sb);
}
function basketScore(b) {
  const cats = new Set(b.map(e => CAT_OF(e.id)));
  return b.reduce((a, e) => a + contestPts(e.id, e.q), 0) + Math.max(0, cats.size - 1) * 8;
}
let basket = [];
// 候选：仓库里每样东西的最高档
function contestCands() {
  const out = [];
  for (const id in S.inv) {
    if (!S.inv[id] || id === 'boot') continue;
    const c = qCounts(id),
      q = c[2] ? 2 : c[1] ? 1 : 0;
    out.push({ id, q, pts: contestPts(id, q) });
  }
  return out.sort((a, b) => b.pts - a.pts);
}
function autoBasket() {
  const cands = contestCands(),
    b = [],
    used = new Set();
  // 先每个门类挑最好的一样，再按分数补满
  for (const c of cands) if (b.length < 5 && !used.has(CAT_OF(c.id))) b.push(c), used.add(CAT_OF(c.id));
  for (const c of cands) if (b.length < 5 && !b.some(x => x.id === c.id)) b.push(c);
  b.sort((x, y) => y.pts - x.pts);
  basket = b.slice(0, 5).map(({ id, q }) => ({ id, q }));
}
function enterContest() {
  if (!contestOpen() || S.town.contest[contestKey()] != null || basket.length < 5 || S.coins < contestFee())
    return;
  for (const e of basket) if (haveQ(e.id, e.q) < 1) return toast('篮子里有东西仓库里没了，重新挑一下');
  S.coins -= contestFee();
  const score = basketScore(basket),
    L = contestLines(),
    m = score >= L[2] ? 2 : score >= L[1] ? 1 : score >= L[0] ? 0 : -1;
  for (const e of basket) takeInv(e.id, 1, e.q);
  S.town.contest[contestKey()] = m;
  S.town.lastScore = score;
  if (m >= 0) {
    S.town.medals[m]++;
    S.town.rep += [1, 2, 4][m];
    const lv = S.lvl,
      coins = [800 + lv * 40, 2000 + lv * 80, 5000 + lv * 150][m];
    addCoins(coins);
    flyAt(innerWidth / 2, innerHeight * 0.4, coins);
    if (m >= 1) S.goldSeeds = (S.goldSeeds || 0) + (m === 2 ? 3 : 2);
    let extra = '';
    if (m === 2 && !S.town.trophy) {
      S.town.trophy = 1;
      S.dinv.trophy = (S.dinv.trophy || 0) + 1;
      extra = '，还有一座「金奖杯」装饰';
    }
    confetti(4, m === 2 ? 60 : 30);
    sfx('ach');
    toast(`丰收赛${['铜', '银', '金'][m]}牌！${score} 分，奖金 ${coins}${extra}`, 'gold');
  } else {
    sfx('deny');
    toast(`${score} 分，差一点上榜。多攒些特优和高价货，下季再来`, 'gold');
  }
  basket = [];
}
function confetti(y, n) {
  const cy = camY;
  for (let k = 0; k < n; k++)
    parts.push({
      x: 4 + (rand() - 0.5) * 6,
      y: cy - 2,
      vx: (rand() - 0.5) * 6,
      vy: -rand() * 6 - 2,
      l: 1.8,
      c: ['#f7cb4d', '#e65b84', '#7cc7ea', '#9bd36a', '#fff'][k % 5],

}
const townDot = () =>

function resetGame() {
  const s = fresh();
  s.resetAt = Date.now();
  s.welcomed = true;
  S = s;
  F = null;
  crows = [];
  parts = [];
  floats = [];
  vis.hen.length = vis.cow.length = vis.sheep.length = 0;
  dog.x = 4;
  dog.y = 2.86;
  zoom = 1;
  camY = -99;
  camTarget = null;
  applyCam();
  buildSeeds();
  coinShown = S.coins;
  $('#coins').textContent = S.coins;
  hudKey = '';
  save();
  pushCloud();
  openSheet('welcome');
  toast('新的农场，新的开始');
}

/* 网页版（自己部署的网址）专用：添加到主屏幕引导、微信提示、备份提醒、静音键提示 */
const UA = navigator.userAgent,
  IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  IN_WX = /MicroMessenger/i.test(UA),
  STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches,
  ON_SITE = !!window.QH_SITE;
const lsGet = k => {
  try {
    return localStorage.getItem(k);
  } catch (e) {
    return null;
  }
};
const lsSet = (k, v) => {
  try {
    localStorage.setItem(k, v);
  } catch (e) {}
};
const SHARE_ICO =
  '<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5V2.5M6.5 6 10 2.5 13.5 6"/><path d="M6 9H4.5v8.5h11V9H14"/></svg>';
function siteSheet(k) {
  if (k === 'a2hs')
    return {
      t: '添加到主屏幕',
      h:
        `<p class="note">把青禾小农场放到手机桌面，像 App 一样一点就开，全屏更好玩，进度也不会被 Safari 自动清掉。</p>` +
        `<div class="a2steps"><div><b>1</b><span>点屏幕底部的分享按钮 ${SHARE_ICO}</span></div><div><b>2</b><span>往下翻，选「添加到主屏幕」</span></div><div><b>3</b><span>以后从桌面的「青禾小农场」图标进来玩</span></div></div>` +
        (S.play > 300
          ? `<p class="note">桌面图标里是新的存档。想接着现在的进度玩：先在「菜单 → 存档管理」复制存档码，到桌面图标里再导入。</p><button class="btn big" data-a="go:save">先复制存档码</button>`
          : '') +
        `<button class="btn gold big" data-a="close">知道了</button>`
    };
  if (k === 'backup')
    return {
      t: '备份一下进度',
      h:
        `<p class="note">进度存在这台手机的浏览器里。换手机、清理浏览器数据，或者很久没打开被系统清理，进度就没了。复制一份存档码存到备忘录或发给自己，随时能找回。</p>` +
        `<button class="btn gold big" data-a="go:save">去复制存档码</button><button class="btn alt big" data-a="close">下次再说</button>`
    };
  return null;
}
// 开局几秒后看一次要不要提醒
function siteTips() {
  if (IN_WX) {
    $('#wxtip').hidden = false;
    return;
  }
  if (!ON_SITE || S.tut < 4) return;
  // 刚关掉别的弹窗（欢迎回来、今日）就别马上再弹，过一会儿再看
  if (S.sheet || (sheetT > 0 && T - sheetT < 8)) return void setTimeout(siteTips, 15000);
  const now = Date.now();
  // 不再提示添加到主屏幕；Safari 网页的数据可能被系统清理，备份提醒提早一些
  if (S.play > 900 && now - (S.bakAt || S.bakNag || 0) > 3 * 864e5) {
    S.bakNag = now;
    openSheet('backup');
  }
}
$('#wxClose').onclick = () => ($('#wxtip').hidden = true);
// iPhone 第一次出声时提醒静音键
function muteTip() {
  if (!IS_IOS || lsGet('qh-mute-tip')) return;
  lsSet('qh-mute-tip', 1);
  setTimeout(() => toast('听不到音乐的话，看看手机侧面的静音键'), 1500);
}

// 发现新版本：回到前台时、以及每 10 分钟查一次 version.json
let updV = null,
  updT = 0;
const verNum = v =>
  String(v)
    .split('.')
    .map(Number)
    .reduce((a, x, i) => a + x * Math.pow(1000, 2 - i), 0);
async function checkUpdate() {
  if (!ON_SITE || updV || location.protocol !== 'https:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (j && j.v && verNum(j.v) > verNum(VERSION)) {
      updV = j.v;
      $('#updTxt').textContent = `新版本 v${j.v} 已就绪，点这里更新（进度会保留）`;
      $('#updbar').hidden = false;
    }
  } catch (e) {}
}
$('#updbar').onclick = e => {
  if (e.target.id === 'updClose') return void ($('#updbar').hidden = true);
  save();
  location.reload();
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkUpdate();
});
setInterval(checkUpdate, 600000);
setTimeout(checkUpdate, 8000);

/* 启动：离线补算、云存档、主循环 */
resize();
buildSeeds();
// 补算离开的时间（最多 8 小时），返回这段时间的收获汇总
function catchUp() {
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.saved || Date.now())) / 1000));
  banner = null;
  if (away <= 20) return null;
  const inv0 = { ...S.inv },
    coins0 = S.coins;
  offStat = { hand: 0, lvUp: 0, keep: Math.floor(S.coins * 0.6) };
  offClock = 1440;
  simOff = true;
  try {
    // 步长随离开时长放大，最多算 6000 步，手机上也能很快打开
    const step = Math.max(1, away / 6000);
    for (let t = 0; t < away; t += step) update(step, true);
  } finally {
    simOff = false;
  }
  banner = null;
  const gains = {};
  for (const k in S.inv) if (S.inv[k] - (inv0[k] || 0) > 0) gains[k] = S.inv[k] - (inv0[k] || 0);
  return {
    away,
    gains,
    ready: { ...S.ready },
    works: worksReady(),
    fruit: S.trees.reduce((a, t) => a + (t ? t.f : 0), 0),
    ripe: S.plots.filter(p => p.c && p.g >= CROPS[p.c].time).length,
    hill: hillReady(),
    hand: offStat.hand,
    lvUp: offStat.lvUp,
    spent: Math.max(0, coins0 - S.coins),
    gift: away >= 3600 ? 50 + S.lvl * 20 : 0
  };
}
function adopt(s2) {
  S = s2;
  S.sheet = null;
  veil.hidden = true;
  F = null;
  S.welcomed = true;
  catchUp();
  buildSeeds();
  crows = [];
  coinShown = S.coins;
  $('#coins').textContent = fmtC(S.coins);
  hudKey = '';
  save();
}
async function pushCloud() {
  if (!cloud || cloud.busy) return;
  cloud.busy = true;
  try {
    S.saved = Date.now();
    await cloud.ref.set({ json: JSON.stringify(S), saved: S.saved, play: Math.round(S.play || 0), v: 3 });
    cloudState = 'on';
  } catch (e) {
    cloudState = e && e.code === 'quota_exceeded' ? 'full' : 'err';
  }
  cloud.busy = false;
}
async function initCloud() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/farm');
    let snap;
    try {
      snap = await ref.get();
    } catch (e) {
      await new Promise(r => setTimeout(r, 800 + rand() * 800));
      snap = await ref.get();
    }
    cloud = { ref, busy: false };
    cloudState = 'on';
    if (snap.exists) {
      const d = snap.data() || {};
      if (
        typeof d.json === 'string' &&
        ((d.saved || 0) > bootSaved + 5000 || ((S.play || 0) < 90 && (d.play || 0) > (S.play || 0) + 60)) &&
        !(S.resetAt && (d.saved || 0) < S.resetAt)
      ) {
        let s2 = null;
        try {
          s2 = load(JSON.parse(d.json));
        } catch (e) {}
        if (s2) {
          adopt(s2);
          toast('已接上云端存档', 'gold');
        }
      }
    }
    pushCloud();
  } catch (e) {
    cloudState = cloud ? 'err' : 'off';
  }
}
bootSaved = S.saved || 0;
const ret0 = catchUp();
rollDaily();
banner = !S.welcomed
  ? null
  : festNow() >= 0
    ? { t: 3, text: FESTS[festNow()].n, sub: '两天节日 · 交节日订单攒章' }
    : { t: 3, text: SEA[season()].n + '天', sub: `第${Math.floor((S.day - 1) / 16) + 1}年` };
coinShown = S.coins;
$('#coins').textContent = fmtC(S.coins);
S.sheet = null;
if (!S.welcomed) {
  S.welcomed = true;
  openSheet('welcome');
} else if (ret0 && ret0.away >= 120) {
  retInfo = ret0;
  banner = null;
  openSheet('back');
}
let last = performance.now(),
  saveT = 0;
let perfT = 0,
  perfN = 0;
function frameBody(n) {
  const raw = (n - last) / 1000,
    dt = Math.min(0.1, raw);
  last = n;
  // 连续两秒帧率不到 40，就把画布分辨率往下调一档
  if (!document.hidden && raw < 0.5) {
    perfT += raw;
    perfN++;
    if (perfT > 2) {
      if (perfN / perfT < 40 && dprCap > 1) {
        dprCap = Math.max(1, dprCap - 0.25);
        resize();
      }
      perfT = perfN = 0;
    }
  }
  T += dt;
  const st = $('#stage');
  if (cw !== st.clientWidth || ch !== st.clientHeight) resize();
  update(dt, false);
  render();
  hud();
  saveT += dt;
  if (saveT > 4) {
    saveT = 0;
    save();
  }
  achT += dt;
  if (achT > 1) {
    achT = 0;
    checkAch();
  }
  if (S.sheet === 'works') {
    const j = W(wsTab).q[0],
      el = document.getElementById('wtime'),
      bar = document.getElementById('wbar0');
    if (j && el) el.textContent = '还要 ' + fmtT(j.t);
    if (j && bar) bar.style.width = (1 - j.t / RECIPES[j.r].t) * 100 + '%';
    const j1 = W(wsTab).q[1],
      b1 = document.getElementById('wbar1');
    if (j1 && b1) b1.style.width = (1 - j1.t / RECIPES[j1.r].t) * 100 + '%';
  }
  if (S.sheet === 'town' && S.town.active) {
    const el = document.getElementById('ctime');
    if (el) el.textContent = '还剩 ' + fmtT(S.town.active.left);
  }
  if (S.sheet === 'orders')
    document.querySelectorAll('[data-exp]').forEach(el => {
      const o = S.orders[+el.dataset.exp];
      if (o && o.exp) el.textContent = '加急 ' + fmtT(o.exp);
    });
  music();
  // 跨过零点换新任务；新手引导结束后，每天第一次打开提醒签到
  if (achT === 0) {
    if (rollDaily()) toast('新的一天，每日任务刷新了', 'gold');
    festRoll();
    if (
      S.tut >= 4 &&
      !S.sheet &&
      !placing &&
      !dailyPrompted &&
      T - sheetT > 6 &&
      S.daily &&
      !S.daily.signed
    ) {
      dailyPrompted = true;
      openSheet('daily');
    }
  }
  S.play = (S.play || 0) + dt;
  cloudT += dt;
  if (cloudT > 15) {
    cloudT = 0;
    pushCloud();
  }
  if (F && F.phase === 'bite') {
    const nd = document.getElementById('needle');
    if (nd) nd.style.left = F.pos * 100 + '%';
  }
  if (camTarget != null) {
    const b0 = camY;
    camY += (camTarget - camY) * Math.min(1, dt * 4);
    applyCam();
    if (Math.abs(camY - b0) < 0.002) camTarget = null;
  }
  updAreas();
  updAllBtn();
  if (coinShown !== S.coins) {
    const d = S.coins - coinShown;
    coinShown += Math.sign(d) * Math.max(1, Math.ceil(Math.abs(d) * 0.15));
    $('#coins').textContent = fmtC(coinShown);
  }
}
// 某一帧出错也不能让游戏卡死：记下来，下一帧照常跑
let frameErr = 0;
function frame(n) {
  try {
    frameBody(n);
  } catch (e) {
    if (!frameErr++) console.error(e);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    pushCloud();
  }
});
initCloud();
setTimeout(siteTips, 5000);
})();
</script>

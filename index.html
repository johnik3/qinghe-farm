function drawLabels() {
  const left = w => Math.max(0, FISHP[w].casts - (S.fish.day === S.day ? S.fish[w] : 0));
  label(`钓鱼 ${left('pond')}/5`, X(POND.x + POND.w - 0.5), Y(POND.y + 0.05));
  const qi = qInfo();
  label(qi ? '村庄复兴' : '复兴完成', X(BRIDGE.x + BRIDGE.w / 2), Y(BRIDGE.y - 0.1));
  if (qi && !qi.lock && (qi.canGive || qi.ready)) {
    const by = Y(BRIDGE.y - 0.55) + Math.sin(T * 5) * U * 0.05;
    circ(ctx, X(4), by, U * 0.17, '#e6a92a');
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(U * 0.24)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', X(4), by + 1);
  }
  if (S.quest.stage >= 2) label(`钓鱼 ${left('lake')}/5`, X(LAKE.x + LAKE.w * 0.6), Y(LAKE.y + 0.12));
  if (S.quest.stage >= 1) label('果园', X(ORCH.x + ORCH.w / 2), Y(ORCH.y + 0.12));
  if (S.quest.stage >= 3)
    label(townOpen() ? '青禾商行 · 集市' : '集市', X(MARKET.x + MARKET.w / 2), Y(MARKET.y + 1.02));
  if (F && (F.phase === 'wait' || F.phase === 'bite')) {
    const P =
      F.w === 'pond'
        ? { x: POND.x + POND.w / 2, y: POND.y + POND.h / 2 }
        : { x: LAKE.x + 1, y: LAKE.y + LAKE.h * 0.48 };
    const bx = X(P.x),
      by = Y(P.y) + (F.phase === 'bite' ? Math.sin(T * 20) * 3 : Math.sin(T * 3) * 1.5);
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(
      bx,
      by + U * 0.05,
      U * (0.12 + (T % 1) * 0.2),
      U * (0.05 + (T % 1) * 0.08),
      0,
      0,
      Math.PI * 2
    );
    ctx.stroke();
    circ(ctx, bx, by, U * 0.06, '#e0453a');
    circ(ctx, bx, by - U * 0.05, U * 0.04, '#fff');
  }
}

/* 绘制田地：土壤、作物各生长阶段、果树 */
function drawSoil(x, y, s, wet) {
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, wet ? '#6a4428' : '#a3744b');
  g.addColorStop(1, wet ? '#573620' : '#8d613c');
  ctx.fillStyle = g;
  rrect(ctx, x, y, s, s, s * 0.14);
  ctx.fill();
  ctx.strokeStyle = wet ? 'rgba(30,15,5,.35)' : 'rgba(70,40,20,.28)';
  ctx.lineWidth = Math.max(1, s * 0.035);
  ctx.lineCap = 'round';
  for (let k = 1; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.14, y + (s * k) / 4);
    ctx.lineTo(x + s * 0.86, y + (s * k) / 4);
    ctx.stroke();
  }
  if (season() === 3 && !wet) {
    ctx.fillStyle = 'rgba(235,245,250,.28)';
    rrect(ctx, x, y, s, s, s * 0.14);
    ctx.fill();
  }
  ctx.strokeStyle = wet ? 'rgba(140,200,230,.25)' : 'rgba(255,230,190,.25)';
  ctx.lineWidth = Math.max(1, s * 0.03);
  rrect(ctx, x + 1.5, y + 1.5, s - 3, s - 3, s * 0.13);
  ctx.stroke();
}

function drawPlant(id, cx, by, s, st, i, g = ctx, still = false) {
  const TT = still ? 0 : T;
  const C = CROPS[id],
    sw = Math.sin(TT * 1.7 + i * 0.9) * 0.08;
  g.save();
  g.translate(cx, by);
  g.rotate(sw * 0.3);
  g.translate(-cx, -by);
  if (st === 0) {
    ell(g, cx, by, s * 0.2, s * 0.08, '#5b3a22');
    for (let k = -1; k <= 1; k++) circ(g, cx + k * s * 0.07, by - s * 0.03, s * 0.025, '#e9d7a8');
  } else if (st === 1) {
    g.strokeStyle = C.leaf;
    g.lineWidth = s * 0.04;
    g.beginPath();
    g.moveTo(cx, by);
    g.lineTo(cx, by - s * 0.15);
    g.stroke();
    leaf(g, cx, by - s * 0.14, s * 0.18, -2.4 + sw, s * 0.07, C.leaf);
    leaf(g, cx, by - s * 0.14, s * 0.18, -0.7 + sw, s * 0.07, '#7cc05a');
  } else if (st === 2) {
    const tall = id === 'corn' || id === 'sunflower',
      h = s * (tall ? 0.48 : 0.28);
    g.strokeStyle = C.leaf;
    g.lineWidth = s * 0.05;
    g.beginPath();
    g.moveTo(cx, by);
    g.lineTo(cx, by - h);
    g.stroke();
    for (let k = 0; k < 4; k++) {
      const yy = by - h * (0.25 + k * 0.22);
      leaf(
        g,
        cx,
        yy,
        s * (0.26 - k * 0.03),
        (k % 2 ? -0.5 : -2.6) + sw,
        s * 0.08,
        k % 2 ? C.leaf : '#6fb24e'
      );
    }
    if (id === 'tomato' || id === 'strawberry' || id === 'melon' || id === 'pumpkin')
      circ(g, cx + s * 0.12, by - s * 0.1, s * 0.06, '#8cc56a');
  } else {
    switch (id) {
      case 'radish':
        for (let k = 0; k < 4; k++)
          leaf(g, cx, by - s * 0.2, s * 0.3, -2.3 + k * 0.5 + sw, s * 0.09, k % 2 ? '#5da34a' : '#6cb755');
        drawItem(g, 'radish', cx, by - s * 0.14, s * 0.22);
        break;
      case 'wheat':
        g.lineCap = 'round';
        for (let k = 0; k < 5; k++) {
          const bx = cx + (k - 2) * s * 0.12,
            tx = bx + Math.sin(TT * 1.7 + i + k) * s * 0.05,
            ty = by - s * (0.5 + (k % 2) * 0.08);
          g.strokeStyle = '#c99a3a';
          g.lineWidth = s * 0.03;
          g.beginPath();
          g.moveTo(bx, by);
          g.quadraticCurveTo(bx, by - s * 0.3, tx, ty);
          g.stroke();
          for (let gi = 0; gi < 4; gi++) {
            ell(g, tx - s * 0.025, ty - gi * s * 0.045, s * 0.025, s * 0.04, '#e8b94a', -0.4);
            ell(g, tx + s * 0.025, ty - gi * s * 0.045, s * 0.025, s * 0.04, '#d9a63a', 0.4);
          }
        }
        break;
      case 'tomato':
        for (const [dx, dy, r] of [
          [-0.15, -0.22, 0.17],
          [0.15, -0.24, 0.17],
          [0, -0.38, 0.19],
          [0, -0.15, 0.16]
        ])
          circ(g, cx + dx * s, by + dy * s, r * s, dy < -0.3 ? '#5aa043' : '#4a8a38');
        for (const [dx, dy] of [
          [-0.13, -0.2],
          [0.14, -0.3],
          [0.02, -0.42]
        ])
          drawItem(g, 'tomato', cx + dx * s, by + dy * s, s * 0.12);
        break;
      case 'corn':
        for (const dx of [-0.14, 0.14]) {
          g.strokeStyle = '#5f9a3a';
          g.lineWidth = s * 0.05;
          g.beginPath();
          g.moveTo(cx + dx * s, by);
          g.lineTo(cx + dx * s, by - s * 0.68);
          g.stroke();
          leaf(g, cx + dx * s, by - s * 0.3, s * 0.3, dx < 0 ? -2.7 : -0.45, s * 0.07, '#6aa140');
          leaf(g, cx + dx * s, by - s * 0.52, s * 0.25, dx < 0 ? -0.6 : -2.5, s * 0.06, '#7fb34d');
          g.strokeStyle = '#d9b45a';
          g.lineWidth = s * 0.02;
          g.beginPath();
          g.moveTo(cx + dx * s, by - s * 0.68);
          g.lineTo(cx + dx * s + s * 0.04, by - s * 0.78);
          g.stroke();
        }
        drawItem(g, 'corn', cx + s * 0.02, by - s * 0.35, s * 0.18);
        break;
      case 'strawberry':
        for (let k = 0; k < 6; k++)
          leaf(g, cx, by - s * 0.08, s * 0.26, -3 + k * 0.55 + sw, s * 0.1, k % 2 ? '#3f8a3e' : '#55a04a');
        for (const [dx, dy] of [
          [-0.18, -0.08],
          [0.17, -0.1],
          [0, -0.2]
        ])
          drawItem(g, 'strawberry', cx + dx * s, by + dy * s, s * 0.11);
        break;
      case 'sunflower':
        g.strokeStyle = '#5c9a3a';
        g.lineWidth = s * 0.05;
        g.beginPath();
        g.moveTo(cx, by);
        g.lineTo(cx, by - s * 0.6);
        g.stroke();
        leaf(g, cx, by - s * 0.2, s * 0.24, -2.7, s * 0.09, '#5c9a3a');
        leaf(g, cx, by - s * 0.32, s * 0.24, -0.4, s * 0.09, '#6fb24e');
        drawItem(g, 'sunflower', cx, by - s * 0.66, s * 0.22);
        break;
      case 'pumpkin':
        leaf(g, cx - s * 0.1, by - s * 0.1, s * 0.3, -2.6, s * 0.12, '#4d8a35');
        leaf(g, cx + s * 0.1, by - s * 0.12, s * 0.3, -0.5, s * 0.12, '#5a9a3e');
        drawItem(g, 'pumpkin', cx, by - s * 0.2, s * 0.3);
        break;
      case 'melon':
        leaf(g, cx - s * 0.15, by - s * 0.05, s * 0.28, -2.8, s * 0.12, '#3e7f33');
        leaf(g, cx + s * 0.12, by - s * 0.08, s * 0.3, -0.3, s * 0.12, '#4f9440');
        drawItem(g, 'melon', cx, by - s * 0.17, s * 0.34);
        break;
    }
  }
  g.restore();
}

function drawPlots() {
  for (let i = 0; i < S.plots.length; i++) {
    const p = S.plots[i],
      q = plotXY(i),
      s = U * 0.9,
      x = X(q.x) + U * 0.05,
      y = Y(q.y) + U * 0.05;
    if (p.L) {
      ctx.fillStyle = season() === 3 ? 'rgba(120,140,150,.15)' : 'rgba(60,100,40,.22)';
      rrect(ctx, x, y, s, s, s * 0.14);
      ctx.fill();
      ctx.setLineDash([U * 0.08, U * 0.07]);
      ctx.strokeStyle = 'rgba(255,255,230,.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
      const wc = season() === 2 ? '#a38f3e' : season() === 3 ? '#8aa094' : '#4f8a3c';
      for (let k = 0; k < 3; k++) {
        const tx = x + s * (0.25 + k * 0.25),
          ty = y + s * (0.55 + (k % 2) * 0.2);
        for (let b = -1; b <= 1; b++) leaf(ctx, tx, ty, s * 0.15, -1.57 + b * 0.5, s * 0.04, wc);
      }
      if (i % 5 === 2) ell(ctx, x + s * 0.7, y + s * 0.3, s * 0.1, s * 0.07, '#a7a59a');
      circ(ctx, x + s * 0.5, y + s * 0.35, s * 0.13, 'rgba(255,255,240,.65)');
      ctx.fillStyle = '#4f7a3a';
      ctx.font = `bold ${Math.round(s * 0.22)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', x + s * 0.5, y + s * 0.36);
      continue;
    }
    withPop(i, x, y, s, () => drawSoil(x, y, s, (p.m > 0 && !!p.c) || raining()));
  }
  for (let i = 0; i < S.plots.length; i++) {
    const p = S.plots[i];
    if (p.L || !p.c) continue;
    const q = plotXY(i),
      s = U * 0.9,
      x = X(q.x) + U * 0.05,
      y = Y(q.y) + U * 0.05,
      C = CROPS[p.c],
      pr = p.g / C.time,
      ripe = pr >= 1,
      st = ripe ? 3 : Math.min(2, Math.floor(pr * 3)),
      cx = x + s / 2;
    let by = y + s * 0.74;
    if (ripe) by -= Math.abs(Math.sin(T * 3 + i)) * s * 0.03;
    if (p.gold && st >= 2) {
      const k = ctx.createRadialGradient(cx, by - s * 0.2, 1, cx, by - s * 0.2, s * 0.55);
      k.addColorStop(0, 'rgba(255,220,90,.55)');
      k.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = k;
      ctx.fillRect(x - s * 0.1, y - s * 0.3, s * 1.2, s * 1.2);
    }
    withPop(i, x, y, s, () => {
      // 作物用预先画好的小图，整株随风轻轻摆
      const sp = plantSprite(p.c, st, s),
        sw = Math.sin(T * 1.7 + i * 0.9) * 0.08;
      ctx.save();
      ctx.translate(cx, by);
      ctx.rotate(sw * 0.3);
      ctx.drawImage(sp, -s * 0.8, -s * 1.5, s * 1.6, s * 1.75);
      ctx.restore();
    });
    if (ripe) {
      for (let k = 0; k < 2; k++) {
        const a = T * 2 + i + k * 3,
          sx = cx + Math.cos(a) * s * 0.35,
          sy = y + s * 0.25 + Math.sin(a * 1.3) * s * 0.2,
          r = s * 0.05 * (0.6 + 0.4 * Math.sin(T * 6 + k));
        star(sx, sy, r, p.gold ? '#ffd84a' : '#fffbe0');
      }
    } else {
      const off = !C.ss.includes(season()) && !S.up.green;
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      rrect(ctx, x + s * 0.14, y + s * 0.86, s * 0.72, s * 0.07, s * 0.035);
      ctx.fill();
      ctx.fillStyle = p.m <= 0 ? '#e8c35a' : off ? '#b9c98a' : '#9bd36a';
      rrect(ctx, x + s * 0.14, y + s * 0.86, s * 0.72 * pr, s * 0.07, s * 0.035);
      ctx.fill();
      if (p.m <= 0) {
        const bx = x + s * 0.84,
          by2 = y + s * 0.12 + Math.sin(T * 4 + i) * s * 0.03;
        circ(ctx, bx, by2, s * 0.16, 'rgba(255,255,255,.92)');
        ctx.beginPath();
        ctx.moveTo(bx, by2 - s * 0.1);
        ctx.quadraticCurveTo(bx + s * 0.08, by2 + s * 0.01, bx, by2 + s * 0.07);
        ctx.quadraticCurveTo(bx - s * 0.08, by2 + s * 0.01, bx, by2 - s * 0.1);
        ctx.fillStyle = '#4aa3c9';
        ctx.fill();
      }
    }
  }
}

function drawFruitTree(tx, ty, tr, i) {
  const x = X(tx),
    y = Y(ty),
    si = season();
  if (y < -U * 2 || y > ch + U * 0.5) return;
  if (!tr) {
    ell(ctx, x, y - U * 0.05, U * 0.32, U * 0.12, '#8d613c');
    ctx.fillStyle = 'rgba(255,255,240,.85)';
    ctx.font = `bold ${Math.round(U * 0.3)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', x, y - U * 0.32);
    return;
  }
  const TR = TREES[tr.k],
    pr = Math.min(1, tr.g / TR.grow);
  if (pr < 0.35) {
    ell(ctx, x, y, U * 0.25, U * 0.09, '#7a5232');
    ctx.strokeStyle = '#6e4a2c';
    ctx.lineWidth = U * 0.05;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - U * 0.4);
    ctx.stroke();
    leaf(ctx, x, y - U * 0.3, U * 0.2, -2.5, U * 0.07, '#6cb755');
    leaf(ctx, x, y - U * 0.38, U * 0.2, -0.6, U * 0.07, '#5da34a');
  } else {
    const s = U * (0.55 + 0.45 * pr),
      sw = Math.sin(T * 0.8 + i) * s * 0.02;
    shadow(x + s * 0.1, y + s * 0.05, s * 0.62, s * 0.2);
    ctx.fillStyle = '#6e4a2c';
    rrect(ctx, x - s * 0.09, y - s * 0.55, s * 0.18, s * 0.58, s * 0.05);
    ctx.fill();
    let dk = TR.c[0],
      lt = TR.c[1];
    if (si === 3 && tr.k !== 'orange') {
      dk = '#8a7f6a';
      lt = '#b5aa92';
    } else if (si === 2 && tr.k !== 'orange') {
      dk = '#b9772a';
      lt = '#e8b84a';
    }
    circ(ctx, x - s * 0.32 + sw, y - s * 0.75, s * 0.36, dk);
    circ(ctx, x + s * 0.32 + sw, y - s * 0.78, s * 0.36, dk);
    circ(ctx, x + sw, y - s * 1.08, s * 0.46, rg(ctx, x + sw, y - s * 1.08, s * 0.5, lt, dk));
    if (si === 0 && tr.k !== 'orange')
      for (let k = 0; k < 8; k++)
        circ(
          ctx,
          x + sw + Math.cos(k * 2.1 + i) * s * 0.4,
          y - s * 0.95 + Math.sin(k * 1.7) * s * 0.3,
          s * 0.05,
          tr.k === 'peach' ? '#f7a6c8' : '#fff0f5'
        );
    if (si === 3) ell(ctx, x + sw, y - s * 1.45, s * 0.32, s * 0.1, '#fbfdff');
    for (let k = 0; k < tr.f * 3; k++) {
      const a = k * 2.39 + i,
        d = s * (0.15 + (((k * 37) % 10) / 10) * 0.3);
      drawItem(ctx, TR.fruit, x + sw + Math.cos(a) * d, y - s * 0.95 + Math.sin(a) * d * 0.8, s * 0.11);
    }
    if (tr.f > 0) star(x + s * 0.45, y - s * 1.3 + Math.sin(T * 4 + i) * 3, s * 0.07, '#fffbe0');
  }
  if (pr < 1) {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    rrect(ctx, x - U * 0.35, y + U * 0.12, U * 0.7, U * 0.07, U * 0.035);
    ctx.fill();
    ctx.fillStyle = '#9bd36a';
    rrect(ctx, x - U * 0.35, y + U * 0.12, U * 0.7 * pr, U * 0.07, U * 0.035);
    ctx.fill();
  }
}

// 种、浇、收时地块轻轻弹一下
function withPop(i, x, y, s, fn) {
  const t0 = plotPop[i];
  if (t0 == null || T - t0 > 0.35) return fn();
  const k = Math.sin(Math.min(1, (T - t0) / 0.35) * Math.PI) * 0.12,
    cx = x + s / 2,
    cy = y + s * 0.6;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1 + k, 1 - k * 0.6);
  ctx.translate(-cx, -cy);
  fn();
  ctx.restore();
}

const plantCache = new Map();
function plantSprite(id, st, s) {
  const k = id + st + '|' + Math.round(s * dpr);
  let c = plantCache.get(k);
  if (c) return c;
  if (plantCache.size > 160) plantCache.clear();
  c = document.createElement('canvas');
  c.width = Math.ceil(s * 1.6 * dpr);
  c.height = Math.ceil(s * 1.75 * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  drawPlant(id, s * 0.8, s * 1.5, s, st, 0, g, true);
  plantCache.set(k, c);
  return c;
}

/* 绘制动物与角色：鸡、牛、羊、乌鸦、猫、狗、商人 */
function hungry(x, y, feed, i) {
  const by = y + Math.sin(T * 3 + i) * 2;
  circ(ctx, x, by, U * 0.13, 'rgba(255,255,255,.92)');
  drawItem(ctx, feed, x, by + U * 0.01, U * 0.09);
}

function drawHen(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.32,
    moving = h.w <= 0,
    b = moving ? Math.abs(Math.sin(T * 10 + i)) * s * 0.08 : 0,
    peck = !moving && Math.sin(T * 3 + i * 2) > 0.6;
  shadow(x, y, s * 0.45, s * 0.12, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  ctx.strokeStyle = '#e0a030';
  ctx.lineWidth = s * 0.08;
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.15);
  ctx.lineTo(-s * 0.12, 0);
  ctx.moveTo(s * 0.1, -s * 0.15);
  ctx.lineTo(s * 0.12, 0);
  ctx.stroke();
  ell(ctx, -s * 0.35, -s * 0.55, s * 0.2, s * 0.28, '#f3ece0', -0.6);
  ell(ctx, 0, -s * 0.42, s * 0.45, s * 0.32, '#fbf7ee');
  ell(ctx, -s * 0.05, -s * 0.42, s * 0.25, s * 0.15, '#e9e0cf', 0.2);
  const hx = peck ? s * 0.42 : s * 0.32,
    hy = peck ? -s * 0.32 : -s * 0.72;
  circ(ctx, hx, hy, s * 0.2, '#fbf7ee');
  circ(ctx, hx - s * 0.02, hy - s * 0.2, s * 0.09, '#e0453a');
  circ(ctx, hx + s * 0.08, hy - s * 0.18, s * 0.07, '#e0453a');
  poly(
    ctx,
    [
      [hx + s * 0.18, hy - s * 0.02],
      [hx + s * 0.34, hy + s * 0.04],
      [hx + s * 0.17, hy + s * 0.08]
    ],
    '#f0a830'
  );
  circ(ctx, hx + s * 0.06, hy - s * 0.04, s * 0.04, '#222');
  ell(ctx, hx + s * 0.12, hy + s * 0.14, s * 0.05, s * 0.08, '#e0453a');
  ctx.restore();
  const st = S.an.hen[i];
  if (st && !st.fed) hungry(x, y - s * 1.35, 'wheat', i);
}

function drawCow(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.55,
    mv = h.w <= 0,
    b = mv ? Math.abs(Math.sin(T * 6 + i)) * s * 0.04 : 0,
    graze = !mv && Math.sin(T * 0.8 + h.ph) > 0.2;
  shadow(x, y, s * 0.62, s * 0.13, 0.22);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  ctx.strokeStyle = '#3a3330';
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  const tw = Math.sin(T * 3 + i) * s * 0.08;
  ctx.moveTo(-s * 0.48, -s * 0.42);
  ctx.quadraticCurveTo(-s * 0.62, -s * 0.3, -s * 0.58 + tw, -s * 0.12);
  ctx.stroke();
  for (const lx of [-0.32, -0.18, 0.2, 0.34]) {
    ctx.fillStyle = '#e9e3d8';
    ctx.fillRect(lx * s - s * 0.05, -s * 0.25, s * 0.1, s * 0.25);
    ctx.fillStyle = '#3a3330';
    ctx.fillRect(lx * s - s * 0.05, -s * 0.05, s * 0.1, s * 0.05);
  }
  ell(ctx, 0, -s * 0.42, s * 0.52, s * 0.28, '#fbfaf5');
  ell(ctx, -s * 0.2, -s * 0.5, s * 0.17, s * 0.12, '#2f2a28', 0.3);
  ell(ctx, s * 0.2, -s * 0.35, s * 0.12, s * 0.09, '#2f2a28', -0.2);
  ell(ctx, -s * 0.38, -s * 0.32, s * 0.08, s * 0.1, '#2f2a28');
  ell(ctx, s * 0.05, -s * 0.18, s * 0.08, s * 0.04, '#f0a7b3');
  const hx = s * 0.55,
    hy = graze ? -s * 0.2 : -s * 0.55;
  ell(ctx, hx, hy, s * 0.2, s * 0.22, '#fbfaf5');
  ell(ctx, hx + s * 0.08, hy + s * 0.13, s * 0.15, s * 0.11, '#f3b3bd');
  circ(ctx, hx + s * 0.03, hy + s * 0.13, s * 0.025, '#8a4a52');
  circ(ctx, hx + s * 0.13, hy + s * 0.13, s * 0.025, '#8a4a52');
  ell(ctx, hx - s * 0.2, hy - s * 0.12, s * 0.1, s * 0.05, '#2f2a28', -0.4);
  leaf(ctx, hx - s * 0.04, hy - s * 0.18, s * 0.12, -2.2, s * 0.03, '#e8dcc0');
  leaf(ctx, hx + s * 0.08, hy - s * 0.18, s * 0.12, -1, s * 0.03, '#e8dcc0');
  circ(ctx, hx + s * 0.02, hy - s * 0.04, s * 0.035, '#1e1a19');
  ctx.restore();
  const st = S.an.cow[i];
  if (st && !st.fed) hungry(x, y - s * 1.05, 'corn', i);
}

function drawSheep(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.42,
    mv = h.w <= 0,
    b = mv ? Math.abs(Math.sin(T * 8 + i)) * s * 0.06 : 0,
    graze = !mv && Math.sin(T * 0.9 + h.ph) > 0.3;
  shadow(x, y, s * 0.55, s * 0.13, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  for (const lx of [-0.28, -0.12, 0.14, 0.3]) {
    ctx.fillStyle = '#3a3330';
    ctx.fillRect(lx * s - s * 0.04, -s * 0.25, s * 0.08, s * 0.25);
  }
  for (const [dx, dy] of [
    [-0.35, -0.45],
    [0, -0.62],
    [0.32, -0.45],
    [-0.18, -0.32],
    [0.16, -0.32],
    [0, -0.42]
  ]) {
    circ(ctx, dx * s, dy * s, s * 0.27, '#ddd6c8');
    circ(ctx, dx * s - s * 0.02, dy * s - s * 0.03, s * 0.24, '#fbf8f0');
  }
  const hx = s * 0.52,
    hy = graze ? -s * 0.25 : -s * 0.55;
  ell(ctx, hx, hy, s * 0.16, s * 0.2, '#3a3330');
  ell(ctx, hx - s * 0.14, hy - s * 0.1, s * 0.1, s * 0.05, '#3a3330', -0.4);
  circ(ctx, hx - s * 0.02, hy - s * 0.16, s * 0.12, '#fbf8f0');
  circ(ctx, hx + s * 0.06, hy - s * 0.02, s * 0.03, '#fff');
  ctx.restore();
}

function drawCrow(c) {
  const x = X(c.x),
    y = Y(c.y),
    s = U * 0.4,
    eat = c.phase === 'eat';
  if (eat) {
    const k = 1 - c.t / 8;
    ctx.strokeStyle = `rgba(216,69,91,${0.5 + 0.4 * Math.sin(T * 8)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, U * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k));
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y - (eat ? 0 : s * 0.3));
  ctx.scale(c.dir || 1, 1);
  const fl = eat ? 0 : Math.sin(c.f * 18);
  const pk = eat && Math.sin(T * 9) > 0.3 ? s * 0.12 : 0;
  ell(ctx, 0, 0, s * 0.45, s * 0.28, '#2b2b36');
  poly(
    ctx,
    [
      [-s * 0.4, 0],
      [-s * 0.75, -s * 0.1],
      [-s * 0.7, s * 0.12]
    ],
    '#22222b'
  );
  circ(ctx, s * 0.38, -s * 0.18 + pk, s * 0.2, '#2b2b36');
  poly(
    ctx,
    [
      [s * 0.55, -s * 0.2 + pk],
      [s * 0.78, -s * 0.12 + pk],
      [s * 0.55, -s * 0.08 + pk]
    ],
    '#6b6b70'
  );
  circ(ctx, s * 0.42, -s * 0.24 + pk, s * 0.05, '#fff');
  circ(ctx, s * 0.43, -s * 0.24 + pk, s * 0.025, '#111');
  poly(
    ctx,
    [
      [-s * 0.1, -s * 0.05],
      [s * 0.15, -s * 0.05],
      [-s * 0.05, -s * 0.05 - s * 0.55 * fl]
    ],
    '#3a3a48'
  );
  if (eat) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s * 0.05, s * 0.25);
    ctx.lineTo(-s * 0.08, s * 0.38);
    ctx.moveTo(s * 0.1, s * 0.25);
    ctx.lineTo(s * 0.12, s * 0.38);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCat() {
  const x = X(CAT.x),
    y = Y(CAT.y),
    s = U * 0.36,
    fur = '#e9a25f',
    dk = '#c47a3a';
  shadow(x, y, s * 0.55, s * 0.12, 0.2);
  if (cat.awake <= 0) {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x - s * 0.05, y - s * 0.2, s * 0.42, 0.3, 1.7);
    ctx.stroke();
    ell(ctx, x, y - s * 0.25, s * 0.48, s * 0.26, fur);
    ctx.strokeStyle = dk;
    ctx.lineWidth = s * 0.06;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * s * 0.18 - s * 0.05, y - s * 0.48);
      ctx.lineTo(x + k * s * 0.16 - s * 0.05, y - s * 0.32);
      ctx.stroke();
    }
    circ(ctx, x + s * 0.38, y - s * 0.24, s * 0.22, fur);
    poly(
      ctx,
      [
        [x + s * 0.22, y - s * 0.36],
        [x + s * 0.26, y - s * 0.58],
        [x + s * 0.38, y - s * 0.42]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.42, y - s * 0.42],
        [x + s * 0.56, y - s * 0.56],
        [x + s * 0.57, y - s * 0.34]
      ],
      fur
    );
    ctx.strokeStyle = '#5c3920';
    ctx.lineWidth = 1.3;
    for (const ex of [0.31, 0.47]) {
      ctx.beginPath();
      ctx.arc(x + s * ex, y - s * 0.24, s * 0.05, 0.3, Math.PI - 0.3);
      ctx.stroke();
    }
    const ph = (T * 0.45) % 1;
    ctx.globalAlpha = 1 - ph;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(U * (0.15 + ph * 0.1))}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('z', x + s * 0.7 + ph * s * 0.3, y - s * 0.75 - ph * s * 0.7);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y - s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.55, y - s * 0.2, x - s * 0.45 + Math.sin(T * 6) * s * 0.12, y - s * 0.6);
    ctx.stroke();
    ell(ctx, x, y - s * 0.35, s * 0.3, s * 0.36, fur);
    ell(ctx, x + s * 0.02, y - s * 0.28, s * 0.15, s * 0.24, '#fbeedd');
    circ(ctx, x, y - s * 0.82, s * 0.26, fur);
    poly(
      ctx,
      [
        [x - s * 0.24, y - s * 0.9],
        [x - s * 0.2, y - s * 1.18],
        [x - s * 0.04, y - s * 1.02]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.24, y - s * 0.9],
        [x + s * 0.2, y - s * 1.18],
        [x + s * 0.04, y - s * 1.02]
      ],
      fur
    );
    circ(ctx, x - s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    circ(ctx, x + s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    poly(
      ctx,
      [
        [x - s * 0.04, y - s * 0.75],
        [x + s * 0.04, y - s * 0.75],
        [x, y - s * 0.7]
      ],
      '#e86a7a'
    );
  }
}

function drawDog() {
  const x = X(dog.x),
    y = Y(dog.y),
    s = U * 0.42,
    mv = dog.w <= 0,
    sp = dog.run ? 18 : 10,

  ctx.strokeStyle = fur;
  ctx.lineWidth = s * 0.12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(-s * 0.4, -s * 0.6, s * 0.14, Math.PI * 0.2 + Math.sin(T * (mv ? 12 : 6)) * 0.3, Math.PI * 1.7);

  ell(ctx, 0, -s * 0.38, s * 0.42, s * 0.22, fur);

  ctx.fillStyle = fur;
  ctx.fillRect(-s * 0.25 - lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.fillRect(s * 0.25 + lg, -s * 0.25, s * 0.1, s * 0.25);
  const hx = s * 0.42,
    hy = -s * 0.64;
  ell(ctx, hx - s * 0.1, hy + s * 0.2, s * 0.12, s * 0.06, '#d8455b');
  circ(ctx, hx, hy, s * 0.24, fur);
  ell(ctx, hx + s * 0.14, hy + s * 0.08, s * 0.13, s * 0.1, cr);
  circ(ctx, hx + s * 0.26, hy + s * 0.04, s * 0.045, '#2a1d14');
  poly(
    ctx,
    [
      [hx - s * 0.18, hy - s * 0.1],
      [hx - s * 0.12, hy - s * 0.38],
      [hx - s * 0.02, hy - s * 0.16]
    ],
    '#b86e2a'
  );
  poly(
    ctx,
    [
      [hx + s * 0.02, hy - s * 0.18],
      [hx + s * 0.1, hy - s * 0.4],
      [hx + s * 0.16, hy - s * 0.14]
    ],
    '#b86e2a'
  );
  circ(ctx, hx + s * 0.06, hy - s * 0.04, s * 0.04, '#2a1d14');
  if (!mv || dog.run) ell(ctx, hx + s * 0.2, hy + s * 0.18, s * 0.05, s * 0.07, '#e86a7a');
  ctx.restore();
}

function drawMerchant() {
  if (!merchHere()) return;
  const x = X(MER.x),
    y = Y(MER.y),
    s = U * 0.5,
    b = Math.abs(Math.sin(T * 2)) * s * 0.03;
  shadow(x, y, s * 0.55, s * 0.12, 0.25);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.strokeStyle = '#6e4a2c';
  ctx.lineWidth = s * 0.06;
  ctx.beginPath();
  ctx.moveTo(s * 0.42, 0);
  ctx.lineTo(s * 0.42, -s * 1.65);
  ctx.stroke();
  poly(
    ctx,
    [
      [s * 0.42, -s * 1.65],
      [s * 0.9, -s * 1.52 + Math.sin(T * 5) * s * 0.05],
      [s * 0.42, -s * 1.38]
    ],
    '#e0453a'
  );
  ctx.fillStyle = '#8d5b36';
  rrect(ctx, -s * 0.66, -s * 1.28, s * 0.56, s * 0.9, s * 0.12);
  ctx.fill();
  ctx.fillStyle = '#6e4a2c';
  ctx.fillRect(-s * 0.66, -s * 0.98, s * 0.56, s * 0.08);
  drawItem(ctx, 'clover', -s * 0.52, -s * 1.36, s * 0.14);
  drawItem(ctx, 'potion', -s * 0.25, -s * 1.4, s * 0.15);
  ctx.fillStyle = '#4a3a5a';
  ctx.fillRect(-s * 0.16, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillRect(s * 0.04, -s * 0.38, s * 0.12, s * 0.38);
  poly(
    ctx,
    [
      [-s * 0.28, -s * 0.36],
      [s * 0.3, -s * 0.36],
      [s * 0.2, -s * 0.98],
      [-s * 0.18, -s * 0.98]
    ],
    '#5a7fb5'
  );
  ctx.fillStyle = '#e8b94a';
  ctx.fillRect(-s * 0.26, -s * 0.58, s * 0.54, s * 0.07);
  circ(ctx, s * 0.02, -s * 1.14, s * 0.2, '#f2c9a0');
  ell(ctx, s * 0.02, -s * 1.0, s * 0.15, s * 0.08, '#e9e4da');
  circ(ctx, -s * 0.05, -s * 1.16, s * 0.025, '#2a1d14');
  circ(ctx, s * 0.09, -s * 1.16, s * 0.025, '#2a1d14');
  ell(ctx, s * 0.02, -s * 1.29, s * 0.36, s * 0.08, '#d9b45a');
  poly(
    ctx,
    [
      [-s * 0.16, -s * 1.29],
      [-s * 0.1, -s * 1.5],
      [s * 0.14, -s * 1.5],
      [s * 0.2, -s * 1.29]
    ],
    '#c9a24a'
  );
  ctx.restore();
  const by = y - s * 2.05 + Math.sin(T * 4) * 3;
  circ(ctx, x, by, U * 0.2, '#fff');
  ctx.fillStyle = '#d8455b';
  ctx.font = `${Math.round(U * 0.24)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('货', x, by + 1);
}

function drawHand() {
  if (!S.up.hand) return;
  const x = X(hand.x),
    y = Y(hand.y),
    s = U * 0.5,
    mv = Math.hypot(hand.tx - hand.x, hand.ty - hand.y) > 0.06,
    b = mv ? Math.abs(Math.sin(T * 11)) * s * 0.05 : 0,
    lg = mv ? Math.sin(T * 11) * s * 0.07 : 0,
    work = !mv && hand.w > 0;
  shadow(x, y, s * 0.35, s * 0.1, 0.22);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(hand.dir || 1, 1);
  ctx.fillStyle = '#3d5f8a';
  ctx.fillRect(-s * 0.16 + lg, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillRect(s * 0.04 - lg, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillStyle = '#5c3920';
  ctx.fillRect(-s * 0.18 + lg, -s * 0.06, s * 0.15, s * 0.06);
  ctx.fillRect(s * 0.03 - lg, -s * 0.06, s * 0.15, s * 0.06);
  rrect(ctx, -s * 0.22, -s * 0.9, s * 0.44, s * 0.56, s * 0.1);
  ctx.fillStyle = '#e8eef0';
  ctx.fill();
  ctx.fillStyle = '#4a78a8';
  ctx.fillRect(-s * 0.2, -s * 0.66, s * 0.4, s * 0.32);
  ctx.fillRect(-s * 0.16, -s * 0.86, s * 0.07, s * 0.22);
  ctx.fillRect(s * 0.09, -s * 0.86, s * 0.07, s * 0.22);
  ctx.strokeStyle = '#f2c9a0';
  ctx.lineWidth = s * 0.1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.2, -s * 0.8);
  ctx.lineTo(s * 0.34, work ? -s * 0.45 + Math.sin(T * 14) * s * 0.08 : -s * 0.5);
  ctx.stroke();
  circ(ctx, 0, -s * 1.08, s * 0.2, '#f2c9a0');
  circ(ctx, s * 0.08, -s * 1.1, s * 0.025, '#2a1d14');
  ell(ctx, s * 0.13, -s * 1.0, s * 0.05, s * 0.03, 'rgba(230,120,110,.5)');
  ell(ctx, 0, -s * 1.22, s * 0.36, s * 0.08, '#d9b45a');
  poly(
    ctx,
    [
      [-s * 0.18, -s * 1.22],
      [-s * 0.12, -s * 1.42],
      [s * 0.14, -s * 1.42],
      [s * 0.2, -s * 1.22]
    ],
    '#e3c26a'
  );
  ctx.fillStyle = '#c0453a';
  ctx.fillRect(-s * 0.18, -s * 1.27, s * 0.38, s * 0.05);
  ctx.fillStyle = '#a87448';
  rrect(ctx, -s * 0.42, -s * 0.62, s * 0.26, s * 0.2, s * 0.05);
  ctx.fill();
  ctx.restore();
}
// 自动喷灌：田边的喷头转着洒水
function drawSprinklers() {
  if (S.up.water < 4 || raining()) return;
  for (const [sx, sy] of [
    [0.86, 3.12],
    [7.14, 3.12],
    [0.86, 8.42],
    [7.14, 8.42],
    [0.82, 5.75],
    [7.18, 5.75]
  ]) {
    const x = X(sx),
      y = Y(sy);
    if (y < -U || y > ch + U) continue;
    ctx.fillStyle = '#7a8a90';
    ctx.fillRect(x - U * 0.03, y - U * 0.18, U * 0.06, U * 0.18);
    circ(ctx, x, y - U * 0.2, U * 0.05, '#9fb0b6');
    for (let k = 0; k < 7; k++) {
      const a = T * 2.2 + sx + k * 0.12,
        r = U * (0.5 + ((T * 1.5 + k * 0.37) % 1) * 1.4);
      ctx.globalAlpha = 0.8 * (1 - ((T * 1.5 + k * 0.37) % 1));
      circ(ctx, x + Math.cos(a) * r, y - U * 0.2 + Math.sin(a) * r * 0.45, U * 0.04, '#d6f0ff');
    }
    ctx.globalAlpha = 1;
  }
}

/* 绘制南岸：河、桥、果园、湖与码头、集市 */
function drawSouth() {
  const st = S.quest.stage,
    si = season(),
    win = si === 3,
    y0 = Y(RIVER.y),
    h = RIVER.h * U;
  if (y0 > ch + U * 0.5 || Y(WH) < -U) return;
  ctx.fillStyle = win ? '#dfe6e8' : '#c9b583';
  ctx.fillRect(0, y0 - U * 0.12, cw, h + U * 0.24);
  ctx.fillStyle = lg(ctx, y0, y0 + h, win ? '#e4f2f8' : '#6cc0e0', win ? '#b3d4e2' : '#3b88b0');
  ctx.fillRect(0, y0, cw, h);
  ctx.lineCap = 'round';
  if (!win) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 16; k++) {
      const x = ((k * 137 + T * 40) % (cw + 160)) - 80,
        yy = y0 + h * (0.2 + (k % 4) * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + U * 0.35, yy);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 8; k++) {
      const x = (k * 173) % cw;
      ctx.beginPath();
      ctx.moveTo(x, y0 + h * 0.3);
      ctx.lineTo(x + U * 0.4, y0 + h * 0.6);
      ctx.lineTo(x + U * 0.7, y0 + h * 0.4);
      ctx.stroke();
    }
  }
  const bx = X(BRIDGE.x),
    by = Y(BRIDGE.y),
    bw = BRIDGE.w * U,
    bh = BRIDGE.h * U;
  ell(ctx, bx + bw / 2, y0 + h * 0.6, bw * 0.6, h * 0.3, 'rgba(20,40,60,.18)');
  const post = (px, py) => {
    ctx.fillStyle = '#5c3920';
    rrect(ctx, px - U * 0.06, py - U * 0.12, U * 0.12, U * 0.22, U * 0.03);
    ctx.fill();
  };
  if (st >= 1) {
    ctx.fillStyle = '#a87448';
    rrect(ctx, bx, by, bw, bh, U * 0.06);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.5;
    for (let k = 1; k < 9; k++) {
      const yy = by + (bh * k) / 9;
      ctx.beginPath();
      ctx.moveTo(bx + 2, yy);
      ctx.lineTo(bx + bw - 2, yy);
      ctx.stroke();
    }
    ctx.strokeStyle = '#7a5232';
    ctx.lineWidth = U * 0.06;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.04, by);
    ctx.lineTo(bx + U * 0.04, by + bh);
    ctx.moveTo(bx + bw - U * 0.04, by);
    ctx.lineTo(bx + bw - U * 0.04, by + bh);
    ctx.stroke();
    for (const k of [0, 0.5, 1]) {
      post(bx + U * 0.04, by + bh * k);
      post(bx + bw - U * 0.04, by + bh * k);
    }
    if (win) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(bx + U * 0.1, by, bw - U * 0.2, bh);
    }
  } else {
    ctx.fillStyle = '#8d6440';
    ctx.fillRect(bx + U * 0.08, by, bw - U * 0.16, bh * 0.28);
    ctx.fillRect(bx + U * 0.08, by + bh * 0.78, bw - U * 0.16, bh * 0.22);
    ctx.save();
    ctx.translate(bx + bw * 0.55, by + bh * 0.5);
    ctx.rotate(0.5);
    ctx.fillRect(-bw * 0.3, -U * 0.05, bw * 0.6, U * 0.1);
    ctx.restore();
    ctx.strokeStyle = '#c9a66b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.06, by + bh * 0.28);
    ctx.quadraticCurveTo(bx + U * 0.25, by + bh * 0.55, bx + U * 0.06, by + bh * 0.78);
    ctx.stroke();
    post(bx + U * 0.06, by);
    post(bx + bw - U * 0.06, by);
    post(bx + U * 0.06, by + bh);
    post(bx + bw - U * 0.06, by + bh);
  }
  const O = ORCH;
  ctx.fillStyle = win ? 'rgba(255,255,255,.3)' : 'rgba(120,90,50,.16)';
  rrect(ctx, X(O.x), Y(O.y), O.w * U, O.h * U, U * 0.15);
  ctx.fill();
  fenceRect(O.x, O.y + 0.15, O.w, O.h - 0.15, [O.x + 2.55, O.x + 3.15]);
  if (st < 1) {
    for (let k = 0; k < 6; k++)
      drawTree({
        x: O.x + 0.55 + (k % 3) * 1.1,
        y: O.y + 1.2 + Math.floor(k / 3) * 1.45,
        s: 0.5,
        k: 'bush',
        h: k * 0.13
      });
    sign(O.x + O.w / 2, O.y + 0.9, '果园', '修好石桥后开放');
  } else TSLOT.forEach(([tx, ty], i) => drawFruitTree(tx, ty, S.trees[i], i));
  const L = LAKE,
    lx = X(L.x + L.w / 2),
    ly = Y(L.y + L.h / 2),
    rx = (L.w * U) / 2,
    ry = (L.h * U) / 2;
  ell(ctx, lx, ly + 3, rx + U * 0.1, ry + U * 0.1, win ? '#b9c7c9' : '#7a8a6a');
  const lgd = ctx.createRadialGradient(lx - rx * 0.3, ly - ry * 0.3, 2, lx, ly, rx);
  lgd.addColorStop(0, win ? '#eef7fb' : '#8fd3e8');
  lgd.addColorStop(1, win ? '#a9cfe0' : '#2f7fa8');
  ell(ctx, lx, ly, rx, ry, lgd);
  if (!win) {
    for (const [dx, dy] of [
      [0.55, 0.35],
      [0.45, -0.45],
      [-0.15, 0.55]
    ]) {
      const px = lx + dx * rx,
        py = ly + dy * ry;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, U * 0.14, 0.3, Math.PI * 2 - 0.1);
      ctx.closePath();
      ctx.fillStyle = '#5aa047';
      ctx.fill();
    }
    for (let k = 0; k < 6; k++) {
      const rxp = lx + rx * (0.72 + (k % 3) * 0.08),
        ryp = ly - ry * 0.5 + k * ry * 0.18,
        sw = Math.sin(T + k) * 2;
      ctx.strokeStyle = '#5f8a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rxp, ryp);
      ctx.lineTo(rxp + sw, ryp - U * 0.35);
      ctx.stroke();
      ell(ctx, rxp + sw, ryp - U * 0.38, U * 0.03, U * 0.08, '#8a5a2b');
    }
    const jp = (T * 0.3) % 4;
    if (jp < 1) {
      const a = jp * Math.PI,
        fx = lx + rx * 0.1 + jp * U * 0.6,
        fy = ly + ry * 0.1 - Math.sin(a) * U * 0.5;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(-Math.cos(a) * 0.9);
      ell(ctx, 0, 0, U * 0.13, U * 0.05, '#cf9a3c');
      ctx.restore();
    } else if (jp < 1.6) {
      ctx.strokeStyle = `rgba(255,255,255,${1.6 - jp})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(
        lx + rx * 0.1 + U * 0.6,
        ly + ry * 0.1,
        U * Math.max(0.01, jp - 0.8) * 0.5,
        U * Math.max(0.01, jp - 0.8) * 0.2,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }
  }
  if (st >= 2) {
    const dx0 = X(L.x - 0.05),
      dy0 = Y(L.y + L.h * 0.42);
    ctx.fillStyle = '#a87448';
    rrect(ctx, dx0, dy0, U * 1.3, U * 0.38, U * 0.04);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < 7; k++) {
      ctx.beginPath();
      ctx.moveTo(dx0 + (k * U * 1.3) / 7, dy0);
      ctx.lineTo(dx0 + (k * U * 1.3) / 7, dy0 + U * 0.38);
      ctx.stroke();
    }
    for (const k of [0, 0.5, 1]) circ(ctx, dx0 + k * U * 1.25 + U * 0.03, dy0 + U * 0.4, U * 0.05, '#5c3920');
    const bxx = X(L.x + L.w * 0.62),
      byy = Y(L.y + L.h * 0.68) + Math.sin(T * 1.5) * 2;
    ctx.beginPath();
    ctx.moveTo(bxx - U * 0.42, byy);
    ctx.quadraticCurveTo(bxx, byy + U * 0.3, bxx + U * 0.42, byy);
    ctx.closePath();
    ctx.fillStyle = '#8d5b36';
    ctx.fill();
    ctx.fillStyle = '#b07a4c';
    ctx.fillRect(bxx - U * 0.32, byy - U * 0.03, U * 0.64, U * 0.05);
  } else sign(L.x + L.w * 0.3, L.y + 0.2, '码头', '复兴第二步');
  const M = MARKET;
  if (st >= 3) {
    const cols = [
        ['#d8455b', '#fff'],
        ['#4a8fd0', '#fff'],
        ['#e6a92a', '#fff']
      ],
      goods = [
        ['tomato', 'pumpkin', 'melon'],
        ['egg', 'milk', 'cheese'],
        ['apple', 'cake', 'flour']
      ];
    for (let k = 0; k < 3; k++) {
      const sx = X(M.x + 0.15 + k * 1.17),
        sy = Y(M.y + 0.15),
        sw = U,
        sh = U * 0.8;
      shadow(sx + sw / 2, sy + sh, sw * 0.55, U * 0.1);
      ctx.fillStyle = '#a87448';
      ctx.fillRect(sx + U * 0.05, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillRect(sx + sw - U * 0.11, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillStyle = '#c9a06a';
      ctx.fillRect(sx, sy + sh * 0.6, sw, sh * 0.35);
      for (let j = 0; j < 5; j++) {
        ctx.fillStyle = cols[k][j % 2];
        ctx.beginPath();
        ctx.moveTo(sx + (j * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy + U * 0.28);
        ctx.arc(sx + ((j + 0.5) * sw) / 5, sy + U * 0.28, sw / 10, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
      }
      goods[k].forEach((g2, j) => drawItem(ctx, g2, sx + sw * (0.2 + j * 0.3), sy + sh * 0.6, U * 0.13));
    }
    ctx.strokeStyle = 'rgba(90,60,30,.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X(M.x), Y(M.y));
    ctx.quadraticCurveTo(X(M.x + M.w / 2), Y(M.y + 0.3), X(M.x + M.w), Y(M.y));
    ctx.stroke();
    for (let k = 0; k < 11; k++) {
      const t2 = k / 10,
        px = X(M.x + M.w * t2),
        py = Y(M.y) + Math.sin(t2 * Math.PI) * U * 0.15;
      poly(
        ctx,
        [
          [px - U * 0.06, py],
          [px + U * 0.06, py],
          [px, py + U * 0.14]
        ],
        ['#d8455b', '#f7cb4d', '#4a8fd0', '#5f9e3e'][k % 4]
      );
    }
    if (townOpen()) {
      const own = Object.keys(SHOPS).filter(k => shopLv(k));
      own.forEach((k, j) => {
        const fx = X(M.x + 0.25 + j * 0.78),
          fy = Y(M.y - 0.55),
          fl = Math.sin(T * 2.2 + j) * U * 0.04;
        ctx.fillStyle = '#5c3920';
        ctx.fillRect(fx, fy, U * 0.04, U * 0.62);
        ctx.fillStyle = SHOPS[k].c;
        ctx.beginPath();
        ctx.moveTo(fx + U * 0.04, fy);
        ctx.lineTo(fx + U * 0.42, fy + U * 0.06 + fl);
        ctx.lineTo(fx + U * 0.04, fy + U * 0.26);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.round(U * 0.13)}px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(SHOPS[k].n[0], fx + U * 0.17, fy + U * 0.13 + fl * 0.4);
      });
    }
  } else sign(M.x + M.w / 2, M.y, '集市', '复兴第三步');
}

/* 绘制青禾茶山：山坡、石阶、梯田茶树、蜂箱、茶坊、半山茶亭、老茶馆，未开放时的云雾 */
const HILL_TONE = [
  ['#93c463', '#76ad4c', '#5f9440'],
  ['#74ad4c', '#5a963d', '#477d31'],
  ['#b9ad62', '#a1964f', '#86803f'],
  ['#e9f0f1', '#d6e2e5', '#c4d3d8']
];
function hillBase(si) {
  const [a, b] = HILL_TONE[si],
    y0 = Y(HILL.y),
    y1 = Y(WH + 0.5);
  const gr = ctx.createLinearGradient(0, y0 - U * 0.4, 0, y1);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.06, a);
  gr.addColorStop(1, b);
  ctx.fillStyle = gr;
  ctx.fillRect(0, y0 - U * 0.4, cw, y1 - y0 + U * 0.4);
  // 山坡上的草纹
  ctx.strokeStyle = si === 3 ? 'rgba(150,170,175,.35)' : 'rgba(40,80,30,.18)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let k = 0; k < 60; k++) {
    const gx = ((k * 0.61) % 8) + 0.1,
      gy = HILL.y + 0.4 + ((k * 1.37) % 8.2);
    ctx.moveTo(X(gx), Y(gy));
    ctx.lineTo(X(gx) + 2, Y(gy) - U * 0.12);
  }
  ctx.stroke();
}
// 石阶小路：后花园 → 右侧 → 老茶馆门口
function hillPath(si) {
  const stones = [];
  for (let y = 22.75; y < 28.2; y += 0.36) stones.push([5.0 + Math.sin(y * 2.1) * 0.06, y]);
  for (let k = 0; k < 4; k++) stones.push([4.85 - k * 0.24, 28.3 + k * 0.1]);
  const c = si === 3 ? ['#c9d3d6', '#b4c0c4'] : ['#c2b8a0', '#a89d84'];
  for (const [x, y] of stones) {
    ell(ctx, X(x), Y(y) + 2, U * 0.2, U * 0.085, 'rgba(40,40,20,.15)');
    ell(ctx, X(x), Y(y), U * 0.2, U * 0.085, c[0]);
    ell(ctx, X(x) - U * 0.03, Y(y) - U * 0.015, U * 0.12, U * 0.04, c[1]);
  }
}
function terraceBand(t, si) {
  const y0 = TERR.y + t * TERR.h,
    x0 = X(TERR.x),
    x1 = X(TERR.x + TERR.w),
    top = Y(y0),
    bot = Y(y0 + TERR.h),
    open = terrOpen(t),
    win = si === 3;
  // 台面
  ctx.fillStyle = open
    ? win
      ? '#e3e9e6'
      : ['#8a6a44', '#7d5f3b', '#8a6a44', '#9a8a70'][si]
    : win
      ? '#dfe7e8'
      : HILL_TONE[si][2];
  ctx.beginPath();
  ctx.moveTo(x0 + U * 0.1, top + U * 0.05);
  ctx.quadraticCurveTo((x0 + x1) / 2, top - U * 0.06, x1 - U * 0.1, top + U * 0.05);
  ctx.lineTo(x1, bot - U * 0.16);
  ctx.quadraticCurveTo((x0 + x1) / 2, bot - U * 0.04, x0, bot - U * 0.16);
  ctx.closePath();
  ctx.fill();
  if (open && !win) {
    // 垄沟
    ctx.strokeStyle = 'rgba(60,40,20,.25)';
    ctx.lineWidth = 1.2;
    for (const f of [0.35, 0.62]) {
      ctx.beginPath();
      ctx.moveTo(x0 + U * 0.2, top + (bot - top) * f);
      ctx.quadraticCurveTo(
        (x0 + x1) / 2,
        top + (bot - top) * (f + 0.06),
        x1 - U * 0.2,
        top + (bot - top) * f
      );
      ctx.stroke();
    }
  }
  // 石坎
  const n = Math.round(TERR.w / 0.3);
  for (let k = 0; k < n; k++) {
    const sx = x0 + ((x1 - x0) * (k + 0.5)) / n,
      sy = bot - U * 0.1 + Math.sin(k * 1.3) * U * 0.01 - Math.sin((k / n) * Math.PI) * U * 0.04;
    ctx.fillStyle = k % 3 === 0 ? '#9d9a8a' : k % 3 === 1 ? '#b0ad9c' : '#8f8c7c';
    rrect(ctx, sx - U * 0.15, sy - U * 0.09, U * 0.28, U * 0.18, U * 0.06);
    ctx.fill();
  }
  if (win)
    for (let k = 0; k < n; k += 2)
      ell(ctx, x0 + ((x1 - x0) * (k + 0.5)) / n, bot - U * 0.19, U * 0.13, U * 0.03, '#fbfdff');
  if (!open) {
    // 荒着：杂草和石头
    for (let k = 0; k < 9; k++) {
      const gx = TERR.x + 0.3 + ((k * 0.53) % 4.1),
        gy = y0 + 0.3 + ((k * 0.37) % 0.4);
      ctx.strokeStyle = win ? '#9db4a3' : '#3f6e2c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (const d of [-0.08, 0, 0.08]) {
        ctx.moveTo(X(gx + d), Y(gy));
        ctx.lineTo(X(gx + d * 1.8), Y(gy - 0.2));
      }
      ctx.stroke();
      if (k % 3 === 0) ell(ctx, X(gx + 0.2), Y(gy + 0.05), U * 0.08, U * 0.05, '#9d9c8e');
    }
    if (t === S.hill.terr && hillOpen())
      sign(
        TERR.x + TERR.w / 2,
        y0 + 0.08,
        '开垦梯田',
        S.lvl >= TERR_LVL[t] ? TERR_COST[t] + ' 金币' : TERR_LVL[t] + '级解锁'
      );
  }
}
function drawBush(i, si, night) {

    for (let k = 0; k < 7; k++) {

          }

        }

    }
    if (win) ell(ctx, x + sw, cy - U * 0.2 * sc, U * 0.26 * sc, U * 0.07 * sc, '#fbfdff');
  }
  if (grown && b.f >= B.cap)
    star(x + U * 0.26, y - U * 0.62 + Math.sin(T * 4 + i) * U * 0.03, U * 0.07, '#fff6b0');

    ctx.arc(x, y - U * 0.62, U * 0.09, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (b.g / B.grow));
    ctx.stroke();
  }

      ctx.fillRect(px - U * 0.06, py - U * 0.14, U * 0.12, U * 0.03);

}

function drawTut() {
  if (S.sheet) return;
  let tx, ty, txt, i;
  if (S.tut >= 4) {
    const g = hillGuide();
    if (!g) return;
    [tx, ty, txt] = g;
    return tutArrow(tx, ty, txt);
  }
  const at = k => {
    const q = plotXY(k);
    tx = q.x + 0.5;
    ty = q.y + 0.22;
  };
  if (S.tut === 0) {
    i = S.plots.findIndex(p => !p.L && !p.c);
    if (i < 0) return;
    at(i);
    txt = '点这里播种';
  } else if (S.tut === 1) {
    i = S.plots.findIndex(p => p.c && p.m <= 0 && p.g < CROPS[p.c].time);
    if (i < 0) return;
    at(i);
    txt = '土是干的，点它浇水';
  } else if (S.tut === 2) {
    i = S.plots.findIndex(p => p.c && p.g >= CROPS[p.c].time);
    if (i >= 0) {
      at(i);
      txt = '熟了！点它收获';

      i = S.plots.findIndex(p => p.c && p.m <= 0);

function tutArrow(tx, ty, txt) {
  const x = X(tx),
    y = Y(ty) - Math.abs(Math.sin(T * 4)) * U * 0.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-U * 0.18, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.22);
  ctx.lineTo(U * 0.18, -U * 0.22);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5c3920';
  ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(U * 0.26)}px ${FONT}`;
  const w = ctx.measureText(txt).width + U * 0.32,
    bx = Math.max(w / 2 + 4, Math.min(cw - w / 2 - 4, x));
  ctx.fillStyle = 'rgba(92,57,32,.94)';
  rrect(ctx, bx - w / 2, y - U * 0.92, w, U * 0.38, U * 0.13);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, y - U * 0.72);
}

    ctx.strokeText(f.t, X(f.x), Y(f.y));
    ctx.fillStyle = f.c;
    ctx.fillText(f.t, X(f.x), Y(f.y));
  }
  ctx.globalAlpha = 1;
  drawTut();
  drawBanner();
}

/* 输入：点击、拖动种地、平移、双指缩放、滚轮 */
let drag = null,
  pan = null,
  pinch = null;
const ptrs = new Map();
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / U, y: (e.clientY - r.top - oy) / U };
}
function sxy(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
const inR = (p, R, pad = 0) =>
  p.x >= R.x - pad && p.x <= R.x + R.w + pad && p.y >= R.y - pad && p.y <= R.y + R.h + pad;
function plotAt(p) {
  const c = Math.floor(p.x - 1),
    r = Math.floor(p.y - 3.25);
  if (c < 0 || c >= PC || r < 0 || r >= PR) return -1;
  return r * PC + c;
}
function tap(p) {
  if (placing) {
    const i = nearestSpot(p, true);
    if (i >= 0) placeAt(i);
    else toast('点闪烁的空位来摆放，摆完点上面的「完成」');
    return;
  }
  const di = decorAt(p);
  if (di >= 0) return openSheet('decoritem', di);
  if (inR(p, GARDEN)) return openSheet('decor');
  if (hillTap(p)) return;
  if (Math.hypot(p.x - CAT.x, p.y - (CAT.y - 0.15)) < 0.36) return petCat();
  if (S.dog && Math.hypot(p.x - dog.x, p.y - (dog.y - 0.2)) < 0.42) return petDog();
  if (merchHere() && Math.hypot(p.x - MER.x, p.y - (MER.y - 0.45)) < 0.55) return openSheet('merch');
  if (inR(p, HOUSE)) return openSheet('barn');
  if (inR(p, BOARD, 0.1)) return openSheet('orders');
  if (inR(p, YARD)) {
    if (!S.coop) return openSheet('shop');
    if (collect('coop')) return;
    return openSheet('coop');
  }
  if (inR(p, MILL)) {
    if (S.mill.built && collectWork('mill')) return;
    return openWorks('mill');
  }
  for (const k in WRECT)
    if (inR(p, WRECT[k], 0.05)) {
      if (W(k).built && collectWork(k)) return;
      return openWorks(k);
    }
  if (inR(p, PAST)) {
    if (!S.pasture) return openSheet('shop');
    if (collect('pasture')) return;
    return openSheet('pasture');
  }
  if (inR(p, POND, 0.1)) return openFish('pond');
  if (inR(p, BRIDGE, 0.25)) return openSheet('quest');
  if (inR(p, ORCH)) {
    if (S.quest.stage < 1) return openSheet('quest');
    let bi = -1,
      bd = 0.65;
    TSLOT.forEach(([x, y], k) => {
      const d = Math.hypot(p.x - x, p.y - (y - 0.45));
      if (d < bd) {
        bd = d;
        bi = k;
      }
    });
    if (bi >= 0) treeTap(bi);
    return;
  }
  if (inR(p, LAKE)) {
    if (S.quest.stage < 2) {
      toast('湖边还没有码头，完成「开辟码头」就能来钓大鱼');
      return openSheet('quest');
    }
    return openFish('lake');
  }
  if (inR(p, MARKET)) {
    if (S.quest.stage < 3) return openSheet('quest');
    return openSheet(townOpen() ? 'town' : 'barn');
  }
  const i = plotAt(p);
  if (i >= 0) plotAction(i, null);
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const sp = sxy(e);
  ptrs.set(e.pointerId, sp);
  try {
    cv.setPointerCapture(e.pointerId);
  } catch (_) {}
  if (ptrs.size === 2) {
    drag = null;
    pan = null;
    const [a, b] = [...ptrs.values()],
      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom, wx: (cx - ox) / U, wy: (cy - oy) / U };
    camTarget = null;
    return;
  }
  if (ptrs.size > 2) return;
  const p = toWorld(e);
  for (const c of crows) {
    if (c.phase !== 'out' && Math.hypot(c.x - p.x, c.y - 0.15 - p.y) < 0.6) {
      shoo(c);
      return;
    }
  }
  const bi = placing || !hillOpen() ? -1 : bushAt(p);
  if (bi >= 0 && S.hill.bush[bi] && S.hill.bush[bi].f) {
    pitch = 1;
    dragN = 0;
    pickBush(bi);
    drag = { mode: 'pick', last: bi };
    return;
  }
  const i = placing ? -1 : plotAt(p);
  if (i >= 0 && !S.plots[i].L) {
    pitch = 1;
    dragN = 0;
    const m = plotAction(i, null);
    if (m && m !== 'none') drag = { mode: m, last: i };
    return;
  }
  pan = { sx: sp.x, sy: sp.y, cx: camX, cy: camY, moved: false, p };
  camTarget = null;
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const sp = sxy(e);
  ptrs.set(e.pointerId, sp);
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()],
      d = Math.hypot(a.x - b.x, a.y - b.y) || 1,
      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    zoom = Math.max(0.8, Math.min(2.2, (pinch.z * d) / pinch.d));
    U = baseU() * zoom;
    camX = pinch.wx - (cx - cw / 2) / U;
    camY = pinch.wy - (cy - ch / 2) / U;
    applyCam();
    return;
  }
  if (drag && drag.mode === 'pick') {
    const bi = bushAt(toWorld(e));
    if (bi >= 0 && bi !== drag.last) {
      drag.last = bi;
      if (S.hill.bush[bi] && S.hill.bush[bi].f) {
        dragN++;
        pitch = PENTA[Math.min(dragN, PENTA.length - 1)];
        pickBush(bi);
      }
    }
  } else if (drag) {
    const i = plotAt(toWorld(e));
    if (i >= 0 && i !== drag.last) {
      drag.last = i;
      dragN++;
      pitch = PENTA[Math.min(dragN, PENTA.length - 1)];
      plotAction(i, drag.mode);
    }
  } else if (pan) {
    const dx = sp.x - pan.sx,
      dy = sp.y - pan.sy;
    if (!pan.moved && Math.hypot(dx, dy) > 8) pan.moved = true;
    if (pan.moved) {
      camX = pan.cx - dx / U;
      camY = pan.cy - dy / U;
      applyCam();
    }
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (pan && !pan.moved && e.type === 'pointerup') tap(pan.p);
  pan = null;
  drag = null;
  if (ptrs.size < 2) pinch = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener(
  'wheel',
  e => {
    e.preventDefault();
    if (e.ctrlKey) zoom = Math.max(0.8, Math.min(2.2, zoom * Math.exp(-e.deltaY * 0.01)));
    else {
      camY += e.deltaY / U;
      camX += e.deltaX / U;
    }
    camTarget = null;
    applyCam();
  },
  { passive: false }
);

// ---------- 茶山：连采 ----------
function bushAt(p) {
  if (p.x < TERR.x || p.x > TERR.x + TERR.w || p.y < TERR.y || p.y > TERR.y + TERR.h * 5) return -1;
  let bi = -1,
    bd = 0.6;
  for (let i = 0; i < 20; i++) {
    if (!terrOpen(Math.floor(i / 4))) continue;
    const q = bushXY(i),
      d = Math.hypot(p.x - q.x, p.y - (q.y - 0.3));
    if (d < bd) {
      bd = d;
      bi = i;
    }
  }
  return bi;
}

// ---------- 品质 ----------
const QN = ['普通', '优', '特优'],
  QM = [1, 1.25, 1.6];
const qOpen = () => S.lvl >= 6;
function qNorm(id) {
  const v = S.qv[id];
  if (!v) return;
  let over = v[0] + v[1] - (S.inv[id] || 0);
  if (over > 0) {
    const d = Math.min(v[0], over);
    v[0] -= d;
    over -= d;
    v[1] = Math.max(0, v[1] - over);
  }
}
// [普通, 优, 特优]
function qCounts(id) {
  qNorm(id);
  const v = S.qv[id] || [0, 0],
    n = S.inv[id] || 0;
  return [n - v[0] - v[1], v[0], v[1]];
}
function addQ(id, n, q) {
  if (!q || !n) return;
  if (!S.qv[id]) S.qv[id] = [0, 0];
  S.qv[id][q - 1] += n;
}
// 从 minQ 档起由低到高拿；够就扣掉并返回 true
function takeInv(id, n, minQ = 0) {
  const c = qCounts(id);
  let have = 0;
  for (let q = minQ; q < 3; q++) have += c[q];
  if (have < n) return false;
  let left = n;
  for (let q = minQ; q < 3 && left > 0; q++) {
    const d = Math.min(c[q], left);
    c[q] -= d;
    left -= d;
  }
  S.inv[id] -= n;
  if (S.qv[id]) S.qv[id] = [c[1], c[2]];
  return true;
}
const haveQ = (id, minQ) =>
  qCounts(id)
    .slice(minQ)
    .reduce((a, b) => a + b, 0);
// 卖掉 n 个（先卖低档）能得多少钱
function sellValue(id, n) {
  const c = qCounts(id),
    pr = priceOf(id);
  let g = 0;
  for (let q = 0; q < 3 && n > 0; q++) {
    const d = Math.min(c[q], n);
    g += Math.round(pr * QM[q]) * d;
    n -= d;
  }
  return g;
}
// 收获时定档
function harvestQ(p) {
  if (!qOpen()) return 0;
  if (p.gold) return 2;
  const C = CROPS[p.c];
  let s = 0;
  if (C.ss.includes(season())) s++;
  if ((p.dry || 0) < C.time * 0.15) s++;
  if (S.up.fert >= 2) s++;
  if ((p.ov || 0) < 60) s++;
  const ex = [0, 0, 0.05, 0.2, 0.45][s] + (s >= 2 ? S.res.seed * 0.02 : 0),
    gd = [0, 0.15, 0.45, 0.6, 0.5][s],
    r = rand();
  return r < ex ? 2 : r < ex + gd ? 1 : 0;
}

// ---------- 委托 ----------
const CT = [
  { n: '铜', mult: 2.2, time: 900, rep: 1, need: 0, kinds: 2, base: l => 600 + l * 120 },
  { n: '银', mult: 3, time: 1500, rep: 2, need: 3, kinds: 3, base: l => 1500 + l * 250 },
  { n: '金', mult: 4, time: 2400, rep: 4, need: 10, kinds: 3, base: l => 3500 + l * 500 }
];
const townOpen = () => S.lvl >= 8 && S.quest.stage >= 3;
// 时限内大概能产出多少（按现有动物、工坊、茶树、果树估一半多一点），委托不会要做不出来的量
function cCap(id, t) {
  const lim = CT[t].time,
    k = 0.6;
  if (CROPS[id]) return [12, 16, 20][t];
  if (RECIPES[id]) {
    const w = W(RECIPES[id].w);
    return Math.floor(((lim * [0.35, 0.45, 0.55][t]) / RECIPES[id].t) * (w.p2 ? 2 : 1));
  }
  if (ANIM_OF[id]) {
    const a = ANIM_OF[id];
    return Math.floor(((S.an[a].length * lim) / ANIM[a].t) * k);
  }
  if (id === 'honey') return Math.floor(((S.hill.hive.filter(Boolean).length * lim) / 90) * k);
  for (const bk in BUSH)
    if (BUSH[bk].item === id) {
      if (!BUSH[bk].ss.includes(season())) return 0;
      return Math.floor(
        ((S.hill.bush.filter(b => b && b.k === bk && bushReady(b)).length * lim) / BUSH[bk].every) * k
      );
    }
  for (const tk in TREES)
    if (TREES[tk].fruit === id) {
      if (!TREES[tk].ss.includes(season())) return 0;
      return Math.min(
        10,
        Math.floor(
          ((S.trees.filter(x => x && x.k === tk && x.g >= TREES[tk].grow).length * lim) / TREES[tk].every) * k
        )
      );
    }
  return 0;
}
// 鱼和要用鱼、要三种水果的东西产量看运气，不进委托
const C_SKIP = ['fishsoup', 'juice'];
function cPool() {
  const pool = [];
  for (const k in CROPS) if (CROPS[k].lvl <= S.lvl) pool.push(k);
  for (const k in ANIM) if (S.an[k].length) pool.push(ANIM[k].prod);
  for (const r in RECIPES) if (W(RECIPES[r].w).built && RECIPES[r].lvl <= S.lvl) pool.push(r);
  for (const tr of S.trees)
    if (tr && tr.g >= TREES[tr.k].grow && !pool.includes(TREES[tr.k].fruit)) pool.push(TREES[tr.k].fruit);
  if (hillOpen()) {
    for (const b of S.hill.bush)
      if (bushReady(b) && !pool.includes(BUSH[b.k].item)) pool.push(BUSH[b.k].item);
    if (S.hill.hive.some(Boolean)) pool.push('honey');
  }
  return pool;
}
function genContract(t) {
  const T = CT[t],
    pool = cPool().filter(id => !C_SKIP.includes(id) && cCap(id, t) >= 2);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // 越到后期越要值钱的东西
  const minV = T.base(S.lvl) / T.kinds / 30;
  pool.sort((a, b) => (ITEMS[b].sell >= minV) - (ITEMS[a].sell >= minV));
  const crops = pool
      .filter(k => CROPS[k])
      .sort((a, b) => ITEMS[b].sell - ITEMS[a].sell)
      .slice(0, 4),
    others = pool.filter(k => !CROPS[k]);
  for (let i = crops.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [crops[i], crops[j]] = [crops[j], crops[i]];
  }
  const pick = [];
  if (t >= 1 && crops.length) pick.push(crops[0]);
  if (t === 2) {
    const pr = others.find(k => RECIPES[k]);
    if (pr) pick.push(pr);
  }
  for (const k of pool)
    if (pick.length < T.kinds + (t === 2 && rand() < 0.4 ? 1 : 0) && !pick.includes(k)) pick.push(k);
  const per = T.base(S.lvl) / pick.length;
  // 每样数量控制在 2~24 份，便宜货不会要上百个
  const items = pick.map(id => {
    const minQ = CROPS[id] && qOpen() ? Math.min(t, 2) : 0;
    return [id, Math.max(2, Math.min(cCap(id, t), Math.round(per / (ITEMS[id].sell * QM[minQ])))), minQ];
  });
  const val = items.reduce((a, [id, n, q]) => a + ITEMS[id].sell * QM[q] * n, 0),
    R = Math.round((val * T.mult) / 10) * 10;
  return { t, items, R, D: Math.round(R * 0.2), time: Math.round(T.time * (shopLv('ship') ? 1.25 : 1)) };
}
function townOffers() {
  if (!S.town.offers || !S.town.offers.length) S.town.offers = [0, 1, 2].map(genContract);
  return S.town.offers;
}
function takeContract(i) {
  const o = townOffers()[i];
  if (!o || S.town.active || S.town.rep < CT[o.t].need || S.coins < o.D) return;
  S.coins -= o.D;
  S.town.active = { ...o, given: {}, left: o.time };
  S.town.offers[i] = genContract(o.t);
  sfx('plant');
  toast(`接下${CT[o.t].n}档委托，${Math.round(o.time / 60)} 分钟内交齐`, 'gold');
}
const cLeft = a => a.items.filter(([id, n]) => (a.given[id] || 0) < n);
function giveContract() {
  const a = S.town.active;
  if (!a) return;
  let any = 0;
  for (const [id, n, q] of a.items) {
    const need = n - (a.given[id] || 0),
      g = Math.min(need, haveQ(id, q));
    if (g > 0 && takeInv(id, g, q)) {
      a.given[id] = (a.given[id] || 0) + g;
      any += g;
    }
  }
  if (!any) return toast('仓库里还没有能交的');
  sfx('coin');
  if (!cLeft(a).length) finishContract(true);
  else toast(`交了 ${any} 件，还差 ${cLeft(a).length} 样`);
}
function finishContract(ok) {
  const a = S.town.active;

  S.town.active = null;

  } else {
    const back = Math.floor(a.D / 2);

    toast(`委托超时了，押金退回一半（${back} 金币）。下次挑把握大的接`, 'gold');
  }

}

function tickTown(dt, off) {

// ---------- 丰收赛 ----------
const CAT_OF = id =>
  CROPS[id]
    ? '作物'
    : FRUIT.includes(id)
      ? '水果'
      : ['egg', 'milk', 'wool'].includes(id)
        ? '畜产'
        : TEA_GOODS.includes(id)
          ? '茶山'
          : RECIPES[id]
            ? '加工'
            : '鱼';
const contestOpen = () => S.lvl >= 10;
const contestYear = () => Math.floor((S.day - 1) / (SDAYS * 4)) + 1;
const contestKey = () => Math.floor((S.day - 1) / SDAYS);
const contestLines = () => {
  // 每年高 5%，最多高 25%：满分篮子大约 330 分，金牌线封顶 300，始终拿得到
  const m = Math.min(1.25, 1 + 0.05 * (contestYear() - 1));
  return [100, 170, 240].map(x => Math.round(x * m));
};
const contestFee = () => Math.min(3000, 300 + 200 * contestYear());
function contestPts(id, q) {
  const sb = CROPS[id] && CROPS[id].ss.includes(season()) ? 1.2 : 1;
  return Math.round(Math.sqrt(ITEMS[id].sell) * 3 * [1, 1.5, 2.2][q] * sb);
}
function basketScore(b) {
  const cats = new Set(b.map(e => CAT_OF(e.id)));
  return b.reduce((a, e) => a + contestPts(e.id, e.q), 0) + Math.max(0, cats.size - 1) * 8;
}
let basket = [];
// 候选：仓库里每样东西的最高档
function contestCands() {
  const out = [];
  for (const id in S.inv) {
    if (!S.inv[id] || id === 'boot') continue;
    const c = qCounts(id),
      q = c[2] ? 2 : c[1] ? 1 : 0;
    out.push({ id, q, pts: contestPts(id, q) });
  }
  return out.sort((a, b) => b.pts - a.pts);
}
function autoBasket() {
  const cands = contestCands(),
    b = [],
    used = new Set();
  // 先每个门类挑最好的一样，再按分数补满
  for (const c of cands) if (b.length < 5 && !used.has(CAT_OF(c.id))) b.push(c), used.add(CAT_OF(c.id));
  for (const c of cands) if (b.length < 5 && !b.some(x => x.id === c.id)) b.push(c);
  b.sort((x, y) => y.pts - x.pts);
  basket = b.slice(0, 5).map(({ id, q }) => ({ id, q }));
}
function enterContest() {
  if (!contestOpen() || S.town.contest[contestKey()] != null || basket.length < 5 || S.coins < contestFee())
    return;
  for (const e of basket) if (haveQ(e.id, e.q) < 1) return toast('篮子里有东西仓库里没了，重新挑一下');
  S.coins -= contestFee();
  const score = basketScore(basket),
    L = contestLines(),
    m = score >= L[2] ? 2 : score >= L[1] ? 1 : score >= L[0] ? 0 : -1;
  for (const e of basket) takeInv(e.id, 1, e.q);
  S.town.contest[contestKey()] = m;
  S.town.lastScore = score;
  if (m >= 0) {
    S.town.medals[m]++;
    S.town.rep += [1, 2, 4][m];
    const lv = S.lvl,
      coins = [800 + lv * 40, 2000 + lv * 80, 5000 + lv * 150][m];
    addCoins(coins);
    flyAt(innerWidth / 2, innerHeight * 0.4, coins);
    if (m >= 1) S.goldSeeds = (S.goldSeeds || 0) + (m === 2 ? 3 : 2);
    let extra = '';
    if (m === 2 && !S.town.trophy) {
      S.town.trophy = 1;
      S.dinv.trophy = (S.dinv.trophy || 0) + 1;
      extra = '，还有一座「金奖杯」装饰';
    }
    confetti(4, m === 2 ? 60 : 30);
    sfx('ach');
    toast(`丰收赛${['铜', '银', '金'][m]}牌！${score} 分，奖金 ${coins}${extra}`, 'gold');
  } else {
    sfx('deny');
    toast(`${score} 分，差一点上榜。多攒些特优和高价货，下季再来`, 'gold');
  }
  basket = [];
}
function confetti(y, n) {
  const cy = camY;
  for (let k = 0; k < n; k++)
    parts.push({
      x: 4 + (rand() - 0.5) * 6,

      sfx('coin');
      toast(`交了 ${n} 件材料`);
    }
  } else if (k === 'qdone') {
    const qi = qInfo();
    if (!qi || qi.lock || qi.left.length || S.coins < qi.Q.coins) return;
    const Q = qi.Q;
    S.coins -= Q.coins;
    S.quest.stage++;
    S.quest.given = {};
    if (S.quest.stage === 5) openHill();
    sfx('ach');
    closeSheet();
    banner = { t: 3, text: Q.done[0], sub: Q.done[1] };
    camTarget = Q.cam;
    for (let k2 = 0; k2 < 60; k2++)
      parts.push({
        x: 4 + (rand() - 0.5) * 6,
        y: Q.cam - 1,
        vx: (rand() - 0.5) * 6,
        vy: -rand() * 6 - 2,
        l: 1.8,
        c: ['#f7cb4d', '#e65b84', '#7cc7ea', '#9bd36a', '#fff'][k2 % 5],
        s: 0.08,
        conf: true
      });
    toast(`「${Q.n}」完工！${Q.reward}`, 'gold');
    gainXP(Q.xp);
    hudKey = '';
    return;
  } else if (k === 'ptree') {
    const TR = TREES[v];
    if (!TR || S.trees[sheetArg] || S.lvl < TR.lvl || S.coins < TR.cost) return;
    S.coins -= TR.cost;
    S.trees[sheetArg] = { k: v, g: 0, f: 0, t: 0 };
    const [tx, ty] = TSLOT[sheetArg];
    burst(tx, ty - 0.2, '#7a5232', 10, 2, 2);
    sfx('plant');
    toast(`种下了${TR.n}，${Math.round(TR.grow / 60)} 分钟后长成`);
    closeSheet();
    return;
  } else if (k === 'cast') {
    if (!F || castsLeft(F.w) <= 0) return;
    S.fish[F.w]++;
    const pool = FISHP[F.w].pool;
    let r = rand(),
      fish = pool[0][0];
    for (const [id, pp] of pool) {
      if (r < pp) {
        fish = id;
        break;
      }
      r -= pp;
    }
    F = { w: F.w, phase: 'wait', t: 1.2 + rand() * 2.2, fish };
    sfx('water');
  } else if (k === 'reel') {
    if (!F || F.phase !== 'bite') return;
    F.ok = F.pos >= F.z0 && F.pos <= F.z0 + F.zw;
    F.phase = 'res';
    if (F.ok) {
      S.inv[F.fish]++;
      dexAdd(F.fish);
      if (F.fish !== 'boot') {
        S.st.fish++;
        daily('fish');
      }
      if (F.fish === 'koi') {
        S.st.koi++;
        toast('锦鲤！今天运气爆棚', 'gold');

      gainXP(ITEMS[F.fish].xp);
      sfx('harvest');
    } else sfx('deny');
  } else if (k === 'dog') {
    if (S.dog || S.lvl < 2 || S.coins < 180) return;
    S.coins -= 180;
    S.dog = true;
    dog.x = 4;
    dog.y = 2.86;
    dog.w = 0;
    sfx('bark');
    toast('旺财来到农场了！它会帮你赶乌鸦', 'gold');

    setAudio();
    initAudio();

  } else if (k === 'tmus') {
    musicOn = !musicOn;
    setAudio();
    initAudio();
  } else if (k === 'merch') {
    const M = MERCH[v];
    if (!M || !merchHere() || S.merch.bought[v] || S.coins < M.cost) return;
    S.coins -= M.cost;
    S.merch.bought[v] = 1;
    sfx('ach');
    if (v === 'goldseed') {
      S.goldSeeds = (S.goldSeeds || 0) + 3;
      toast('接下来 3 次播种都会长出金色作物', 'gold');
    } else if (v === 'potion') {
      let n = 0;
      S.plots.forEach((p, i) => {
        if (p.c && p.g < CROPS[p.c].time) {
          p.g = Math.min(CROPS[p.c].time, p.g + CROPS[p.c].time * 0.5);
          n++;
          const q = plotXY(i);
          burst(q.x + 0.5, q.y + 0.4, '#9bf06a', 8, 2, 2.4, 0.06);
        }
      });
      toast(`${n} 块地的作物猛长了一截`, 'gold');
    } else if (v === 'feedpack') {
      S.inv.wheat += 10;
      S.inv.corn += 6;
      toast('饲料大礼包放进仓库了');
    } else if (v === 'bell') {
      S.weather = { type: 'rain', rs: S.clock, re: Math.min(1439, S.clock + 200) };
      toast('叮铃铃……下雨了！', 'gold');
    } else if (v === 'clover') {
      S.clover = S.day;
      toast('幸运四叶草：今天交订单多拿 50% 金币', 'gold');
    }
  } else if (k === 'craft') {
    craft(v);
  } else if (k === 'fill') {
    craftFill(v);
  } else if (k === 'wtab') {
    wsTab = v;
  } else if (k === 'wbuild') {
    buildWork(v);
  } else if (k === 'wup') {
    upgradeWork(v);
  } else if (k === 'rush') {
    rush(v);
  } else if (k === 'wcollect') {
    collectWork(v);
  } else if (k === 'wall') {
    collectAllWorks();
  } else if (k === 'claimall') {
    const list = achReady();
    if (!list.length) return;
    let g = 0;
    for (const A of list) {
      S.ach[A.id] = 1;
      g += A.r;
    }
    addCoins(g);
    flyFrom(lastBtn, g);
    sfx('ach');
    toast(`一口气领了 ${list.length} 个成就，共 ${g} 金币`, 'gold');
  } else if (k === 'claim') {
    const A = ACH.find(x => x.id === v);
    if (!A || S.ach[v] || A.v() < A.goal) return;
    S.ach[v] = 1;
    addCoins(A.r);
    flyFrom(lastBtn, A.r);
    sfx('ach');
    toast(`领取成就「${A.n}」奖励 ${A.r} 金币`, 'gold');
  } else if (k === 'up') {
    const u = UPG[v],
      l = S.up[v],
      c = u.costs[l];
    if (l >= u.costs.length || S.coins < c || S.lvl < u.lv[l]) return;
    S.coins -= c;
    S.up[v]++;
    buildSeeds();
    sfx('level');
    toast(`${u.n}升级了：${u.fmt(S.up[v])}`);
  } else if (k === 'buyplot') {
    const c = plotCost(),
      p = S.plots[sheetArg];
    if (!p || !p.L || S.coins < c) return;

    closeSheet();
    return;
  }
  renderSheet();
  hudKey = '';
}

// 补算离开的时间（最多 8 小时），返回这段时间的收获汇总
function catchUp() {
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.saved || Date.now())) / 1000));
  banner = null;
  if (away <= 20) return null;
  const inv0 = { ...S.inv },
    coins0 = S.coins;
  offStat = { hand: 0, lvUp: 0, keep: Math.floor(S.coins * 0.6) };
  offClock = 1440;
  simOff = true;
  try {
    // 步长随离开时长放大，最多算 6000 步，手机上也能很快打开
    const step = Math.max(1, away / 6000);
    for (let t = 0; t < away; t += step) update(step, true);
  } finally {
    simOff = false;
  }
  banner = null;
  const gains = {};
  for (const k in S.inv) if (S.inv[k] - (inv0[k] || 0) > 0) gains[k] = S.inv[k] - (inv0[k] || 0);
  return {
    away,
    gains,
    ready: { ...S.ready },
    works: worksReady(),
    fruit: S.trees.reduce((a, t) => a + (t ? t.f : 0), 0),
    ripe: S.plots.filter(p => p.c && p.g >= CROPS[p.c].time).length,
    hill: hillReady(),
    hand: offStat.hand,
    lvUp: offStat.lvUp,
    spent: Math.max(0, coins0 - S.coins),
    gift: away >= 3600 ? 50 + S.lvl * 20 : 0
  };
}

  S.sheet = null;
  veil.hidden = true;
  F = null;
  S.welcomed = true;
  catchUp();
  buildSeeds();
  crows = [];
  coinShown = S.coins;
  $('#coins').textContent = fmtC(S.coins);
  hudKey = '';
  save();
}
async function pushCloud() {
  if (!cloud || cloud.busy) return;
  cloud.busy = true;
  try {
    S.saved = Date.now();
    await cloud.ref.set({ json: JSON.stringify(S), saved: S.saved, play: Math.round(S.play || 0), v: 3 });
    cloudState = 'on';
  } catch (e) {
    cloudState = e && e.code === 'quota_exceeded' ? 'full' : 'err';
  }
  cloud.busy = false;
}
async function initCloud() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/farm');
    let snap;
    try {
      snap = await ref.get();
    } catch (e) {
      await new Promise(r => setTimeout(r, 800 + rand() * 800));
      snap = await ref.get();
    }
    cloud = { ref, busy: false };
    cloudState = 'on';
    if (snap.exists) {
      const d = snap.data() || {};
      if (
        typeof d.json === 'string' &&
        ((d.saved || 0) > bootSaved + 5000 || ((S.play || 0) < 90 && (d.play || 0) > (S.play || 0) + 60)) &&
        !(S.resetAt && (d.saved || 0) < S.resetAt)
      ) {
        let s2 = null;
        try {
          s2 = load(JSON.parse(d.json));
        } catch (e) {}
        if (s2) {
          adopt(s2);
          toast('已接上云端存档', 'gold');
        }
      }
    }
    pushCloud();
  } catch (e) {
    cloudState = cloud ? 'err' : 'off';
  }
}
bootSaved = S.saved || 0;
const ret0 = catchUp();
rollDaily();
banner = !S.welcomed
  ? null
  : festNow() >= 0
    ? { t: 3, text: FESTS[festNow()].n, sub: '两天节日 · 交节日订单攒章' }
    : { t: 3, text: SEA[season()].n + '天', sub: `第${Math.floor((S.day - 1) / 16) + 1}年` };
coinShown = S.coins;
$('#coins').textContent = fmtC(S.coins);
S.sheet = null;
if (!S.welcomed) {
  S.welcomed = true;
  openSheet('welcome');
} else if (ret0 && ret0.away >= 120) {
  retInfo = ret0;
  banner = null;
  openSheet('back');
}
let last = performance.now(),
  saveT = 0;
let perfT = 0,
  perfN = 0;
function frameBody(n) {
  const raw = (n - last) / 1000,
    dt = Math.min(0.1, raw);
  last = n;
  // 连续两秒帧率不到 40，就把画布分辨率往下调一档
  if (!document.hidden && raw < 0.5) {
    perfT += raw;
    perfN++;
    // 每 1.5 秒看一次帧率：很卡就直接降到最低精度，有点卡就降一档，最低到 0.75
    if (perfT > 1.5) {
      const fps = perfN / perfT;
      if (fps < 40 && dprCap > 0.75) {
        dprCap = fps < 24 ? Math.max(0.75, Math.min(1, dprCap - 0.5)) : Math.max(0.75, dprCap - 0.25);
        resize();
      }
      perfT = perfN = 0;
    }
  }
  T += dt;
  const st = $('#stage');
  if (cw !== st.clientWidth || ch !== st.clientHeight) resize();
  update(dt, false);
  render();
  hud();
  saveT += dt;
  if (saveT > 4) {
    saveT = 0;
    save();
  }
  achT += dt;
  if (achT > 1) {
    achT = 0;
    checkAch();
  }
  if (S.sheet === 'works') {
    const j = W(wsTab).q[0],
      el = document.getElementById('wtime'),
      bar = document.getElementById('wbar0');
    if (j && el) el.textContent = '还要 ' + fmtT(j.t);
    if (j && bar) bar.style.width = (1 - j.t / RECIPES[j.r].t) * 100 + '%';
    const j1 = W(wsTab).q[1],
      b1 = document.getElementById('wbar1');
    if (j1 && b1) b1.style.width = (1 - j1.t / RECIPES[j1.r].t) * 100 + '%';
  }
  if (S.sheet === 'town' && S.town.active) {
    const el = document.getElementById('ctime');
    if (el) el.textContent = '还剩 ' + fmtT(S.town.active.left);
  }
  if (S.sheet === 'orders')
    document.querySelectorAll('[data-exp]').forEach(el => {
      const o = S.orders[+el.dataset.exp];
      if (o && o.exp) el.textContent = '加急 ' + fmtT(o.exp);
    });
  music();
  // 跨过零点换新任务；新手引导结束后，每天第一次打开提醒签到
  if (achT === 0) {
    if (rollDaily()) toast('新的一天，每日任务刷新了', 'gold');
    festRoll();
    if (
      S.tut >= 4 &&
      !S.sheet &&
      !placing &&
      !dailyPrompted &&
      T - sheetT > 6 &&
      S.daily &&
      !S.daily.signed
    ) {
      dailyPrompted = true;
      openSheet('daily');
    }
  }
  S.play = (S.play || 0) + dt;
  cloudT += dt;
  if (cloudT > 15) {
    cloudT = 0;
    pushCloud();
  }
  if (F && F.phase === 'bite') {
    const nd = document.getElementById('needle');
    if (nd) nd.style.left = F.pos * 100 + '%';
  }
  if (camTarget != null) {
    const b0 = camY;
    camY += (camTarget - camY) * Math.min(1, dt * 4);
    applyCam();
    if (Math.abs(camY - b0) < 0.002) camTarget = null;
  }
  updAreas();
  updAllBtn();
  if (coinShown !== S.coins) {
    const d = S.coins - coinShown;
    coinShown += Math.sign(d) * Math.max(1, Math.ceil(Math.abs(d) * 0.15));
    $('#coins').textContent = fmtC(coinShown);
  }
}
// 某一帧出错也不能让游戏卡死：记下来，下一帧照常跑
let frameErr = 0;
function frame(n) {
  try {
    frameBody(n);
  } catch (e) {
    if (!frameErr++) console.error(e);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    pushCloud();
  }
});
initCloud();
setTimeout(siteTips, 5000);
})();
</script>
</body></html>

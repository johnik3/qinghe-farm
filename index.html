}

function drawCrow(c) {
  const x = X(c.x),
    y = Y(c.y),
    s = U * 0.4,
    eat = c.phase === 'eat';
  if (eat) {
    const k = 1 - c.t / 8;
    ctx.strokeStyle = `rgba(216,69,91,${0.5 + 0.4 * Math.sin(T * 8)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, U * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k));
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y - (eat ? 0 : s * 0.3));
  ctx.scale(c.dir || 1, 1);
  const fl = eat ? 0 : Math.sin(c.f * 18);
  const pk = eat && Math.sin(T * 9) > 0.3 ? s * 0.12 : 0;
  ell(ctx, 0, 0, s * 0.45, s * 0.28, '#2b2b36');
  poly(
    ctx,
    [
      [-s * 0.4, 0],
      [-s * 0.75, -s * 0.1],
      [-s * 0.7, s * 0.12]
    ],
    '#22222b'
  );
  circ(ctx, s * 0.38, -s * 0.18 + pk, s * 0.2, '#2b2b36');
  poly(
    ctx,
    [
      [s * 0.55, -s * 0.2 + pk],
      [s * 0.78, -s * 0.12 + pk],
      [s * 0.55, -s * 0.08 + pk]
    ],
    '#6b6b70'
  );
  circ(ctx, s * 0.42, -s * 0.24 + pk, s * 0.05, '#fff');
  circ(ctx, s * 0.43, -s * 0.24 + pk, s * 0.025, '#111');
  poly(
    ctx,
    [
      [-s * 0.1, -s * 0.05],
      [s * 0.15, -s * 0.05],
      [-s * 0.05, -s * 0.05 - s * 0.55 * fl]
    ],
    '#3a3a48'
  );
  if (eat) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s * 0.05, s * 0.25);
    ctx.lineTo(-s * 0.08, s * 0.38);
    ctx.moveTo(s * 0.1, s * 0.25);
    ctx.lineTo(s * 0.12, s * 0.38);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCat() {
  const x = X(CAT.x),
    y = Y(CAT.y),
    s = U * 0.36,
    fur = '#e9a25f',
    dk = '#c47a3a';
  shadow(x, y, s * 0.55, s * 0.12, 0.2);
  if (cat.awake <= 0) {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x - s * 0.05, y - s * 0.2, s * 0.42, 0.3, 1.7);
    ctx.stroke();
    ell(ctx, x, y - s * 0.25, s * 0.48, s * 0.26, fur);
    ctx.strokeStyle = dk;
    ctx.lineWidth = s * 0.06;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * s * 0.18 - s * 0.05, y - s * 0.48);
      ctx.lineTo(x + k * s * 0.16 - s * 0.05, y - s * 0.32);
      ctx.stroke();
    }
    circ(ctx, x + s * 0.38, y - s * 0.24, s * 0.22, fur);
    poly(
      ctx,
      [
        [x + s * 0.22, y - s * 0.36],
        [x + s * 0.26, y - s * 0.58],
        [x + s * 0.38, y - s * 0.42]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.42, y - s * 0.42],
        [x + s * 0.56, y - s * 0.56],
        [x + s * 0.57, y - s * 0.34]
      ],
      fur
    );
    ctx.strokeStyle = '#5c3920';
    ctx.lineWidth = 1.3;
    for (const ex of [0.31, 0.47]) {
      ctx.beginPath();
      ctx.arc(x + s * ex, y - s * 0.24, s * 0.05, 0.3, Math.PI - 0.3);
      ctx.stroke();
    }
    const ph = (T * 0.45) % 1;
    ctx.globalAlpha = 1 - ph;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(U * (0.15 + ph * 0.1))}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('z', x + s * 0.7 + ph * s * 0.3, y - s * 0.75 - ph * s * 0.7);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y - s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.55, y - s * 0.2, x - s * 0.45 + Math.sin(T * 6) * s * 0.12, y - s * 0.6);
    ctx.stroke();
    ell(ctx, x, y - s * 0.35, s * 0.3, s * 0.36, fur);
    ell(ctx, x + s * 0.02, y - s * 0.28, s * 0.15, s * 0.24, '#fbeedd');
    circ(ctx, x, y - s * 0.82, s * 0.26, fur);
    poly(
      ctx,
      [
        [x - s * 0.24, y - s * 0.9],
        [x - s * 0.2, y - s * 1.18],
        [x - s * 0.04, y - s * 1.02]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.24, y - s * 0.9],
        [x + s * 0.2, y - s * 1.18],
        [x + s * 0.04, y - s * 1.02]
      ],
      fur
    );
    circ(ctx, x - s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    circ(ctx, x + s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');

      [

}

// 自动喷灌：田边的喷头转着洒水
function drawSprinklers() {
  if (S.up.water < 4 || raining()) return;
  for (const [sx, sy] of [
    [0.86, 3.12],
    [7.14, 3.12],
    [0.86, 8.42],
    [7.14, 8.42],
    [0.82, 5.75],
    [7.18, 5.75]
  ]) {
    const x = X(sx),
      y = Y(sy);
    if (y < -U || y > ch + U) continue;
    ctx.fillStyle = '#7a8a90';
    ctx.fillRect(x - U * 0.03, y - U * 0.18, U * 0.06, U * 0.18);
    circ(ctx, x, y - U * 0.2, U * 0.05, '#9fb0b6');
    for (let k = 0; k < 7; k++) {
      const a = T * 2.2 + sx + k * 0.12,
        r = U * (0.5 + ((T * 1.5 + k * 0.37) % 1) * 1.4);
      ctx.globalAlpha = 0.8 * (1 - ((T * 1.5 + k * 0.37) % 1));
      circ(ctx, x + Math.cos(a) * r, y - U * 0.2 + Math.sin(a) * r * 0.45, U * 0.04, '#d6f0ff');
    }
    ctx.globalAlpha = 1;
  }
}

/* 绘制南岸：河、桥、果园、湖与码头、集市 */
function drawSouth() {
  const st = S.quest.stage,
    si = season(),
    win = si === 3,
    y0 = Y(RIVER.y),
    h = RIVER.h * U;
  if (y0 > ch + U * 0.5 || Y(WH) < -U) return;
  ctx.fillStyle = win ? '#dfe6e8' : '#c9b583';
  ctx.fillRect(0, y0 - U * 0.12, cw, h + U * 0.24);
  ctx.fillStyle = lg(ctx, y0, y0 + h, win ? '#e4f2f8' : '#6cc0e0', win ? '#b3d4e2' : '#3b88b0');
  ctx.fillRect(0, y0, cw, h);
  ctx.lineCap = 'round';
  if (!win) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 16; k++) {
      const x = ((k * 137 + T * 40) % (cw + 160)) - 80,
        yy = y0 + h * (0.2 + (k % 4) * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + U * 0.35, yy);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 8; k++) {
      const x = (k * 173) % cw;
      ctx.beginPath();
      ctx.moveTo(x, y0 + h * 0.3);
      ctx.lineTo(x + U * 0.4, y0 + h * 0.6);
      ctx.lineTo(x + U * 0.7, y0 + h * 0.4);
      ctx.stroke();
    }
  }
  const bx = X(BRIDGE.x),
    by = Y(BRIDGE.y),
    bw = BRIDGE.w * U,
    bh = BRIDGE.h * U;
  ell(ctx, bx + bw / 2, y0 + h * 0.6, bw * 0.6, h * 0.3, 'rgba(20,40,60,.18)');
  const post = (px, py) => {
    ctx.fillStyle = '#5c3920';
    rrect(ctx, px - U * 0.06, py - U * 0.12, U * 0.12, U * 0.22, U * 0.03);
    ctx.fill();
  };
  if (st >= 1) {
    ctx.fillStyle = '#a87448';
    rrect(ctx, bx, by, bw, bh, U * 0.06);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.5;
    for (let k = 1; k < 9; k++) {
      const yy = by + (bh * k) / 9;
      ctx.beginPath();
      ctx.moveTo(bx + 2, yy);
      ctx.lineTo(bx + bw - 2, yy);
      ctx.stroke();
    }
    ctx.strokeStyle = '#7a5232';
    ctx.lineWidth = U * 0.06;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.04, by);
    ctx.lineTo(bx + U * 0.04, by + bh);
    ctx.moveTo(bx + bw - U * 0.04, by);
    ctx.lineTo(bx + bw - U * 0.04, by + bh);
    ctx.stroke();
    for (const k of [0, 0.5, 1]) {
      post(bx + U * 0.04, by + bh * k);
      post(bx + bw - U * 0.04, by + bh * k);
    }
    if (win) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(bx + U * 0.1, by, bw - U * 0.2, bh);
    }
  } else {
    ctx.fillStyle = '#8d6440';
    ctx.fillRect(bx + U * 0.08, by, bw - U * 0.16, bh * 0.28);
    ctx.fillRect(bx + U * 0.08, by + bh * 0.78, bw - U * 0.16, bh * 0.22);
    ctx.save();
    ctx.translate(bx + bw * 0.55, by + bh * 0.5);
    ctx.rotate(0.5);
    ctx.fillRect(-bw * 0.3, -U * 0.05, bw * 0.6, U * 0.1);
    ctx.restore();
    ctx.strokeStyle = '#c9a66b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.06, by + bh * 0.28);
    ctx.quadraticCurveTo(bx + U * 0.25, by + bh * 0.55, bx + U * 0.06, by + bh * 0.78);
    ctx.stroke();
    post(bx + U * 0.06, by);
    post(bx + bw - U * 0.06, by);
    post(bx + U * 0.06, by + bh);
    post(bx + bw - U * 0.06, by + bh);
  }
  const O = ORCH;
  ctx.fillStyle = win ? 'rgba(255,255,255,.3)' : 'rgba(120,90,50,.16)';
  rrect(ctx, X(O.x), Y(O.y), O.w * U, O.h * U, U * 0.15);
  ctx.fill();
  fenceRect(O.x, O.y + 0.15, O.w, O.h - 0.15, [O.x + 2.55, O.x + 3.15]);
  if (st < 1) {
    for (let k = 0; k < 6; k++)
      drawTree({
        x: O.x + 0.55 + (k % 3) * 1.1,
        y: O.y + 1.2 + Math.floor(k / 3) * 1.45,
        s: 0.5,
        k: 'bush',
        h: k * 0.13
      });
    sign(O.x + O.w / 2, O.y + 0.9, '果园', '修好石桥后开放');
  } else TSLOT.forEach(([tx, ty], i) => drawFruitTree(tx, ty, S.trees[i], i));
  const L = LAKE,
    lx = X(L.x + L.w / 2),
    ly = Y(L.y + L.h / 2),
    rx = (L.w * U) / 2,
    ry = (L.h * U) / 2;
  ell(ctx, lx, ly + 3, rx + U * 0.1, ry + U * 0.1, win ? '#b9c7c9' : '#7a8a6a');
  const lgd = ctx.createRadialGradient(lx - rx * 0.3, ly - ry * 0.3, 2, lx, ly, rx);
  lgd.addColorStop(0, win ? '#eef7fb' : '#8fd3e8');
  lgd.addColorStop(1, win ? '#a9cfe0' : '#2f7fa8');
  ell(ctx, lx, ly, rx, ry, lgd);
  if (!win) {
    for (const [dx, dy] of [
      [0.55, 0.35],
      [0.45, -0.45],
      [-0.15, 0.55]
    ]) {
      const px = lx + dx * rx,
        py = ly + dy * ry;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, U * 0.14, 0.3, Math.PI * 2 - 0.1);
      ctx.closePath();
      ctx.fillStyle = '#5aa047';
      ctx.fill();
    }
    for (let k = 0; k < 6; k++) {
      const rxp = lx + rx * (0.72 + (k % 3) * 0.08),
        ryp = ly - ry * 0.5 + k * ry * 0.18,
        sw = Math.sin(T + k) * 2;
      ctx.strokeStyle = '#5f8a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rxp, ryp);
      ctx.lineTo(rxp + sw, ryp - U * 0.35);
      ctx.stroke();
      ell(ctx, rxp + sw, ryp - U * 0.38, U * 0.03, U * 0.08, '#8a5a2b');
    }
    const jp = (T * 0.3) % 4;
    if (jp < 1) {
      const a = jp * Math.PI,
        fx = lx + rx * 0.1 + jp * U * 0.6,
        fy = ly + ry * 0.1 - Math.sin(a) * U * 0.5;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(-Math.cos(a) * 0.9);
      ell(ctx, 0, 0, U * 0.13, U * 0.05, '#cf9a3c');
      ctx.restore();
    } else if (jp < 1.6) {
      ctx.strokeStyle = `rgba(255,255,255,${1.6 - jp})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(
        lx + rx * 0.1 + U * 0.6,
        ly + ry * 0.1,
        U * Math.max(0.01, jp - 0.8) * 0.5,
        U * Math.max(0.01, jp - 0.8) * 0.2,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }
  }
  if (st >= 2) {
    const dx0 = X(L.x - 0.05),
      dy0 = Y(L.y + L.h * 0.42);
    ctx.fillStyle = '#a87448';
    rrect(ctx, dx0, dy0, U * 1.3, U * 0.38, U * 0.04);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < 7; k++) {
      ctx.beginPath();
      ctx.moveTo(dx0 + (k * U * 1.3) / 7, dy0);
      ctx.lineTo(dx0 + (k * U * 1.3) / 7, dy0 + U * 0.38);
      ctx.stroke();
    }
    for (const k of [0, 0.5, 1]) circ(ctx, dx0 + k * U * 1.25 + U * 0.03, dy0 + U * 0.4, U * 0.05, '#5c3920');
    const bxx = X(L.x + L.w * 0.62),
      byy = Y(L.y + L.h * 0.68) + Math.sin(T * 1.5) * 2;
    ctx.beginPath();
    ctx.moveTo(bxx - U * 0.42, byy);
    ctx.quadraticCurveTo(bxx, byy + U * 0.3, bxx + U * 0.42, byy);
    ctx.closePath();
    ctx.fillStyle = '#8d5b36';
    ctx.fill();
    ctx.fillStyle = '#b07a4c';
    ctx.fillRect(bxx - U * 0.32, byy - U * 0.03, U * 0.64, U * 0.05);
  } else sign(L.x + L.w * 0.3, L.y + 0.2, '码头', '复兴第二步');
  const M = MARKET;
  if (st >= 3) {
    const cols = [
        ['#d8455b', '#fff'],
        ['#4a8fd0', '#fff'],
        ['#e6a92a', '#fff']
      ],
      goods = [
        ['tomato', 'pumpkin', 'melon'],
        ['egg', 'milk', 'cheese'],
        ['apple', 'cake', 'flour']
      ];
    for (let k = 0; k < 3; k++) {
      const sx = X(M.x + 0.15 + k * 1.17),
        sy = Y(M.y + 0.15),
        sw = U,
        sh = U * 0.8;
      shadow(sx + sw / 2, sy + sh, sw * 0.55, U * 0.1);
      ctx.fillStyle = '#a87448';
      ctx.fillRect(sx + U * 0.05, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillRect(sx + sw - U * 0.11, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillStyle = '#c9a06a';
      ctx.fillRect(sx, sy + sh * 0.6, sw, sh * 0.35);
      for (let j = 0; j < 5; j++) {
        ctx.fillStyle = cols[k][j % 2];
        ctx.beginPath();
        ctx.moveTo(sx + (j * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy + U * 0.28);
        ctx.arc(sx + ((j + 0.5) * sw) / 5, sy + U * 0.28, sw / 10, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
      }
      goods[k].forEach((g2, j) => drawItem(ctx, g2, sx + sw * (0.2 + j * 0.3), sy + sh * 0.6, U * 0.13));
    }
    ctx.strokeStyle = 'rgba(90,60,30,.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X(M.x), Y(M.y));
    ctx.quadraticCurveTo(X(M.x + M.w / 2), Y(M.y + 0.3), X(M.x + M.w), Y(M.y));
    ctx.stroke();
    for (let k = 0; k < 11; k++) {
      const t2 = k / 10,
        px = X(M.x + M.w * t2),
        py = Y(M.y) + Math.sin(t2 * Math.PI) * U * 0.15;
      poly(
        ctx,
        [
          [px - U * 0.06, py],
          [px + U * 0.06, py],
          [px, py + U * 0.14]
        ],
        ['#d8455b', '#f7cb4d', '#4a8fd0', '#5f9e3e'][k % 4]
      );
    }
  } else sign(M.x + M.w / 2, M.y, '集市', '复兴第三步');
}

/* 绘制叠加层：新手箭头、季节大字 */
function drawTut() {
  if (S.tut >= 4 || S.sheet) return;
  let tx, ty, txt, i;
  const at = k => {
    const q = plotXY(k);
    tx = q.x + 0.5;
    ty = q.y + 0.22;
  };
  if (S.tut === 0) {
    i = S.plots.findIndex(p => !p.L && !p.c);
    if (i < 0) return;
    at(i);
    txt = '点这里播种';
  } else if (S.tut === 1) {
    i = S.plots.findIndex(p => p.c && p.m <= 0 && p.g < CROPS[p.c].time);
    if (i < 0) return;
    at(i);
    txt = '土是干的，点它浇水';
  } else if (S.tut === 2) {
    i = S.plots.findIndex(p => p.c && p.g >= CROPS[p.c].time);
    if (i >= 0) {
      at(i);
      txt = '熟了！点它收获';
    } else {
      i = S.plots.findIndex(p => p.c && p.m <= 0);
      if (i < 0) return;
      at(i);
      txt = '又干了，再浇一次';
    }
  } else {
    tx = HOUSE.x + HOUSE.w * 0.5;
    ty = HOUSE.y + 0.75;
    txt = '点仓库，把收成卖掉';
  }
  const x = X(tx),
    y = Y(ty) - Math.abs(Math.sin(T * 4)) * U * 0.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-U * 0.18, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.22);
  ctx.lineTo(U * 0.18, -U * 0.22);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5c3920';
  ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(U * 0.26)}px ${FONT}`;
  const w = ctx.measureText(txt).width + U * 0.32,
    bx = Math.max(w / 2 + 4, Math.min(cw - w / 2 - 4, x));
  ctx.fillStyle = 'rgba(92,57,32,.94)';
  rrect(ctx, bx - w / 2, y - U * 0.92, w, U * 0.38, U * 0.13);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, y - U * 0.72);
}

function drawBanner() {
  if (!banner) return;
  const a = Math.max(0, Math.min(1, banner.t / 0.6, (3 - banner.t) / 0.4)),
    sc = 1 + (3 - banner.t) * 0.04;
  ctx.globalAlpha = a;
  ctx.save();
  ctx.translate(cw / 2, ch * 0.42);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = SEA[season()].c;
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(U * 1.4)}px ${FONT}`;
  ctx.lineWidth = U * 0.2;
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillText(banner.text, 0, 0);
  ctx.font = `${Math.round(U * 0.34)}px ${FONT}`;
  ctx.lineWidth = U * 0.1;
  ctx.strokeText(banner.sub, 0, U * 0.95);
  ctx.fillText(banner.sub, 0, U * 0.95);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 绘制工坊街：四个工坊，以及每个工坊头顶的进度圈和排队数 */
const WSTYLE = {
  kitchen: { wall: '#f1e2c4', roof: '#b8452e', trim: '#7a3a26' },
  dairy: { wall: '#f6f7f2', roof: '#4a7fb5', trim: '#2f5a86' },
  press: { wall: '#d2a46c', roof: '#4f8a3c', trim: '#2f5a2a' },
  loom: { wall: '#f3e3ec', roof: '#9d6ab8', trim: '#6a4a86' }
};
// 做好了冒气泡；正在做显示进度圈和「+排队数」
function drawWorkStatus(k, x, y) {
  const w = W(k);
  if (!w.built) return;
  const ol = Object.keys(w.out)
    .filter(r => w.out[r] > 0)
    .slice(0, 3)
    .map(r => [r, w.out[r]]);
  if (ol.length) return bubble(x, y, ol);
  const j = w.q[0];
  if (!j) return;
  const pr = 1 - j.t / RECIPES[j.r].t,
    r = U * 0.27,
    yy = y + Math.sin(T * 3) * U * 0.03;
  circ(ctx, x, yy, r + U * 0.06, 'rgba(255,255,255,.95)');
  ctx.lineCap = 'round';
  ctx.lineWidth = U * 0.06;
  ctx.strokeStyle = '#dfe9d0';
  ctx.beginPath();
  ctx.arc(x, yy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#7cc24e';
  ctx.beginPath();
  ctx.arc(x, yy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, pr));
  ctx.stroke();
  drawItem(ctx, j.r, x, yy, U * 0.15);
  if (w.q.length > 1) {
    const bx = x + r * 0.95,
      by = yy - r * 0.85;
    circ(ctx, bx, by, U * 0.13, '#e6a92a');
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(U * 0.17)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+' + (w.q.length - 1), bx, by + 1);
  }
}
function drawWorkshop(k) {
  const R = WRECT[k],
    B = WORKS[k],
    w = W(k),
    st = WSTYLE[k],
    x0 = X(R.x),
    y0 = Y(R.y),
    bw = R.w * U,
    bh = R.h * U,
    win = season() === 3;
  if (y0 > ch + U || y0 + bh < -U * 2) return;
  if (!w.built) {
    ctx.fillStyle = 'rgba(120,90,50,.22)';
    rrect(ctx, x0 + bw * 0.08, y0 + bh * 0.5, bw * 0.84, bh * 0.5, U * 0.08);
    ctx.fill();
    for (let i = 0; i < 6; i++)
      ell(
        ctx,
        x0 + bw * (0.15 + i * 0.14),
        y0 + bh * 0.95,
        U * 0.08,
        U * 0.05,
        i % 2 ? '#b3b2a3' : '#9d9c8e'
      );
    sign(R.x + R.w / 2, R.y + 0.3, '建' + B.n, S.lvl >= B.lvl ? B.cost + ' 金币' : B.lvl + '级解锁');
    return;
  }
  shadow(x0 + bw / 2, y0 + bh, bw * 0.52, U * 0.13, 0.22);
  if (k === 'kitchen') {
    ctx.fillStyle = '#9a5c45';
    ctx.fillRect(x0 + bw * 0.68, y0 + bh * 0.05, bw * 0.1, bh * 0.3);
    if (w.q.length)
      for (let i = 0; i < 3; i++) {
        const ph = (T * 0.5 + i / 3) % 1;
        ctx.globalAlpha = 0.5 * (1 - ph);
        circ(
          ctx,
          x0 + bw * 0.73 + ph * U * 0.2,
          y0 + bh * 0.02 - ph * U * 0.7,
          U * (0.07 + ph * 0.12),
          '#eeeeea'
        );
      }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = st.wall;
  ctx.fillRect(x0 + bw * 0.08, y0 + bh * 0.42, bw * 0.84, bh * 0.58);
  ctx.strokeStyle = 'rgba(80,60,40,.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(x0 + bw * 0.08, y0 + bh * (0.42 + i * 0.14));
    ctx.lineTo(x0 + bw * 0.92, y0 + bh * (0.42 + i * 0.14));
    ctx.stroke();
  }
  poly(
    ctx,
    [
      [x0 - bw * 0.02, y0 + bh * 0.47],
      [x0 + bw * 0.5, y0 + bh * 0.04],
      [x0 + bw * 1.02, y0 + bh * 0.47]
    ],
    st.roof
  );
  ctx.strokeStyle = st.trim;
  ctx.lineWidth = U * 0.05;
  ctx.lineJoin = 'round';
  ctx.stroke();
  if (win)
    poly(
      ctx,
      [
        [x0 + bw * 0.12, y0 + bh * 0.36],
        [x0 + bw * 0.5, y0 + bh * 0.06],
        [x0 + bw * 0.88, y0 + bh * 0.36],
        [x0 + bw * 0.5, y0 + bh * 0.22]
      ],
      '#fbfdff'
    );
  ctx.fillStyle = '#6e4a2c';
  rrect(ctx, x0 + bw * 0.4, y0 + bh * 0.66, bw * 0.2, bh * 0.34, bw * 0.05);
  ctx.fill();
  const lit = darkness() > 0.3;
  ctx.fillStyle = st.trim;
  ctx.fillRect(x0 + bw * 0.14, y0 + bh * 0.58, bw * 0.2, bh * 0.2);
  ctx.fillStyle = lit ? '#ffd47a' : '#bfe0ec';
  ctx.fillRect(x0 + bw * 0.155, y0 + bh * 0.595, bw * 0.17, bh * 0.17);
  // 招牌
  ctx.strokeStyle = '#5c3920';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x0 + bw * 0.78, y0 + bh * 0.48);
  ctx.lineTo(x0 + bw * 0.78, y0 + bh * 0.54);
  ctx.stroke();
  circ(ctx, x0 + bw * 0.78, y0 + bh * 0.68, U * 0.17, '#fffaf0');
  ctx.lineWidth = 2;
  ctx.strokeStyle = st.trim;
  ctx.beginPath();
  ctx.arc(x0 + bw * 0.78, y0 + bh * 0.68, U * 0.17, 0, Math.PI * 2);
  ctx.stroke();
  drawItem(ctx, B.icon, x0 + bw * 0.78, y0 + bh * 0.69, U * 0.11);
  if (k === 'press') {
    ell(ctx, x0 + bw * 0.04, y0 + bh * 0.92, U * 0.16, U * 0.2, '#8d5b36');
    ctx.strokeStyle = '#4a3a2c';
    ctx.lineWidth = 1.5;
    for (const dy of [-0.1, 0.08]) {
      ctx.beginPath();
      ctx.ellipse(x0 + bw * 0.04, y0 + bh * 0.92 + U * dy, U * 0.16, U * 0.05, 0, 0, Math.PI);
      ctx.stroke();
    }
  }
  if (k === 'dairy') drawItem(ctx, 'milk', x0 + bw * 0.02, y0 + bh * 0.9, U * 0.14);
  if (k === 'loom') drawItem(ctx, 'yarn', x0 + bw * 0.98, y0 + bh * 0.92, U * 0.13);
  drawWorkStatus(k, x0 + bw / 2, y0 - U * 0.2);
  label(B.n, x0 + bw / 2, y0 + bh + U * 0.06);
}
function drawWorks() {
  const y0 = Y(16.82);
  if (y0 > ch + U) return;
  const win = season() === 3;
  ctx.fillStyle = win ? 'rgba(255,255,255,.35)' : 'rgba(160,130,80,.18)';
  rrect(ctx, X(0.1), y0, (WW - 0.2) * U, U * 2.05, U * 0.2);
  ctx.fill();
  for (const k in WRECT) drawWorkshop(k);
}

/* 绘制装饰与后花园 */
function drawDecor(g, k, x, y, s, si, night) {
  g.save();
  g.translate(x, y);
  ell(g, 0, 0, s * 0.3, s * 0.07, 'rgba(30,50,20,.2)');
  switch (k) {
    case 'pot': {
      poly(
        g,
        [
          [-s * 0.17, -s * 0.28],
          [s * 0.17, -s * 0.28],
          [s * 0.12, 0],
          [-s * 0.12, 0]
        ],
        '#c8663f'
      );
      g.fillStyle = '#a8502e';
      g.fillRect(-s * 0.19, -s * 0.33, s * 0.38, s * 0.07);
      leaf(g, 0, -s * 0.33, s * 0.24, -2.3, s * 0.07, '#5da34a');
      leaf(g, 0, -s * 0.33, s * 0.24, -0.85, s * 0.07, '#4d9140');
      const fc =
        si === 3
          ? ['#d8455b', '#c93a4e', '#d8455b']
          : si === 2
            ? ['#f2c14a', '#e07a35', '#f2c14a']
            : ['#f7b6cf', '#ffffff', '#e65b84'];
      [
        [-s * 0.12, -s * 0.5],
        [s * 0.11, -s * 0.52],
        [0, -s * 0.62]
      ].forEach(([fx, fy], i) => {
        for (let p = 0; p < 5; p++)
          circ(
            g,
            fx + Math.cos(p * 1.257) * s * 0.045,
            fy + Math.sin(p * 1.257) * s * 0.045,
            s * 0.036,
            fc[i]
          );
        circ(g, fx, fy, s * 0.026, '#f7d34d');
      });
      break;
    }
    case 'hay': {
      g.beginPath();

/* 输入：点击、拖动种地、平移、双指缩放、滚轮 */
let drag = null,
  pan = null,
  pinch = null;
const ptrs = new Map();

}

}

function tap(p) {

    if (i >= 0) placeAt(i);

    return;
  }
  const di = decorAt(p);
  if (di >= 0) return openSheet('decoritem', di);
  if (inR(p, GARDEN)) return openSheet('decor');
  if (Math.hypot(p.x - CAT.x, p.y - (CAT.y - 0.15)) < 0.36) return petCat();
  if (S.dog && Math.hypot(p.x - dog.x, p.y - (dog.y - 0.2)) < 0.42) return petDog();
  if (merchHere() && Math.hypot(p.x - MER.x, p.y - (MER.y - 0.45)) < 0.55) return openSheet('merch');
  if (inR(p, HOUSE)) return openSheet('barn');
  if (inR(p, BOARD, 0.1)) return openSheet('orders');
  if (inR(p, YARD)) {
    if (!S.coop) return openSheet('shop');
    if (collect('coop')) return;
    return openSheet('coop');
  }
  if (inR(p, MILL)) {
    if (S.mill.built && collectWork('mill')) return;
    return openWorks('mill');
  }
  for (const k in WRECT)
    if (inR(p, WRECT[k], 0.05)) {
      if (W(k).built && collectWork(k)) return;
      return openWorks(k);
    }
  if (inR(p, PAST)) {
    if (!S.pasture) return openSheet('shop');
    if (collect('pasture')) return;
    return openSheet('pasture');
  }
  if (inR(p, POND, 0.1)) return openFish('pond');
  if (inR(p, BRIDGE, 0.25)) return openSheet('quest');
  if (inR(p, ORCH)) {
    if (S.quest.stage < 1) return openSheet('quest');
    let bi = -1,
      bd = 0.65;
    TSLOT.forEach(([x, y], k) => {
      const d = Math.hypot(p.x - x, p.y - (y - 0.45));
      if (d < bd) {

cv.addEventListener('pointerdown', e => {
  initAudio();
  const sp = sxy(e);
  ptrs.set(e.pointerId, sp);
  try {
    cv.setPointerCapture(e.pointerId);
  } catch (_) {}
  if (ptrs.size === 2) {
    drag = null;
    pan = null;
    const [a, b] = [...ptrs.values()],
      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom, wx: (cx - ox) / U, wy: (cy - oy) / U };
    camTarget = null;
    return;
  }
  if (ptrs.size > 2) return;
  const p = toWorld(e);
  for (const c of crows) {
    if (c.phase !== 'out' && Math.hypot(c.x - p.x, c.y - 0.15 - p.y) < 0.6) {
      shoo(c);
      return;
    }
  }
  const i = placing ? -1 : plotAt(p);
  if (i >= 0 && !S.plots[i].L) {
    pitch = 1;
    dragN = 0;
    const m = plotAction(i, null);
    if (m && m !== 'none') drag = { mode: m, last: i };
    return;

    const [a, b] = [...ptrs.values()],

      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    zoom = Math.max(0.8, Math.min(2.2, (pinch.z * d) / pinch.d));

  }
  if (drag) {
    const i = plotAt(toWorld(e));
    if (i >= 0 && i !== drag.last) {
      drag.last = i;
      dragN++;
      pitch = PENTA[Math.min(dragN, PENTA.length - 1)];
      plotAction(i, drag.mode);
    }

    const dx = sp.x - pan.sx,
      dy = sp.y - pan.sy;
    if (!pan.moved && Math.hypot(dx, dy) > 8) pan.moved = true;
    if (pan.moved) {
      camX = pan.cx - dx / U;
      camY = pan.cy - dy / U;

    }

cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener(
  'wheel',

  }

    const n = k === 'sell1' ? 1 : S.inv[v];
    if (n <= 0) return;
    const g = priceOf(v) * n;
    S.inv[v] -= n;
    addCoins(g);
    daily('earn', g);
    sfx('coin');
    flyFrom(lastBtn, g);
    toast(`卖出 ${ITEMS[v].n} ×${n}，得 ${g} 金币`);
  } else if (k === 'sellextra') {
    const keep = keepNeeds();
    let g = 0;
    for (const id in S.inv) {
      const n = S.inv[id] - (keep[id] || 0);
      if (n > 0) {
        g += priceOf(id) * n;
        S.inv[id] -= n;
      }
    }
    if (g) {
      addCoins(g);
      daily('earn', g);
      sfx('coin');
      flyFrom(lastBtn, g);
      toast(`卖掉多余的，得 ${g} 金币`);
    }
  } else if (k === 'sellevery') {
    let g = 0;
    for (const id in S.inv) {
      if (S.inv[id] > 0) {
        g += priceOf(id) * S.inv[id];
        S.inv[id] = 0;
      }
    }
    addCoins(g);
    daily('earn', g);
    sfx('coin');
    flyFrom(lastBtn, g);
    toast(`全部卖掉，得 ${g} 金币`);
  } else if (k === 'deliver') {
    const o = S.orders[+v];
    if (!o || !canDeliver(o)) return;
    o.items.forEach(([id, q]) => (S.inv[id] -= q));
    const pay = payOf(o);
    addCoins(pay);
    flyFrom(lastBtn, pay);
    S.st.orders++;
    daily('order');
    if (o.exp) S.st.hot++;
    S.orders.splice(+v, 1);
    if (o.fest != null && festNow() >= 0 && S.fest && o.fest === S.fest.key) {
      S.fest.pts++;
      const msg = `盖上一枚${FESTS[festNow()].n}节日章（${S.fest.pts}/6）`;
      setTimeout(() => toast(msg, 'gold'), 900);
    }
    const fh = folkH(o.who),
      fa = folkGain(o);
    if (folkH(o.who) === fh) toast(`${o.who}很满意，付了 ${pay} 金币，好感 +${fa}`, 'gold');
    sfx('coin');
    gainXP(o.xp);
    if (S.orders.length < 1) S.orderCd = Math.min(S.orderCd, 6);
  } else if (k === 'decline') {
    S.orders.splice(+v, 1);
    S.orderCd = Math.min(S.orderCd, 12);
  } else if (k === 'build') {
    const B = BUILD[v];
    if (!B || S.coins < B.cost || S.lvl < B.lvl) return;
    S.coins -= B.cost;
    sfx('level');
    if (v === 'coop') {
      S.coop = true;
      S.an.hen = [
        { t: 0, fed: false },
        { t: 0, fed: false }
      ];
      toast('鸡舍建好了！种点小麦当饲料', 'gold');
    } else if (v === 'mill') {
      S.mill.built = true;
      toast('磨坊转起来了！点磨坊开始加工', 'gold');
    } else {
      S.pasture = true;
      S.an.cow = [{ t: 0, fed: false }];
      toast('牧场建好了！奶牛爱吃玉米', 'gold');
    }
  } else if (k === 'buy') {
    const A = ANIM[v],
      n = S.an[v].length,
      c = A.cost(n);
    if (n >= A.max || S.coins < c || (A.lvl && S.lvl < A.lvl)) return;
    S.coins -= c;
    S.an[v].push({ t: 0, fed: false });
    sfx(v === 'hen' ? 'egg' : 'moo');
    toast(`新${A.n}住进来了`);
  } else if (k === 'feed') {
    S.feed = !S.feed;
  } else if (k === 'qgive') {
    const qi = qInfo();
    if (!qi || qi.lock) return;
    let n = 0;
    for (const [id, nd] of Object.entries(qi.Q.need)) {
      const gv = S.quest.given[id] || 0,
        give = Math.min(S.inv[id], nd - gv);
      if (give > 0) {
        S.inv[id] -= give;
        S.quest.given[id] = gv + give;
        n += give;
      }
    }
    if (n) {
      sfx('coin');
      toast(`交了 ${n} 件材料`);
    }
  } else if (k === 'qdone') {
    const qi = qInfo();
    if (!qi || qi.lock || qi.left.length || S.coins < qi.Q.coins) return;
    const Q = qi.Q;
    S.coins -= Q.coins;
    S.quest.stage++;
    S.quest.given = {};
    sfx('ach');
    closeSheet();
    banner = { t: 3, text: Q.done[0], sub: Q.done[1] };
    camTarget = Q.cam;
    for (let k2 = 0; k2 < 60; k2++)
      parts.push({
        x: 4 + (rand() - 0.5) * 6,
        y: Q.cam - 1,
        vx: (rand() - 0.5) * 6,
        vy: -rand() * 6 - 2,
        l: 1.8,
        c: ['#f7cb4d', '#e65b84', '#7cc7ea', '#9bd36a', '#fff'][k2 % 5],
        s: 0.08,
        conf: true
      });
    toast(`「${Q.n}」完工！${Q.reward}`, 'gold');
    gainXP(Q.xp);
    hudKey = '';
    return;
  } else if (k === 'ptree') {
    const TR = TREES[v];
    if (!TR || S.trees[sheetArg] || S.lvl < TR.lvl || S.coins < TR.cost) return;
    S.coins -= TR.cost;
    S.trees[sheetArg] = { k: v, g: 0, f: 0, t: 0 };
    const [tx, ty] = TSLOT[sheetArg];
    burst(tx, ty - 0.2, '#7a5232', 10, 2, 2);
    sfx('plant');
    toast(`种下了${TR.n}，${Math.round(TR.grow / 60)} 分钟后长成`);
    closeSheet();
    return;
  } else if (k === 'cast') {
    if (!F || castsLeft(F.w) <= 0) return;
    S.fish[F.w]++;
    const pool = FISHP[F.w].pool;
    let r = rand(),
      fish = pool[0][0];
    for (const [id, pp] of pool) {
      if (r < pp) {
        fish = id;
        break;
      }
      r -= pp;
    }
    F = { w: F.w, phase: 'wait', t: 1.2 + rand() * 2.2, fish };
    sfx('water');
  } else if (k === 'reel') {
    if (!F || F.phase !== 'bite') return;
    F.ok = F.pos >= F.z0 && F.pos <= F.z0 + F.zw;
    F.phase = 'res';
    if (F.ok) {
      S.inv[F.fish]++;
      dexAdd(F.fish);
      if (F.fish !== 'boot') {
        S.st.fish++;
        daily('fish');
      }
      if (F.fish === 'koi') {
        S.st.koi++;
        toast('锦鲤！今天运气爆棚', 'gold');
      }
      gainXP(ITEMS[F.fish].xp);
      sfx('harvest');
    } else sfx('deny');
  } else if (k === 'dog') {
    if (S.dog || S.lvl < 2 || S.coins < 180) return;
    S.coins -= 180;
    S.dog = true;
    dog.x = 4;
    dog.y = 2.86;
    dog.w = 0;
    sfx('bark');
    toast('旺财来到农场了！它会帮你赶乌鸦', 'gold');
  } else if (k === 'tsfx') {
    sfxOn = !sfxOn;
    setAudio();
    initAudio();
    sfx('coin');
  } else if (k === 'tmus') {
    musicOn = !musicOn;
    setAudio();
    initAudio();
  } else if (k === 'merch') {
    const M = MERCH[v];
    if (!M || !merchHere() || S.merch.bought[v] || S.coins < M.cost) return;
    S.coins -= M.cost;
    S.merch.bought[v] = 1;
    sfx('ach');
    if (v === 'goldseed') {
      S.goldSeeds = (S.goldSeeds || 0) + 3;
      toast('接下来 3 次播种都会长出金色作物', 'gold');
    } else if (v === 'potion') {
      let n = 0;
      S.plots.forEach((p, i) => {
        if (p.c && p.g < CROPS[p.c].time) {
          p.g = Math.min(CROPS[p.c].time, p.g + CROPS[p.c].time * 0.5);
          n++;
          const q = plotXY(i);
          burst(q.x + 0.5, q.y + 0.4, '#9bf06a', 8, 2, 2.4, 0.06);
        }
      });
      toast(`${n} 块地的作物猛长了一截`, 'gold');
    } else if (v === 'feedpack') {
      S.inv.wheat += 10;
      S.inv.corn += 6;
      toast('饲料大礼包放进仓库了');
    } else if (v === 'bell') {
      S.weather = { type: 'rain', rs: S.clock, re: Math.min(1439, S.clock + 200) };
      toast('叮铃铃……下雨了！', 'gold');
    } else if (v === 'clover') {
      S.clover = S.day;
      toast('幸运四叶草：今天交订单多拿 50% 金币', 'gold');
    }
  } else if (k === 'craft') {
    craft(v);
  } else if (k === 'fill') {
    craftFill(v);
  } else if (k === 'wtab') {
    wsTab = v;
  } else if (k === 'wbuild') {
    buildWork(v);
  } else if (k === 'wup') {
    upgradeWork(v);
  } else if (k === 'rush') {
    rush(v);
  } else if (k === 'wcollect') {
    collectWork(v);
  } else if (k === 'wall') {
    collectAllWorks();
  } else if (k === 'claim') {
    const A = ACH.find(x => x.id === v);
    if (!A || S.ach[v] || A.v() < A.goal) return;
    S.ach[v] = 1;
    addCoins(A.r);
    flyFrom(lastBtn, A.r);
    sfx('ach');
    toast(`领取成就「${A.n}」奖励 ${A.r} 金币`, 'gold');
  } else if (k === 'up') {
    const u = UPG[v],
      l = S.up[v],
      c = u.costs[l];
    if (l >= u.costs.length || S.coins < c || S.lvl < u.lv[l]) return;
    S.coins -= c;
    S.up[v]++;
    buildSeeds();
    sfx('level');
    toast(`${u.n}升级了：${u.fmt(S.up[v])}`);
  } else if (k === 'buyplot') {
    const c = plotCost(),
      p = S.plots[sheetArg];
    if (!p || !p.L || S.coins < c) return;
    S.coins -= c;
    S.bought++;
    p.L = false;
    const q = plotXY(sheetArg);
    burst(q.x + 0.5, q.y + 0.5, '#7a5232', 14, 3, 3);
    burst(q.x + 0.5, q.y + 0.5, '#5da34a', 8, 3, 3);
    sfx('plant');
    closeSheet();
    return;
  }
  renderSheet();
  hudKey = '';
}

// 补算离开的时间（最多 8 小时），返回这段时间的收获汇总
function catchUp() {
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.saved || Date.now())) / 1000));
  banner = null;
  if (away <= 20) return null;
  const inv0 = { ...S.inv },
    coins0 = S.coins;
  offStat = { hand: 0, lvUp: 0, keep: Math.floor(S.coins * 0.6) };
  offClock = 1440;
  simOff = true;
  try {
    // 步长随离开时长放大，最多算 6000 步，手机上也能很快打开
    const step = Math.max(1, away / 6000);
    for (let t = 0; t < away; t += step) update(step, true);
  } finally {
    simOff = false;
  }
  banner = null;
  const gains = {};
  for (const k in S.inv) if (S.inv[k] - (inv0[k] || 0) > 0) gains[k] = S.inv[k] - (inv0[k] || 0);
  return {
    away,
    gains,
    ready: { ...S.ready },
    works: worksReady(),
    fruit: S.trees.reduce((a, t) => a + (t ? t.f : 0), 0),
    ripe: S.plots.filter(p => p.c && p.g >= CROPS[p.c].time).length,
    hand: offStat.hand,
    lvUp: offStat.lvUp,
    spent: Math.max(0, coins0 - S.coins),
    gift: away >= 3600 ? 50 + S.lvl * 20 : 0
  };
}

async function pushCloud() {

  cloud.busy = true;
  try {
    S.saved = Date.now();
    await cloud.ref.set({ json: JSON.stringify(S), saved: S.saved, play: Math.round(S.play || 0), v: 3 });
    cloudState = 'on';
  } catch (e) {
    cloudState = e && e.code === 'quota_exceeded' ? 'full' : 'err';
  }
  cloud.busy = false;
}
async function initCloud() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/farm');
    let snap;
    try {
      snap = await ref.get();
    } catch (e) {
      await new Promise(r => setTimeout(r, 800 + rand() * 800));
      snap = await ref.get();
    }
    cloud = { ref, busy: false };
    cloudState = 'on';
    if (snap.exists) {
      const d = snap.data() || {};
      if (
        typeof d.json === 'string' &&
        ((d.saved || 0) > bootSaved + 5000 || ((S.play || 0) < 90 && (d.play || 0) > (S.play || 0) + 60)) &&
        !(S.resetAt && (d.saved || 0) < S.resetAt)
      ) {
        let s2 = null;
        try {
          s2 = load(JSON.parse(d.json));
        } catch (e) {}
        if (s2) {
          adopt(s2);
          toast('已接上云端存档', 'gold');
        }
      }
    }
    pushCloud();
  } catch (e) {
    cloudState = cloud ? 'err' : 'off';
  }
}
bootSaved = S.saved || 0;
const ret0 = catchUp();
rollDaily();
banner = !S.welcomed
  ? null
  : festNow() >= 0
    ? { t: 3, text: FESTS[festNow()].n, sub: '两天节日 · 交节日订单攒章' }
    : { t: 3, text: SEA[season()].n + '天', sub: `第${Math.floor((S.day - 1) / 16) + 1}年` };
coinShown = S.coins;
$('#coins').textContent = fmtC(S.coins);
S.sheet = null;
if (!S.welcomed) {
  S.welcomed = true;
  openSheet('welcome');
} else if (ret0 && ret0.away >= 120) {
  retInfo = ret0;
  banner = null;
  openSheet('back');
}
let last = performance.now(),
  saveT = 0;
let perfT = 0,
  perfN = 0;
function frame(n) {
  const raw = (n - last) / 1000,
    dt = Math.min(0.1, raw);
  last = n;
  // 连续两秒帧率不到 40，就把画布分辨率往下调一档
  if (!document.hidden && raw < 0.5) {
    perfT += raw;
    perfN++;
    if (perfT > 2) {
      if (perfN / perfT < 40 && dprCap > 1) {
        dprCap = Math.max(1, dprCap - 0.25);
        resize();
      }
      perfT = perfN = 0;
    }
  }
  T += dt;
  const st = $('#stage');
  if (cw !== st.clientWidth || ch !== st.clientHeight) resize();
  update(dt, false);
  render();
  hud();
  saveT += dt;
  if (saveT > 4) {
    saveT = 0;
    save();
  }
  achT += dt;
  if (achT > 1) {
    achT = 0;
    checkAch();
  }
  if (S.sheet === 'works') {
    const j = W(wsTab).q[0],
      el = document.getElementById('wtime'),
      bar = document.getElementById('wbar0');
    if (j && el) el.textContent = '还要 ' + fmtT(j.t);
    if (j && bar) bar.style.width = (1 - j.t / RECIPES[j.r].t) * 100 + '%';
  }
  if (S.sheet === 'orders')
    document.querySelectorAll('[data-exp]').forEach(el => {
      const o = S.orders[+el.dataset.exp];
      if (o && o.exp) el.textContent = '加急 ' + fmtT(o.exp);
    });
  music();
  // 跨过零点换新任务；新手引导结束后，每天第一次打开提醒签到
  if (achT === 0) {
    if (rollDaily()) toast('新的一天，每日任务刷新了', 'gold');
    festRoll();
    if (
      S.tut >= 4 &&
      !S.sheet &&
      !placing &&
      !dailyPrompted &&
      T - sheetT > 6 &&
      S.daily &&
      !S.daily.signed
    ) {
      dailyPrompted = true;
      openSheet('daily');
    }
  }
  S.play = (S.play || 0) + dt;
  cloudT += dt;
  if (cloudT > 15) {
    cloudT = 0;
    pushCloud();
  }
  if (F && F.phase === 'bite') {
    const nd = document.getElementById('needle');
    if (nd) nd.style.left = F.pos * 100 + '%';
  }
  if (camTarget != null) {
    const b0 = camY;
    camY += (camTarget - camY) * Math.min(1, dt * 4);
    applyCam();
    if (Math.abs(camY - b0) < 0.002) camTarget = null;
  }
  {
    const jb = $('#jump'),
      tall = WH * U > ch + 20;
    if (jb.hidden === tall) jb.hidden = !tall;
    if (tall) {
      const txt = camY > WH * 0.55 ? '回农场 ↑' : '去南岸 ↓';
      if (jb.textContent !== txt) jb.textContent = txt;
    }
  }
  if (coinShown !== S.coins) {
    const d = S.coins - coinShown;
    coinShown += Math.sign(d) * Math.max(1, Math.ceil(Math.abs(d) * 0.15));
    $('#coins').textContent = fmtC(coinShown);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    pushCloud();
  }
});
initCloud();
setTimeout(siteTips, 5000);
})();
</script>
</body></html>

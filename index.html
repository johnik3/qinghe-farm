function drawLabels() {
  const left = w => Math.max(0, FISHP[w].casts - (S.fish.day === S.day ? S.fish[w] : 0));
  label(`钓鱼 ${left('pond')}/5`, X(POND.x + POND.w - 0.5), Y(POND.y + 0.05));
  const qi = qInfo();
  label(qi ? '村庄复兴' : '复兴完成', X(BRIDGE.x + BRIDGE.w / 2), Y(BRIDGE.y - 0.1));
  if (qi && !qi.lock && (qi.canGive || qi.ready)) {
    const by = Y(BRIDGE.y - 0.55) + Math.sin(T * 5) * U * 0.05;
    circ(ctx, X(4), by, U * 0.17, '#e6a92a');
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(U * 0.24)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', X(4), by + 1);
  }
  if (S.quest.stage >= 2) label(`钓鱼 ${left('lake')}/5`, X(LAKE.x + LAKE.w * 0.6), Y(LAKE.y + 0.12));
  if (S.quest.stage >= 1) label('果园', X(ORCH.x + ORCH.w / 2), Y(ORCH.y + 0.12));
  if (S.quest.stage >= 3) label('集市', X(MARKET.x + MARKET.w / 2), Y(MARKET.y + 1.02));
  if (F && (F.phase === 'wait' || F.phase === 'bite')) {
    const P =
      F.w === 'pond'
        ? { x: POND.x + POND.w / 2, y: POND.y + POND.h / 2 }
        : { x: LAKE.x + 1, y: LAKE.y + LAKE.h * 0.48 };
    const bx = X(P.x),
      by = Y(P.y) + (F.phase === 'bite' ? Math.sin(T * 20) * 3 : Math.sin(T * 3) * 1.5);
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(
      bx,
      by + U * 0.05,
      U * (0.12 + (T % 1) * 0.2),
      U * (0.05 + (T % 1) * 0.08),
      0,
      0,
      Math.PI * 2
    );
    ctx.stroke();
    circ(ctx, bx, by, U * 0.06, '#e0453a');
    circ(ctx, bx, by - U * 0.05, U * 0.04, '#fff');
  }
}

/* 绘制田地：土壤、作物各生长阶段、果树 */
function drawSoil(x, y, s, wet) {
  const g = ctx.createLinearGradient(0, y, 0, y + s);
  g.addColorStop(0, wet ? '#6a4428' : '#a3744b');
  g.addColorStop(1, wet ? '#573620' : '#8d613c');
  ctx.fillStyle = g;
  rrect(ctx, x, y, s, s, s * 0.14);
  ctx.fill();
  ctx.strokeStyle = wet ? 'rgba(30,15,5,.35)' : 'rgba(70,40,20,.28)';
  ctx.lineWidth = Math.max(1, s * 0.035);
  ctx.lineCap = 'round';
  for (let k = 1; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(x + s * 0.14, y + (s * k) / 4);
    ctx.lineTo(x + s * 0.86, y + (s * k) / 4);
    ctx.stroke();
  }
  if (season() === 3 && !wet) {
    ctx.fillStyle = 'rgba(235,245,250,.28)';
    rrect(ctx, x, y, s, s, s * 0.14);
    ctx.fill();
  }
  ctx.strokeStyle = wet ? 'rgba(140,200,230,.25)' : 'rgba(255,230,190,.25)';
  ctx.lineWidth = Math.max(1, s * 0.03);
  rrect(ctx, x + 1.5, y + 1.5, s - 3, s - 3, s * 0.13);
  ctx.stroke();
}

function drawPlant(id, cx, by, s, st, i) {
  const C = CROPS[id],
    sw = Math.sin(T * 1.7 + i * 0.9) * 0.08;
  ctx.save();
  ctx.translate(cx, by);
  ctx.rotate(sw * 0.3);
  ctx.translate(-cx, -by);
  if (st === 0) {
    ell(ctx, cx, by, s * 0.2, s * 0.08, '#5b3a22');
    for (let k = -1; k <= 1; k++) circ(ctx, cx + k * s * 0.07, by - s * 0.03, s * 0.025, '#e9d7a8');
  } else if (st === 1) {
    ctx.strokeStyle = C.leaf;
    ctx.lineWidth = s * 0.04;
    ctx.beginPath();
    ctx.moveTo(cx, by);
    ctx.lineTo(cx, by - s * 0.15);
    ctx.stroke();
    leaf(ctx, cx, by - s * 0.14, s * 0.18, -2.4 + sw, s * 0.07, C.leaf);
    leaf(ctx, cx, by - s * 0.14, s * 0.18, -0.7 + sw, s * 0.07, '#7cc05a');
  } else if (st === 2) {
    const tall = id === 'corn' || id === 'sunflower',
      h = s * (tall ? 0.48 : 0.28);
    ctx.strokeStyle = C.leaf;
    ctx.lineWidth = s * 0.05;
    ctx.beginPath();
    ctx.moveTo(cx, by);
    ctx.lineTo(cx, by - h);
    ctx.stroke();
    for (let k = 0; k < 4; k++) {
      const yy = by - h * (0.25 + k * 0.22);
      leaf(
        ctx,
        cx,
        yy,
        s * (0.26 - k * 0.03),
        (k % 2 ? -0.5 : -2.6) + sw,
        s * 0.08,
        k % 2 ? C.leaf : '#6fb24e'
      );
    }
    if (id === 'tomato' || id === 'strawberry' || id === 'melon' || id === 'pumpkin')
      circ(ctx, cx + s * 0.12, by - s * 0.1, s * 0.06, '#8cc56a');
  } else {
    switch (id) {
      case 'radish':
        for (let k = 0; k < 4; k++)
          leaf(ctx, cx, by - s * 0.2, s * 0.3, -2.3 + k * 0.5 + sw, s * 0.09, k % 2 ? '#5da34a' : '#6cb755');
        drawItem(ctx, 'radish', cx, by - s * 0.14, s * 0.22);
        break;
      case 'wheat':
        ctx.lineCap = 'round';
        for (let k = 0; k < 5; k++) {
          const bx = cx + (k - 2) * s * 0.12,
            tx = bx + Math.sin(T * 1.7 + i + k) * s * 0.05,
            ty = by - s * (0.5 + (k % 2) * 0.08);
          ctx.strokeStyle = '#c99a3a';
          ctx.lineWidth = s * 0.03;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx, by - s * 0.3, tx, ty);
          ctx.stroke();
          for (let g = 0; g < 4; g++) {
            ell(ctx, tx - s * 0.025, ty - g * s * 0.045, s * 0.025, s * 0.04, '#e8b94a', -0.4);
            ell(ctx, tx + s * 0.025, ty - g * s * 0.045, s * 0.025, s * 0.04, '#d9a63a', 0.4);
          }
        }
        break;
      case 'tomato':
        for (const [dx, dy, r] of [
          [-0.15, -0.22, 0.17],
          [0.15, -0.24, 0.17],
          [0, -0.38, 0.19],
          [0, -0.15, 0.16]
        ])
          circ(ctx, cx + dx * s, by + dy * s, r * s, dy < -0.3 ? '#5aa043' : '#4a8a38');
        for (const [dx, dy] of [
          [-0.13, -0.2],
          [0.14, -0.3],
          [0.02, -0.42]
        ])
          drawItem(ctx, 'tomato', cx + dx * s, by + dy * s, s * 0.12);
        break;
      case 'corn':
        for (const dx of [-0.14, 0.14]) {
          ctx.strokeStyle = '#5f9a3a';
          ctx.lineWidth = s * 0.05;
          ctx.beginPath();
          ctx.moveTo(cx + dx * s, by);
          ctx.lineTo(cx + dx * s, by - s * 0.68);
          ctx.stroke();
          leaf(ctx, cx + dx * s, by - s * 0.3, s * 0.3, dx < 0 ? -2.7 : -0.45, s * 0.07, '#6aa140');
          leaf(ctx, cx + dx * s, by - s * 0.52, s * 0.25, dx < 0 ? -0.6 : -2.5, s * 0.06, '#7fb34d');
          ctx.strokeStyle = '#d9b45a';
          ctx.lineWidth = s * 0.02;
          ctx.beginPath();
          ctx.moveTo(cx + dx * s, by - s * 0.68);
          ctx.lineTo(cx + dx * s + s * 0.04, by - s * 0.78);
          ctx.stroke();
        }
        drawItem(ctx, 'corn', cx + s * 0.02, by - s * 0.35, s * 0.18);
        break;
      case 'strawberry':
        for (let k = 0; k < 6; k++)
          leaf(ctx, cx, by - s * 0.08, s * 0.26, -3 + k * 0.55 + sw, s * 0.1, k % 2 ? '#3f8a3e' : '#55a04a');
        for (const [dx, dy] of [
          [-0.18, -0.08],
          [0.17, -0.1],
          [0, -0.2]
        ])
          drawItem(ctx, 'strawberry', cx + dx * s, by + dy * s, s * 0.11);
        break;
      case 'sunflower':
        ctx.strokeStyle = '#5c9a3a';
        ctx.lineWidth = s * 0.05;
        ctx.beginPath();
        ctx.moveTo(cx, by);
        ctx.lineTo(cx, by - s * 0.6);
        ctx.stroke();
        leaf(ctx, cx, by - s * 0.2, s * 0.24, -2.7, s * 0.09, '#5c9a3a');
        leaf(ctx, cx, by - s * 0.32, s * 0.24, -0.4, s * 0.09, '#6fb24e');
        drawItem(ctx, 'sunflower', cx, by - s * 0.66, s * 0.22);
        break;
      case 'pumpkin':
        leaf(ctx, cx - s * 0.1, by - s * 0.1, s * 0.3, -2.6, s * 0.12, '#4d8a35');
        leaf(ctx, cx + s * 0.1, by - s * 0.12, s * 0.3, -0.5, s * 0.12, '#5a9a3e');
        drawItem(ctx, 'pumpkin', cx, by - s * 0.2, s * 0.3);
        break;
      case 'melon':
        leaf(ctx, cx - s * 0.15, by - s * 0.05, s * 0.28, -2.8, s * 0.12, '#3e7f33');
        leaf(ctx, cx + s * 0.12, by - s * 0.08, s * 0.3, -0.3, s * 0.12, '#4f9440');
        drawItem(ctx, 'melon', cx, by - s * 0.17, s * 0.34);
        break;
    }
  }
  ctx.restore();
}

function drawPlots() {
  for (let i = 0; i < S.plots.length; i++) {
    const p = S.plots[i],
      q = plotXY(i),
      s = U * 0.9,
      x = X(q.x) + U * 0.05,
      y = Y(q.y) + U * 0.05;
    if (p.L) {
      ctx.fillStyle = season() === 3 ? 'rgba(120,140,150,.15)' : 'rgba(60,100,40,.22)';
      rrect(ctx, x, y, s, s, s * 0.14);
      ctx.fill();
      ctx.setLineDash([U * 0.08, U * 0.07]);
      ctx.strokeStyle = 'rgba(255,255,230,.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
      const wc = season() === 2 ? '#a38f3e' : season() === 3 ? '#8aa094' : '#4f8a3c';
      for (let k = 0; k < 3; k++) {
        const tx = x + s * (0.25 + k * 0.25),
          ty = y + s * (0.55 + (k % 2) * 0.2);
        for (let b = -1; b <= 1; b++) leaf(ctx, tx, ty, s * 0.15, -1.57 + b * 0.5, s * 0.04, wc);
      }
      if (i % 5 === 2) ell(ctx, x + s * 0.7, y + s * 0.3, s * 0.1, s * 0.07, '#a7a59a');
      circ(ctx, x + s * 0.5, y + s * 0.35, s * 0.13, 'rgba(255,255,240,.65)');
      ctx.fillStyle = '#4f7a3a';
      ctx.font = `bold ${Math.round(s * 0.22)}px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+', x + s * 0.5, y + s * 0.36);
      continue;
    }
    withPop(i, x, y, s, () => drawSoil(x, y, s, (p.m > 0 && !!p.c) || raining()));
  }
  for (let i = 0; i < S.plots.length; i++) {
    const p = S.plots[i];
    if (p.L || !p.c) continue;
    const q = plotXY(i),
      s = U * 0.9,
      x = X(q.x) + U * 0.05,
      y = Y(q.y) + U * 0.05,
      C = CROPS[p.c],
      pr = p.g / C.time,
      ripe = pr >= 1,
      st = ripe ? 3 : Math.min(2, Math.floor(pr * 3)),
      cx = x + s / 2;
    let by = y + s * 0.74;
    if (ripe) by -= Math.abs(Math.sin(T * 3 + i)) * s * 0.03;
    if (p.gold && st >= 2) {
      const k = ctx.createRadialGradient(cx, by - s * 0.2, 1, cx, by - s * 0.2, s * 0.55);
      k.addColorStop(0, 'rgba(255,220,90,.55)');
      k.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = k;
      ctx.fillRect(x - s * 0.1, y - s * 0.3, s * 1.2, s * 1.2);
    }
    withPop(i, x, y, s, () => drawPlant(p.c, cx, by, s, st, i));
    if (ripe) {
      for (let k = 0; k < 2; k++) {
        const a = T * 2 + i + k * 3,
          sx = cx + Math.cos(a) * s * 0.35,
          sy = y + s * 0.25 + Math.sin(a * 1.3) * s * 0.2,
          r = s * 0.05 * (0.6 + 0.4 * Math.sin(T * 6 + k));
        star(sx, sy, r, p.gold ? '#ffd84a' : '#fffbe0');
      }
    } else {
      const off = !C.ss.includes(season()) && !S.up.green;
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      rrect(ctx, x + s * 0.14, y + s * 0.86, s * 0.72, s * 0.07, s * 0.035);
      ctx.fill();
      ctx.fillStyle = p.m <= 0 ? '#e8c35a' : off ? '#b9c98a' : '#9bd36a';
      rrect(ctx, x + s * 0.14, y + s * 0.86, s * 0.72 * pr, s * 0.07, s * 0.035);
      ctx.fill();
      if (p.m <= 0) {
        const bx = x + s * 0.84,
          by2 = y + s * 0.12 + Math.sin(T * 4 + i) * s * 0.03;
        circ(ctx, bx, by2, s * 0.16, 'rgba(255,255,255,.92)');
        ctx.beginPath();
        ctx.moveTo(bx, by2 - s * 0.1);
        ctx.quadraticCurveTo(bx + s * 0.08, by2 + s * 0.01, bx, by2 + s * 0.07);
        ctx.quadraticCurveTo(bx - s * 0.08, by2 + s * 0.01, bx, by2 - s * 0.1);
        ctx.fillStyle = '#4aa3c9';
        ctx.fill();
      }
    }
  }
}

function drawFruitTree(tx, ty, tr, i) {
  const x = X(tx),
    y = Y(ty),
    si = season();
  if (y < -U * 2 || y > ch + U * 0.5) return;
  if (!tr) {
    ell(ctx, x, y - U * 0.05, U * 0.32, U * 0.12, '#8d613c');
    ctx.fillStyle = 'rgba(255,255,240,.85)';
    ctx.font = `bold ${Math.round(U * 0.3)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+', x, y - U * 0.32);
    return;
  }
  const TR = TREES[tr.k],
    pr = Math.min(1, tr.g / TR.grow);
  if (pr < 0.35) {
    ell(ctx, x, y, U * 0.25, U * 0.09, '#7a5232');
    ctx.strokeStyle = '#6e4a2c';
    ctx.lineWidth = U * 0.05;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - U * 0.4);
    ctx.stroke();
    leaf(ctx, x, y - U * 0.3, U * 0.2, -2.5, U * 0.07, '#6cb755');
    leaf(ctx, x, y - U * 0.38, U * 0.2, -0.6, U * 0.07, '#5da34a');
  } else {
    const s = U * (0.55 + 0.45 * pr),
      sw = Math.sin(T * 0.8 + i) * s * 0.02;
    shadow(x + s * 0.1, y + s * 0.05, s * 0.62, s * 0.2);
    ctx.fillStyle = '#6e4a2c';
    rrect(ctx, x - s * 0.09, y - s * 0.55, s * 0.18, s * 0.58, s * 0.05);
    ctx.fill();
    let dk = TR.c[0],
      lt = TR.c[1];
    if (si === 3 && tr.k !== 'orange') {
      dk = '#8a7f6a';
      lt = '#b5aa92';
    } else if (si === 2 && tr.k !== 'orange') {
      dk = '#b9772a';
      lt = '#e8b84a';
    }
    circ(ctx, x - s * 0.32 + sw, y - s * 0.75, s * 0.36, dk);
    circ(ctx, x + s * 0.32 + sw, y - s * 0.78, s * 0.36, dk);
    circ(ctx, x + sw, y - s * 1.08, s * 0.46, rg(ctx, x + sw, y - s * 1.08, s * 0.5, lt, dk));
    if (si === 0 && tr.k !== 'orange')
      for (let k = 0; k < 8; k++)
        circ(
          ctx,
          x + sw + Math.cos(k * 2.1 + i) * s * 0.4,
          y - s * 0.95 + Math.sin(k * 1.7) * s * 0.3,
          s * 0.05,
          tr.k === 'peach' ? '#f7a6c8' : '#fff0f5'
        );
    if (si === 3) ell(ctx, x + sw, y - s * 1.45, s * 0.32, s * 0.1, '#fbfdff');
    for (let k = 0; k < tr.f * 3; k++) {
      const a = k * 2.39 + i,
        d = s * (0.15 + (((k * 37) % 10) / 10) * 0.3);
      drawItem(ctx, TR.fruit, x + sw + Math.cos(a) * d, y - s * 0.95 + Math.sin(a) * d * 0.8, s * 0.11);
    }
    if (tr.f > 0) star(x + s * 0.45, y - s * 1.3 + Math.sin(T * 4 + i) * 3, s * 0.07, '#fffbe0');
  }
  if (pr < 1) {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    rrect(ctx, x - U * 0.35, y + U * 0.12, U * 0.7, U * 0.07, U * 0.035);
    ctx.fill();
    ctx.fillStyle = '#9bd36a';
    rrect(ctx, x - U * 0.35, y + U * 0.12, U * 0.7 * pr, U * 0.07, U * 0.035);
    ctx.fill();
  }
}

// 种、浇、收时地块轻轻弹一下
function withPop(i, x, y, s, fn) {
  const t0 = plotPop[i];
  if (t0 == null || T - t0 > 0.35) return fn();
  const k = Math.sin(Math.min(1, (T - t0) / 0.35) * Math.PI) * 0.12,
    cx = x + s / 2,
    cy = y + s * 0.6;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1 + k, 1 - k * 0.6);
  ctx.translate(-cx, -cy);
  fn();
  ctx.restore();
}

/* 绘制动物与角色：鸡、牛、羊、乌鸦、猫、狗、商人 */
function hungry(x, y, feed, i) {
  const by = y + Math.sin(T * 3 + i) * 2;
  circ(ctx, x, by, U * 0.13, 'rgba(255,255,255,.92)');
  drawItem(ctx, feed, x, by + U * 0.01, U * 0.09);
}

function drawHen(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.32,
    moving = h.w <= 0,
    b = moving ? Math.abs(Math.sin(T * 10 + i)) * s * 0.08 : 0,
    peck = !moving && Math.sin(T * 3 + i * 2) > 0.6;
  shadow(x, y, s * 0.45, s * 0.12, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  ctx.strokeStyle = '#e0a030';
  ctx.lineWidth = s * 0.08;
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.15);
  ctx.lineTo(-s * 0.12, 0);
  ctx.moveTo(s * 0.1, -s * 0.15);
  ctx.lineTo(s * 0.12, 0);
  ctx.stroke();
  ell(ctx, -s * 0.35, -s * 0.55, s * 0.2, s * 0.28, '#f3ece0', -0.6);
  ell(ctx, 0, -s * 0.42, s * 0.45, s * 0.32, '#fbf7ee');
  ell(ctx, -s * 0.05, -s * 0.42, s * 0.25, s * 0.15, '#e9e0cf', 0.2);
  const hx = peck ? s * 0.42 : s * 0.32,
    hy = peck ? -s * 0.32 : -s * 0.72;
  circ(ctx, hx, hy, s * 0.2, '#fbf7ee');
  circ(ctx, hx - s * 0.02, hy - s * 0.2, s * 0.09, '#e0453a');
  circ(ctx, hx + s * 0.08, hy - s * 0.18, s * 0.07, '#e0453a');
  poly(
    ctx,
    [
      [hx + s * 0.18, hy - s * 0.02],
      [hx + s * 0.34, hy + s * 0.04],
      [hx + s * 0.17, hy + s * 0.08]
    ],
    '#f0a830'
  );
  circ(ctx, hx + s * 0.06, hy - s * 0.04, s * 0.04, '#222');
  ell(ctx, hx + s * 0.12, hy + s * 0.14, s * 0.05, s * 0.08, '#e0453a');
  ctx.restore();
  const st = S.an.hen[i];
  if (st && !st.fed) hungry(x, y - s * 1.35, 'wheat', i);
}

function drawCow(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.55,
    mv = h.w <= 0,
    b = mv ? Math.abs(Math.sin(T * 6 + i)) * s * 0.04 : 0,
    graze = !mv && Math.sin(T * 0.8 + h.ph) > 0.2;
  shadow(x, y, s * 0.62, s * 0.13, 0.22);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  ctx.strokeStyle = '#3a3330';
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  const tw = Math.sin(T * 3 + i) * s * 0.08;
  ctx.moveTo(-s * 0.48, -s * 0.42);
  ctx.quadraticCurveTo(-s * 0.62, -s * 0.3, -s * 0.58 + tw, -s * 0.12);
  ctx.stroke();
  for (const lx of [-0.32, -0.18, 0.2, 0.34]) {
    ctx.fillStyle = '#e9e3d8';
    ctx.fillRect(lx * s - s * 0.05, -s * 0.25, s * 0.1, s * 0.25);
    ctx.fillStyle = '#3a3330';
    ctx.fillRect(lx * s - s * 0.05, -s * 0.05, s * 0.1, s * 0.05);
  }
  ell(ctx, 0, -s * 0.42, s * 0.52, s * 0.28, '#fbfaf5');
  ell(ctx, -s * 0.2, -s * 0.5, s * 0.17, s * 0.12, '#2f2a28', 0.3);
  ell(ctx, s * 0.2, -s * 0.35, s * 0.12, s * 0.09, '#2f2a28', -0.2);
  ell(ctx, -s * 0.38, -s * 0.32, s * 0.08, s * 0.1, '#2f2a28');
  ell(ctx, s * 0.05, -s * 0.18, s * 0.08, s * 0.04, '#f0a7b3');
  const hx = s * 0.55,
    hy = graze ? -s * 0.2 : -s * 0.55;
  ell(ctx, hx, hy, s * 0.2, s * 0.22, '#fbfaf5');
  ell(ctx, hx + s * 0.08, hy + s * 0.13, s * 0.15, s * 0.11, '#f3b3bd');
  circ(ctx, hx + s * 0.03, hy + s * 0.13, s * 0.025, '#8a4a52');
  circ(ctx, hx + s * 0.13, hy + s * 0.13, s * 0.025, '#8a4a52');
  ell(ctx, hx - s * 0.2, hy - s * 0.12, s * 0.1, s * 0.05, '#2f2a28', -0.4);
  leaf(ctx, hx - s * 0.04, hy - s * 0.18, s * 0.12, -2.2, s * 0.03, '#e8dcc0');
  leaf(ctx, hx + s * 0.08, hy - s * 0.18, s * 0.12, -1, s * 0.03, '#e8dcc0');
  circ(ctx, hx + s * 0.02, hy - s * 0.04, s * 0.035, '#1e1a19');
  ctx.restore();
  const st = S.an.cow[i];
  if (st && !st.fed) hungry(x, y - s * 1.05, 'corn', i);
}

function drawSheep(h, i) {
  const x = X(h.x),
    y = Y(h.y),
    s = U * 0.42,
    mv = h.w <= 0,
    b = mv ? Math.abs(Math.sin(T * 8 + i)) * s * 0.06 : 0,
    graze = !mv && Math.sin(T * 0.9 + h.ph) > 0.3;
  shadow(x, y, s * 0.55, s * 0.13, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(h.dir || 1, 1);
  for (const lx of [-0.28, -0.12, 0.14, 0.3]) {
    ctx.fillStyle = '#3a3330';
    ctx.fillRect(lx * s - s * 0.04, -s * 0.25, s * 0.08, s * 0.25);
  }
  for (const [dx, dy] of [
    [-0.35, -0.45],
    [0, -0.62],
    [0.32, -0.45],
    [-0.18, -0.32],
    [0.16, -0.32],
    [0, -0.42]
  ]) {
    circ(ctx, dx * s, dy * s, s * 0.27, '#ddd6c8');
    circ(ctx, dx * s - s * 0.02, dy * s - s * 0.03, s * 0.24, '#fbf8f0');
  }
  const hx = s * 0.52,
    hy = graze ? -s * 0.25 : -s * 0.55;
  ell(ctx, hx, hy, s * 0.16, s * 0.2, '#3a3330');
  ell(ctx, hx - s * 0.14, hy - s * 0.1, s * 0.1, s * 0.05, '#3a3330', -0.4);
  circ(ctx, hx - s * 0.02, hy - s * 0.16, s * 0.12, '#fbf8f0');
  circ(ctx, hx + s * 0.06, hy - s * 0.02, s * 0.03, '#fff');
  ctx.restore();
}

function drawCrow(c) {
  const x = X(c.x),
    y = Y(c.y),
    s = U * 0.4,
    eat = c.phase === 'eat';
  if (eat) {
    const k = 1 - c.t / 8;
    ctx.strokeStyle = `rgba(216,69,91,${0.5 + 0.4 * Math.sin(T * 8)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, U * 0.48, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k));
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y - (eat ? 0 : s * 0.3));
  ctx.scale(c.dir || 1, 1);
  const fl = eat ? 0 : Math.sin(c.f * 18);
  const pk = eat && Math.sin(T * 9) > 0.3 ? s * 0.12 : 0;
  ell(ctx, 0, 0, s * 0.45, s * 0.28, '#2b2b36');
  poly(
    ctx,
    [
      [-s * 0.4, 0],
      [-s * 0.75, -s * 0.1],
      [-s * 0.7, s * 0.12]
    ],
    '#22222b'
  );
  circ(ctx, s * 0.38, -s * 0.18 + pk, s * 0.2, '#2b2b36');
  poly(
    ctx,
    [
      [s * 0.55, -s * 0.2 + pk],
      [s * 0.78, -s * 0.12 + pk],
      [s * 0.55, -s * 0.08 + pk]
    ],
    '#6b6b70'
  );
  circ(ctx, s * 0.42, -s * 0.24 + pk, s * 0.05, '#fff');
  circ(ctx, s * 0.43, -s * 0.24 + pk, s * 0.025, '#111');
  poly(
    ctx,
    [
      [-s * 0.1, -s * 0.05],
      [s * 0.15, -s * 0.05],
      [-s * 0.05, -s * 0.05 - s * 0.55 * fl]
    ],
    '#3a3a48'
  );
  if (eat) {
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-s * 0.05, s * 0.25);
    ctx.lineTo(-s * 0.08, s * 0.38);
    ctx.moveTo(s * 0.1, s * 0.25);
    ctx.lineTo(s * 0.12, s * 0.38);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCat() {
  const x = X(CAT.x),
    y = Y(CAT.y),
    s = U * 0.36,
    fur = '#e9a25f',
    dk = '#c47a3a';
  shadow(x, y, s * 0.55, s * 0.12, 0.2);
  if (cat.awake <= 0) {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x - s * 0.05, y - s * 0.2, s * 0.42, 0.3, 1.7);
    ctx.stroke();
    ell(ctx, x, y - s * 0.25, s * 0.48, s * 0.26, fur);
    ctx.strokeStyle = dk;
    ctx.lineWidth = s * 0.06;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * s * 0.18 - s * 0.05, y - s * 0.48);
      ctx.lineTo(x + k * s * 0.16 - s * 0.05, y - s * 0.32);
      ctx.stroke();
    }
    circ(ctx, x + s * 0.38, y - s * 0.24, s * 0.22, fur);
    poly(
      ctx,
      [
        [x + s * 0.22, y - s * 0.36],
        [x + s * 0.26, y - s * 0.58],
        [x + s * 0.38, y - s * 0.42]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.42, y - s * 0.42],
        [x + s * 0.56, y - s * 0.56],
        [x + s * 0.57, y - s * 0.34]
      ],
      fur
    );
    ctx.strokeStyle = '#5c3920';
    ctx.lineWidth = 1.3;
    for (const ex of [0.31, 0.47]) {
      ctx.beginPath();
      ctx.arc(x + s * ex, y - s * 0.24, s * 0.05, 0.3, Math.PI - 0.3);
      ctx.stroke();
    }
    const ph = (T * 0.45) % 1;
    ctx.globalAlpha = 1 - ph;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(U * (0.15 + ph * 0.1))}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('z', x + s * 0.7 + ph * s * 0.3, y - s * 0.75 - ph * s * 0.7);
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = fur;
    ctx.lineWidth = s * 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y - s * 0.1);
    ctx.quadraticCurveTo(x - s * 0.55, y - s * 0.2, x - s * 0.45 + Math.sin(T * 6) * s * 0.12, y - s * 0.6);
    ctx.stroke();
    ell(ctx, x, y - s * 0.35, s * 0.3, s * 0.36, fur);
    ell(ctx, x + s * 0.02, y - s * 0.28, s * 0.15, s * 0.24, '#fbeedd');
    circ(ctx, x, y - s * 0.82, s * 0.26, fur);
    poly(
      ctx,
      [
        [x - s * 0.24, y - s * 0.9],
        [x - s * 0.2, y - s * 1.18],
        [x - s * 0.04, y - s * 1.02]
      ],
      fur
    );
    poly(
      ctx,
      [
        [x + s * 0.24, y - s * 0.9],
        [x + s * 0.2, y - s * 1.18],
        [x + s * 0.04, y - s * 1.02]
      ],
      fur
    );
    circ(ctx, x - s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    circ(ctx, x + s * 0.1, y - s * 0.85, s * 0.05, '#2a3a1a');
    poly(
      ctx,
      [
        [x - s * 0.04, y - s * 0.75],
        [x + s * 0.04, y - s * 0.75],
        [x, y - s * 0.7]
      ],
      '#e86a7a'
    );
  }
}

function drawDog() {
  const x = X(dog.x),
    y = Y(dog.y),
    s = U * 0.42,
    mv = dog.w <= 0,
    sp = dog.run ? 18 : 10,
    b = mv ? Math.abs(Math.sin(T * sp)) * s * 0.08 : 0,
    lg = mv ? Math.sin(T * sp) * s * 0.08 : 0,
    fur = '#d98a3d',
    cr = '#fbeedd';
  shadow(x, y, s * 0.5, s * 0.12, 0.2);
  ctx.save();
  ctx.translate(x, y - b);
  ctx.scale(dog.dir || 1, 1);
  ctx.fillStyle = '#b86e2a';
  ctx.fillRect(-s * 0.3 + lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.fillRect(s * 0.2 - lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.strokeStyle = fur;
  ctx.lineWidth = s * 0.12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(-s * 0.4, -s * 0.6, s * 0.14, Math.PI * 0.2 + Math.sin(T * (mv ? 12 : 6)) * 0.3, Math.PI * 1.7);
  ctx.stroke();
  ell(ctx, 0, -s * 0.38, s * 0.42, s * 0.22, fur);
  ell(ctx, s * 0.05, -s * 0.3, s * 0.25, s * 0.1, cr);
  ctx.fillStyle = fur;
  ctx.fillRect(-s * 0.25 - lg, -s * 0.25, s * 0.1, s * 0.25);
  ctx.fillRect(s * 0.25 + lg, -s * 0.25, s * 0.1, s * 0.25);
  const hx = s * 0.42,
    hy = -s * 0.64;
  ell(ctx, hx - s * 0.1, hy + s * 0.2, s * 0.12, s * 0.06, '#d8455b');
  circ(ctx, hx, hy, s * 0.24, fur);
  ell(ctx, hx + s * 0.14, hy + s * 0.08, s * 0.13, s * 0.1, cr);
  circ(ctx, hx + s * 0.26, hy + s * 0.04, s * 0.045, '#2a1d14');
  poly(
    ctx,
    [
      [hx - s * 0.18, hy - s * 0.1],
      [hx - s * 0.12, hy - s * 0.38],
      [hx - s * 0.02, hy - s * 0.16]
    ],
    '#b86e2a'
  );
  poly(
    ctx,
    [
      [hx + s * 0.02, hy - s * 0.18],
      [hx + s * 0.1, hy - s * 0.4],
      [hx + s * 0.16, hy - s * 0.14]
    ],
    '#b86e2a'
  );
  circ(ctx, hx + s * 0.06, hy - s * 0.04, s * 0.04, '#2a1d14');
  if (!mv || dog.run) ell(ctx, hx + s * 0.2, hy + s * 0.18, s * 0.05, s * 0.07, '#e86a7a');
  ctx.restore();
}

  ctx.fillRect(-s * 0.16, -s * 0.38, s * 0.12, s * 0.38);

    ],

  );

  ctx.fillRect(-s * 0.26, -s * 0.58, s * 0.54, s * 0.07);

  ell(ctx, s * 0.02, -s * 1.0, s * 0.15, s * 0.08, '#e9e4da');

function drawHand() {

  ctx.fillRect(-s * 0.16 + lg, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillRect(s * 0.04 - lg, -s * 0.38, s * 0.12, s * 0.38);
  ctx.fillStyle = '#5c3920';
  ctx.fillRect(-s * 0.18 + lg, -s * 0.06, s * 0.15, s * 0.06);
  ctx.fillRect(s * 0.03 - lg, -s * 0.06, s * 0.15, s * 0.06);
  rrect(ctx, -s * 0.22, -s * 0.9, s * 0.44, s * 0.56, s * 0.1);
  ctx.fillStyle = '#e8eef0';
  ctx.fill();
  ctx.fillStyle = '#4a78a8';
  ctx.fillRect(-s * 0.2, -s * 0.66, s * 0.4, s * 0.32);
  ctx.fillRect(-s * 0.16, -s * 0.86, s * 0.07, s * 0.22);
  ctx.fillRect(s * 0.09, -s * 0.86, s * 0.07, s * 0.22);
  ctx.strokeStyle = '#f2c9a0';
  ctx.lineWidth = s * 0.1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(s * 0.2, -s * 0.8);
  ctx.lineTo(s * 0.34, work ? -s * 0.45 + Math.sin(T * 14) * s * 0.08 : -s * 0.5);
  ctx.stroke();
  circ(ctx, 0, -s * 1.08, s * 0.2, '#f2c9a0');
  circ(ctx, s * 0.08, -s * 1.1, s * 0.025, '#2a1d14');
  ell(ctx, s * 0.13, -s * 1.0, s * 0.05, s * 0.03, 'rgba(230,120,110,.5)');
  ell(ctx, 0, -s * 1.22, s * 0.36, s * 0.08, '#d9b45a');
  poly(
    ctx,
    [
      [-s * 0.18, -s * 1.22],
      [-s * 0.12, -s * 1.42],
      [s * 0.14, -s * 1.42],
      [s * 0.2, -s * 1.22]
    ],

  );

  ctx.fillRect(-s * 0.18, -s * 1.27, s * 0.38, s * 0.05);

  ctx.restore();
}
// 自动喷灌：田边的喷头转着洒水
function drawSprinklers() {
  if (S.up.water < 4 || raining()) return;
  for (const [sx, sy] of [
    [0.86, 3.12],
    [7.14, 3.12],
    [0.86, 8.42],
    [7.14, 8.42],
    [0.82, 5.75],
    [7.18, 5.75]
  ]) {
    const x = X(sx),
      y = Y(sy);
    if (y < -U || y > ch + U) continue;
    ctx.fillStyle = '#7a8a90';
    ctx.fillRect(x - U * 0.03, y - U * 0.18, U * 0.06, U * 0.18);
    circ(ctx, x, y - U * 0.2, U * 0.05, '#9fb0b6');
    for (let k = 0; k < 7; k++) {
      const a = T * 2.2 + sx + k * 0.12,
        r = U * (0.5 + ((T * 1.5 + k * 0.37) % 1) * 1.4);
      ctx.globalAlpha = 0.8 * (1 - ((T * 1.5 + k * 0.37) % 1));
      circ(ctx, x + Math.cos(a) * r, y - U * 0.2 + Math.sin(a) * r * 0.45, U * 0.04, '#d6f0ff');
    }
    ctx.globalAlpha = 1;
  }
}

/* 绘制南岸：河、桥、果园、湖与码头、集市 */
function drawSouth() {
  const st = S.quest.stage,
    si = season(),
    win = si === 3,
    y0 = Y(RIVER.y),
    h = RIVER.h * U;
  if (y0 > ch + U * 0.5 || Y(WH) < -U) return;
  ctx.fillStyle = win ? '#dfe6e8' : '#c9b583';
  ctx.fillRect(0, y0 - U * 0.12, cw, h + U * 0.24);
  ctx.fillStyle = lg(ctx, y0, y0 + h, win ? '#e4f2f8' : '#6cc0e0', win ? '#b3d4e2' : '#3b88b0');
  ctx.fillRect(0, y0, cw, h);
  ctx.lineCap = 'round';
  if (!win) {
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 16; k++) {
      const x = ((k * 137 + T * 40) % (cw + 160)) - 80,
        yy = y0 + h * (0.2 + (k % 4) * 0.2);
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x + U * 0.35, yy);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 8; k++) {
      const x = (k * 173) % cw;
      ctx.beginPath();
      ctx.moveTo(x, y0 + h * 0.3);
      ctx.lineTo(x + U * 0.4, y0 + h * 0.6);
      ctx.lineTo(x + U * 0.7, y0 + h * 0.4);
      ctx.stroke();
    }
  }
  const bx = X(BRIDGE.x),
    by = Y(BRIDGE.y),
    bw = BRIDGE.w * U,
    bh = BRIDGE.h * U;
  ell(ctx, bx + bw / 2, y0 + h * 0.6, bw * 0.6, h * 0.3, 'rgba(20,40,60,.18)');
  const post = (px, py) => {
    ctx.fillStyle = '#5c3920';
    rrect(ctx, px - U * 0.06, py - U * 0.12, U * 0.12, U * 0.22, U * 0.03);
    ctx.fill();
  };
  if (st >= 1) {
    ctx.fillStyle = '#a87448';
    rrect(ctx, bx, by, bw, bh, U * 0.06);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.5;
    for (let k = 1; k < 9; k++) {
      const yy = by + (bh * k) / 9;
      ctx.beginPath();
      ctx.moveTo(bx + 2, yy);
      ctx.lineTo(bx + bw - 2, yy);
      ctx.stroke();
    }
    ctx.strokeStyle = '#7a5232';
    ctx.lineWidth = U * 0.06;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.04, by);
    ctx.lineTo(bx + U * 0.04, by + bh);
    ctx.moveTo(bx + bw - U * 0.04, by);
    ctx.lineTo(bx + bw - U * 0.04, by + bh);
    ctx.stroke();
    for (const k of [0, 0.5, 1]) {
      post(bx + U * 0.04, by + bh * k);
      post(bx + bw - U * 0.04, by + bh * k);
    }
    if (win) {
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.fillRect(bx + U * 0.1, by, bw - U * 0.2, bh);
    }
  } else {
    ctx.fillStyle = '#8d6440';
    ctx.fillRect(bx + U * 0.08, by, bw - U * 0.16, bh * 0.28);
    ctx.fillRect(bx + U * 0.08, by + bh * 0.78, bw - U * 0.16, bh * 0.22);
    ctx.save();
    ctx.translate(bx + bw * 0.55, by + bh * 0.5);
    ctx.rotate(0.5);
    ctx.fillRect(-bw * 0.3, -U * 0.05, bw * 0.6, U * 0.1);
    ctx.restore();
    ctx.strokeStyle = '#c9a66b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + U * 0.06, by + bh * 0.28);
    ctx.quadraticCurveTo(bx + U * 0.25, by + bh * 0.55, bx + U * 0.06, by + bh * 0.78);
    ctx.stroke();
    post(bx + U * 0.06, by);
    post(bx + bw - U * 0.06, by);
    post(bx + U * 0.06, by + bh);
    post(bx + bw - U * 0.06, by + bh);
  }
  const O = ORCH;
  ctx.fillStyle = win ? 'rgba(255,255,255,.3)' : 'rgba(120,90,50,.16)';
  rrect(ctx, X(O.x), Y(O.y), O.w * U, O.h * U, U * 0.15);
  ctx.fill();
  fenceRect(O.x, O.y + 0.15, O.w, O.h - 0.15, [O.x + 2.55, O.x + 3.15]);
  if (st < 1) {
    for (let k = 0; k < 6; k++)
      drawTree({
        x: O.x + 0.55 + (k % 3) * 1.1,
        y: O.y + 1.2 + Math.floor(k / 3) * 1.45,
        s: 0.5,
        k: 'bush',
        h: k * 0.13
      });
    sign(O.x + O.w / 2, O.y + 0.9, '果园', '修好石桥后开放');
  } else TSLOT.forEach(([tx, ty], i) => drawFruitTree(tx, ty, S.trees[i], i));
  const L = LAKE,
    lx = X(L.x + L.w / 2),
    ly = Y(L.y + L.h / 2),
    rx = (L.w * U) / 2,
    ry = (L.h * U) / 2;
  ell(ctx, lx, ly + 3, rx + U * 0.1, ry + U * 0.1, win ? '#b9c7c9' : '#7a8a6a');
  const lgd = ctx.createRadialGradient(lx - rx * 0.3, ly - ry * 0.3, 2, lx, ly, rx);
  lgd.addColorStop(0, win ? '#eef7fb' : '#8fd3e8');
  lgd.addColorStop(1, win ? '#a9cfe0' : '#2f7fa8');
  ell(ctx, lx, ly, rx, ry, lgd);
  if (!win) {
    for (const [dx, dy] of [
      [0.55, 0.35],
      [0.45, -0.45],
      [-0.15, 0.55]
    ]) {
      const px = lx + dx * rx,
        py = ly + dy * ry;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, U * 0.14, 0.3, Math.PI * 2 - 0.1);
      ctx.closePath();
      ctx.fillStyle = '#5aa047';
      ctx.fill();
    }
    for (let k = 0; k < 6; k++) {
      const rxp = lx + rx * (0.72 + (k % 3) * 0.08),
        ryp = ly - ry * 0.5 + k * ry * 0.18,
        sw = Math.sin(T + k) * 2;
      ctx.strokeStyle = '#5f8a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rxp, ryp);
      ctx.lineTo(rxp + sw, ryp - U * 0.35);
      ctx.stroke();
      ell(ctx, rxp + sw, ryp - U * 0.38, U * 0.03, U * 0.08, '#8a5a2b');
    }
    const jp = (T * 0.3) % 4;
    if (jp < 1) {
      const a = jp * Math.PI,
        fx = lx + rx * 0.1 + jp * U * 0.6,
        fy = ly + ry * 0.1 - Math.sin(a) * U * 0.5;
      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(-Math.cos(a) * 0.9);
      ell(ctx, 0, 0, U * 0.13, U * 0.05, '#cf9a3c');
      ctx.restore();
    } else if (jp < 1.6) {
      ctx.strokeStyle = `rgba(255,255,255,${1.6 - jp})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(
        lx + rx * 0.1 + U * 0.6,
        ly + ry * 0.1,
        U * Math.max(0.01, jp - 0.8) * 0.5,
        U * Math.max(0.01, jp - 0.8) * 0.2,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }
  }
  if (st >= 2) {
    const dx0 = X(L.x - 0.05),
      dy0 = Y(L.y + L.h * 0.42);
    ctx.fillStyle = '#a87448';
    rrect(ctx, dx0, dy0, U * 1.3, U * 0.38, U * 0.04);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80,50,25,.45)';
    ctx.lineWidth = 1.2;
    for (let k = 1; k < 7; k++) {
      ctx.beginPath();
      ctx.moveTo(dx0 + (k * U * 1.3) / 7, dy0);
      ctx.lineTo(dx0 + (k * U * 1.3) / 7, dy0 + U * 0.38);
      ctx.stroke();
    }
    for (const k of [0, 0.5, 1]) circ(ctx, dx0 + k * U * 1.25 + U * 0.03, dy0 + U * 0.4, U * 0.05, '#5c3920');
    const bxx = X(L.x + L.w * 0.62),
      byy = Y(L.y + L.h * 0.68) + Math.sin(T * 1.5) * 2;
    ctx.beginPath();
    ctx.moveTo(bxx - U * 0.42, byy);
    ctx.quadraticCurveTo(bxx, byy + U * 0.3, bxx + U * 0.42, byy);
    ctx.closePath();
    ctx.fillStyle = '#8d5b36';
    ctx.fill();
    ctx.fillStyle = '#b07a4c';
    ctx.fillRect(bxx - U * 0.32, byy - U * 0.03, U * 0.64, U * 0.05);
  } else sign(L.x + L.w * 0.3, L.y + 0.2, '码头', '复兴第二步');
  const M = MARKET;
  if (st >= 3) {
    const cols = [
        ['#d8455b', '#fff'],
        ['#4a8fd0', '#fff'],
        ['#e6a92a', '#fff']
      ],
      goods = [
        ['tomato', 'pumpkin', 'melon'],
        ['egg', 'milk', 'cheese'],
        ['apple', 'cake', 'flour']
      ];
    for (let k = 0; k < 3; k++) {
      const sx = X(M.x + 0.15 + k * 1.17),
        sy = Y(M.y + 0.15),
        sw = U,
        sh = U * 0.8;
      shadow(sx + sw / 2, sy + sh, sw * 0.55, U * 0.1);
      ctx.fillStyle = '#a87448';
      ctx.fillRect(sx + U * 0.05, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillRect(sx + sw - U * 0.11, sy + U * 0.25, U * 0.06, sh * 0.75);
      ctx.fillStyle = '#c9a06a';
      ctx.fillRect(sx, sy + sh * 0.6, sw, sh * 0.35);
      for (let j = 0; j < 5; j++) {
        ctx.fillStyle = cols[k][j % 2];
        ctx.beginPath();
        ctx.moveTo(sx + (j * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy);
        ctx.lineTo(sx + ((j + 1) * sw) / 5, sy + U * 0.28);
        ctx.arc(sx + ((j + 0.5) * sw) / 5, sy + U * 0.28, sw / 10, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
      }
      goods[k].forEach((g2, j) => drawItem(ctx, g2, sx + sw * (0.2 + j * 0.3), sy + sh * 0.6, U * 0.13));
    }
    ctx.strokeStyle = 'rgba(90,60,30,.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(X(M.x), Y(M.y));
    ctx.quadraticCurveTo(X(M.x + M.w / 2), Y(M.y + 0.3), X(M.x + M.w), Y(M.y));
    ctx.stroke();

function terraceBand(t, si) {

    x1 = X(TERR.x + TERR.w),

    bot = Y(y0 + TERR.h),

    win = si === 3;

      ? '#e3e9e6'

  ctx.moveTo(x0 + U * 0.1, top + U * 0.05);
  ctx.quadraticCurveTo((x0 + x1) / 2, top - U * 0.06, x1 - U * 0.1, top + U * 0.05);
  ctx.lineTo(x1, bot - U * 0.16);
  ctx.quadraticCurveTo((x0 + x1) / 2, bot - U * 0.04, x0, bot - U * 0.16);

        (x0 + x1) / 2,
        top + (bot - top) * (f + 0.06),

  ctx.fillRect(x0 + bw * 0.2, y0 + bh * 0.2, bw * 0.6, bh * 0.25);
  const eave = (yy, l, r, th) => {
    ctx.fillStyle = roof;
    ctx.beginPath();
    ctx.moveTo(x0 + bw * l - U * 0.25, yy - th * 0.25);
    ctx.quadraticCurveTo(x0 + bw * l, yy + th * 0.1, x0 + bw * (l + 0.06), yy + th * 0.1);
    ctx.lineTo(x0 + bw * (r - 0.06), yy + th * 0.1);
    ctx.quadraticCurveTo(x0 + bw * r, yy + th * 0.1, x0 + bw * r + U * 0.25, yy - th * 0.25);
    ctx.lineTo(x0 + bw * (r - 0.12), yy - th);
    ctx.lineTo(x0 + bw * (l + 0.12), yy - th);
    ctx.closePath();
    ctx.fill();
  };
  eave(y0 + bh * 0.58, 0.02, 0.98, bh * 0.16);
  eave(y0 + bh * 0.22, 0.14, 0.86, bh * 0.2);
  ctx.fillStyle = win ? '#dfe7ea' : ok ? '#2f3a3a' : '#5a5448';
  ctx.fillRect(x0 + bw * 0.28, y0 + bh * 0.01, bw * 0.44, U * 0.07);
  if (!ok) {
    // 塌了的瓦：几个缺口
    for (const [fx, fy] of [
      [0.3, 0.12],
      [0.62, 0.08],
      [0.2, 0.5],
      [0.74, 0.47]
    ]) {
      ctx.fillStyle = wall;
      ell(ctx, x0 + bw * fx, y0 + bh * fy, U * 0.18, U * 0.07, '#8a7a62');
    }
  }
  // 柱子
  for (let k = 0; k < 6; k++) {
    ctx.fillStyle = pillar;
    ctx.fillRect(x0 + bw * (0.08 + k * 0.165), y0 + bh * 0.6, U * 0.09, bh * 0.36);
  }
  // 门窗
  const lit = darkness() > 0.3;
  for (let k = 0; k < 5; k++) {
    const wx = x0 + bw * (0.12 + k * 0.165),
      wy = y0 + bh * 0.66,
      ww = bw * 0.11,
      wh = bh * 0.22;
    if (k === 2) {
      ctx.fillStyle = ok ? '#7a4a2a' : '#5a4636';
      ctx.fillRect(wx, wy - bh * 0.02, ww, wh + bh * 0.08);
      if (!ok) {
        ctx.strokeStyle = '#a07a52';
        ctx.lineWidth = U * 0.05;
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + ww, wy + wh);
        ctx.moveTo(wx + ww, wy);
        ctx.lineTo(wx, wy + wh);
        ctx.stroke();
      }
      continue;
    }
    ctx.fillStyle = ok ? (lit ? '#ffd47a' : '#f3ead2') : '#6a5a48';
    ctx.fillRect(wx, wy, ww, wh);
    ctx.strokeStyle = ok ? '#7a4a2a' : '#a07a52';
    ctx.lineWidth = 1;
    for (let g2 = 1; g2 < 3; g2++) {
      ctx.beginPath();
      ctx.moveTo(wx + (ww * g2) / 3, wy);
      ctx.lineTo(wx + (ww * g2) / 3, wy + wh);
      ctx.stroke();
    }
  }
  for (let k = 0; k < 3; k++) {
    const wx = x0 + bw * (0.27 + k * 0.17);
    ctx.fillStyle = ok ? (lit ? '#ffd47a' : '#f3ead2') : '#6a5a48';
    ctx.fillRect(wx, y0 + bh * 0.27, bw * 0.12, bh * 0.13);
  }
  // 牌匾
  ctx.fillStyle = ok ? '#8a2a1e' : '#6a5040';
  rrect(ctx, x0 + bw * 0.36, y0 + bh * 0.45, bw * 0.28, bh * 0.11, U * 0.04);
  ctx.fill();
  ctx.fillStyle = ok ? '#f2d36a' : '#b8a888';
  ctx.font = `${Math.round(U * 0.2)}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ok ? '青禾茶馆' : '茶 馆', x0 + bw * 0.5, y0 + bh * 0.505);
  if (ok) {
    // 灯笼
    for (const lx of [0.1, 0.3, 0.7, 0.9]) {
      const sw = Math.sin(T * 1.6 + lx * 9) * U * 0.02,
        px = x0 + bw * lx + sw,
        py = y0 + bh * 0.66;
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0 + bw * lx, y0 + bh * 0.58);
      ctx.lineTo(px, py - U * 0.12);
      ctx.stroke();
      ell(ctx, px, py, U * 0.11, U * 0.13, night ? '#ff5a3a' : '#d8302f');
      ctx.fillStyle = '#f2c63a';
      ctx.fillRect(px - U * 0.06, py - U * 0.14, U * 0.12, U * 0.03);
      ctx.fillRect(px - U * 0.06, py + U * 0.11, U * 0.12, U * 0.03);
    }
    // 门前茶桌
    for (const tx of [0.18, 0.82]) {
      const px = x0 + bw * tx,
        py = y0 + bh * 1.12;
      ell(ctx, px, py + U * 0.05, U * 0.3, U * 0.08, 'rgba(40,30,20,.2)');
      ctx.fillStyle = '#7a4a2a';
      ctx.fillRect(px - U * 0.03, py - U * 0.15, U * 0.06, U * 0.18);
      ell(ctx, px, py - U * 0.16, U * 0.26, U * 0.09, '#a87448');
      ell(ctx, px - U * 0.08, py - U * 0.2, U * 0.05, U * 0.03, '#e6f0e8');
      ell(ctx, px + U * 0.08, py - U * 0.19, U * 0.05, U * 0.03, '#e6f0e8');
    }
    // 茶旗
    const fx = x0 + bw * 1.0,
      fy = y0 + bh * 0.05;
    ctx.fillStyle = '#5c3920';
    ctx.fillRect(fx, fy, U * 0.05, bh * 0.9);
    const fl = Math.sin(T * 2.4) * U * 0.05;
    ctx.fillStyle = '#e8e0c8';
    ctx.beginPath();
    ctx.moveTo(fx + U * 0.05, fy + U * 0.05);
    ctx.lineTo(fx + U * 0.42, fy + U * 0.1 + fl);
    ctx.lineTo(fx + U * 0.4, fy + U * 0.62 + fl);
    ctx.lineTo(fx + U * 0.05, fy + U * 0.58);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#a8352a';
    ctx.font = `bold ${Math.round(U * 0.26)}px ${FONT}`;
    ctx.fillText('茶', fx + U * 0.23, fy + U * 0.34 + fl * 0.6);
  } else {
    // 藤蔓
    ctx.strokeStyle = win ? '#9db4a3' : '#4f7a34';
    ctx.lineWidth = U * 0.04;
    for (const vx of [0.06, 0.9]) {
      ctx.beginPath();
      ctx.moveTo(x0 + bw * vx, y0 + bh);
      for (let k = 1; k < 6; k++)
        ctx.lineTo(x0 + bw * vx + Math.sin(k * 1.7) * U * 0.1, y0 + bh * (1 - k * 0.09));
      ctx.stroke();

    if (hillOpen())
      sign(
        O.x + O.w / 2,
        O.y - 0.5,
        '老茶馆',
        S.lvl >= QUEST[6].lvl ? '复兴第七步' : QUEST[6].lvl + '级 · 复兴第七步'
      );
  }
}

// 清晨山间薄雾
function hillMist() {
  const h = S.clock / 60,
    a = Math.max(0, Math.min(1, (h - 4.5) / 1, (9 - h) / 1.5));

function drawHill() {

/* 绘制叠加层：新手箭头、季节大字 */
function drawTut() {
  if (S.sheet) return;
  let tx, ty, txt, i;
  if (S.tut >= 4) {
    const g = hillGuide();
    if (!g) return;
    [tx, ty, txt] = g;
    return tutArrow(tx, ty, txt);
  }
  const at = k => {
    const q = plotXY(k);
    tx = q.x + 0.5;
    ty = q.y + 0.22;
  };
  if (S.tut === 0) {
    i = S.plots.findIndex(p => !p.L && !p.c);
    if (i < 0) return;
    at(i);
    txt = '点这里播种';
  } else if (S.tut === 1) {
    i = S.plots.findIndex(p => p.c && p.m <= 0 && p.g < CROPS[p.c].time);
    if (i < 0) return;
    at(i);
    txt = '土是干的，点它浇水';
  } else if (S.tut === 2) {
    i = S.plots.findIndex(p => p.c && p.g >= CROPS[p.c].time);
    if (i >= 0) {
      at(i);
      txt = '熟了！点它收获';
    } else {
      i = S.plots.findIndex(p => p.c && p.m <= 0);
      if (i < 0) return;
      at(i);
      txt = '又干了，再浇一次';
    }
  } else if (S.orders.some(canDeliver)) {
    tx = BOARD.x + BOARD.w * 0.5;
    ty = BOARD.y + 0.55;
    txt = '订单够交了！点这里交货，比卖给集市赚得多';
  } else {
    tx = HOUSE.x + HOUSE.w * 0.5;
    ty = HOUSE.y + 0.75;
    txt = '点仓库，把收成卖掉';
  }
  tutArrow(tx, ty, txt);
}
function tutArrow(tx, ty, txt) {
  const x = X(tx),
    y = Y(ty) - Math.abs(Math.sin(T * 4)) * U * 0.15;
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-U * 0.18, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.22);
  ctx.lineTo(-U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.46);
  ctx.lineTo(U * 0.07, -U * 0.22);
  ctx.lineTo(U * 0.18, -U * 0.22);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#5c3920';
  ctx.stroke();
  ctx.restore();
  ctx.font = `${Math.round(U * 0.26)}px ${FONT}`;
  const w = ctx.measureText(txt).width + U * 0.32,
    bx = Math.max(w / 2 + 4, Math.min(cw - w / 2 - 4, x));
  ctx.fillStyle = 'rgba(92,57,32,.94)';
  rrect(ctx, bx - w / 2, y - U * 0.92, w, U * 0.38, U * 0.13);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, bx, y - U * 0.72);
}

function drawBanner() {
  if (!banner) return;
  const a = Math.max(0, Math.min(1, banner.t / 0.6, (3 - banner.t) / 0.4)),

  ctx.fillText(banner.text, 0, 0);

  p.x >= R.x - pad && p.x <= R.x + R.w + pad && p.y >= R.y - pad && p.y <= R.y + R.h + pad;
function plotAt(p) {
  const c = Math.floor(p.x - 1),
    r = Math.floor(p.y - 3.25);
  if (c < 0 || c >= PC || r < 0 || r >= PR) return -1;
  return r * PC + c;
}
function tap(p) {
  if (placing) {
    const i = nearestSpot(p, true);
    if (i >= 0) placeAt(i);
    else toast('点闪烁的空位来摆放，摆完点上面的「完成」');
    return;
  }
  const di = decorAt(p);
  if (di >= 0) return openSheet('decoritem', di);
  if (inR(p, GARDEN)) return openSheet('decor');
  if (hillTap(p)) return;
  if (Math.hypot(p.x - CAT.x, p.y - (CAT.y - 0.15)) < 0.36) return petCat();
  if (S.dog && Math.hypot(p.x - dog.x, p.y - (dog.y - 0.2)) < 0.42) return petDog();
  if (merchHere() && Math.hypot(p.x - MER.x, p.y - (MER.y - 0.45)) < 0.55) return openSheet('merch');
  if (inR(p, HOUSE)) return openSheet('barn');
  if (inR(p, BOARD, 0.1)) return openSheet('orders');
  if (inR(p, YARD)) {
    if (!S.coop) return openSheet('shop');
    if (collect('coop')) return;
    return openSheet('coop');
  }
  if (inR(p, MILL)) {
    if (S.mill.built && collectWork('mill')) return;
    return openWorks('mill');
  }
  for (const k in WRECT)
    if (inR(p, WRECT[k], 0.05)) {
      if (W(k).built && collectWork(k)) return;
      return openWorks(k);
    }
  if (inR(p, PAST)) {
    if (!S.pasture) return openSheet('shop');
    if (collect('pasture')) return;
    return openSheet('pasture');
  }
  if (inR(p, POND, 0.1)) return openFish('pond');
  if (inR(p, BRIDGE, 0.25)) return openSheet('quest');
  if (inR(p, ORCH)) {
    if (S.quest.stage < 1) return openSheet('quest');
    let bi = -1,
      bd = 0.65;
    TSLOT.forEach(([x, y], k) => {
      const d = Math.hypot(p.x - x, p.y - (y - 0.45));
      if (d < bd) {
        bd = d;
        bi = k;
      }
    });
    if (bi >= 0) treeTap(bi);
    return;
  }
  if (inR(p, LAKE)) {
    if (S.quest.stage < 2) {
      toast('湖边还没有码头，完成「开辟码头」就能来钓大鱼');
      return openSheet('quest');
    }
    return openFish('lake');
  }
  if (inR(p, MARKET)) {
    if (S.quest.stage < 3) return openSheet('quest');
    return openSheet('barn');
  }
  const i = plotAt(p);
  if (i >= 0) plotAction(i, null);
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const sp = sxy(e);
  ptrs.set(e.pointerId, sp);
  try {
    cv.setPointerCapture(e.pointerId);
  } catch (_) {}
  if (ptrs.size === 2) {
    drag = null;
    pan = null;
    const [a, b] = [...ptrs.values()],
      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoom, wx: (cx - ox) / U, wy: (cy - oy) / U };
    camTarget = null;
    return;
  }
  if (ptrs.size > 2) return;
  const p = toWorld(e);
  for (const c of crows) {
    if (c.phase !== 'out' && Math.hypot(c.x - p.x, c.y - 0.15 - p.y) < 0.6) {
      shoo(c);
      return;
    }
  }
  const bi = placing || !hillOpen() ? -1 : bushAt(p);
  if (bi >= 0 && S.hill.bush[bi] && S.hill.bush[bi].f) {
    pitch = 1;
    dragN = 0;
    pickBush(bi);
    drag = { mode: 'pick', last: bi };
    return;
  }
  const i = placing ? -1 : plotAt(p);
  if (i >= 0 && !S.plots[i].L) {
    pitch = 1;
    dragN = 0;
    const m = plotAction(i, null);
    if (m && m !== 'none') drag = { mode: m, last: i };
    return;
  }
  pan = { sx: sp.x, sy: sp.y, cx: camX, cy: camY, moved: false, p };
  camTarget = null;
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const sp = sxy(e);
  ptrs.set(e.pointerId, sp);
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()],
      d = Math.hypot(a.x - b.x, a.y - b.y) || 1,
      cx = (a.x + b.x) / 2,
      cy = (a.y + b.y) / 2;
    zoom = Math.max(0.8, Math.min(2.2, (pinch.z * d) / pinch.d));
    U = baseU() * zoom;
    camX = pinch.wx - (cx - cw / 2) / U;
    camY = pinch.wy - (cy - ch / 2) / U;
    applyCam();
    return;
  }
  if (drag && drag.mode === 'pick') {
    const bi = bushAt(toWorld(e));
    if (bi >= 0 && bi !== drag.last) {
      drag.last = bi;
      if (S.hill.bush[bi] && S.hill.bush[bi].f) {
        dragN++;
        pitch = PENTA[Math.min(dragN, PENTA.length - 1)];
        pickBush(bi);
      }
    }
  } else if (drag) {
    const i = plotAt(toWorld(e));
    if (i >= 0 && i !== drag.last) {
      drag.last = i;
      dragN++;
      pitch = PENTA[Math.min(dragN, PENTA.length - 1)];
      plotAction(i, drag.mode);
    }
  } else if (pan) {
    const dx = sp.x - pan.sx,
      dy = sp.y - pan.sy;
    if (!pan.moved && Math.hypot(dx, dy) > 8) pan.moved = true;
    if (pan.moved) {
      camX = pan.cx - dx / U;
      camY = pan.cy - dy / U;
      applyCam();
    }
  }
});
function endPtr(e) {
  ptrs.delete(e.pointerId);
  if (pan && !pan.moved && e.type === 'pointerup') tap(pan.p);
  pan = null;
  drag = null;
  if (ptrs.size < 2) pinch = null;
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener(
  'wheel',
  e => {
    e.preventDefault();
    if (e.ctrlKey) zoom = Math.max(0.8, Math.min(2.2, zoom * Math.exp(-e.deltaY * 0.01)));
    else {
      camY += e.deltaY / U;
      camX += e.deltaX / U;
    }
    camTarget = null;
    applyCam();
  },
  { passive: false }
);

/* v1.2 顺手版：区域标签、收全场、农场概览、消息记录、果树重种、茶山引导与连采 */

// ---------- 区域标签 ----------
const AREA_Y = [0, 17.2, WH];
function areaDots() {
  const farm =
    S.plots.some(p => p.c && p.g >= CROPS[p.c].time) ||
    S.ready.egg + S.ready.milk + S.ready.wool > 0 ||
    wcount(S.mill.out) > 0;
  const south =
    ['kitchen', 'dairy', 'press', 'loom'].some(k => wcount(W(k).out) > 0) || S.trees.some(t => t && t.f > 0);
  const hill = hillOpen() && (hillReady() > 0 || wcount(W('tea').out) > 0);

}
$('#areas').addEventListener('click', e => {

// ---------- 收全场 ----------
function allCount() {
  let n = S.ready.egg + S.ready.milk + S.ready.wool;
  n += worksReady();
  n += S.trees.reduce((a, t) => a + (t ? t.f : 0), 0);
  n += hillReady();
  if (S.up.rake) n += S.plots.filter(p => p.c && p.g >= CROPS[p.c].time).length;
  return n;
}
function collectAll() {
  const inv0 = Object.values(S.inv).reduce((a, b) => a + b, 0);
  collect('coop');
  collect('pasture');
  for (const k in WORKS) collectWork(k);
  S.trees.forEach((tr, i) => {
    if (tr && tr.f > 0) treeTap(i);
  });
  if (hillOpen()) pickAllHill();
  let re = 0;
  if (S.up.rake) {
    const sel = S.sel;
    S.plots.forEach((p, i) => {
      if (!p.c || p.g < CROPS[p.c].time) return;
      const c = p.c;
      harvest(i);
      if (S.coins >= CROPS[c].cost && CROPS[c].lvl <= S.lvl) {
        S.sel = c;
        if (plant(i)) re++;
      }
    });
    S.sel = sel;
    buildSeeds();
  }
  const got = Object.values(S.inv).reduce((a, b) => a + b, 0) - inv0;
  sfx('ach');
  toast(`收全场：一共收了 ${got} 件${re ? `，补种了 ${re} 块地` : ''}`, 'gold');
  hudKey = '';
}

const ANIM_RATE = () => 1 + S.res.barn * 0.08;
function nextAnim(kinds) {
  let best = Infinity,
    hungry = 0;
  for (const k of kinds)
    for (const h of S.an[k]) {
      const A = ANIM[k];
      if (!h.fed && A.feed && !(S.feed && S.inv[A.feed] > 0)) {
        hungry++;
        continue;
      }
      best = Math.min(best, (A.t - (h.t || 0)) / ANIM_RATE());
    }
  return { best, hungry };
}
function overviewSheet() {

  );
  const n = allCount();
  return (n ? `<button class="btn gold big" data-a="allget">收全场 · ${n} 件</button>` : '') + rows.join('');

// ---------- 消息记录 ----------
const msgLog = [];
function logMsg(msg) {

    mm = Math.floor(S.clock % 60);
  msgLog.unshift(
    `${SEA[season()].n}${sDay()}日 ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}　${msg}`

// ---------- 茶山：连采 ----------
function bushAt(p) {
  if (p.x < TERR.x || p.x > TERR.x + TERR.w || p.y < TERR.y || p.y > TERR.y + TERR.h * 5) return -1;
  let bi = -1,
    bd = 0.6;
  for (let i = 0; i < 20; i++) {
    if (!terrOpen(Math.floor(i / 4))) continue;
    const q = bushXY(i),
      d = Math.hypot(p.x - q.x, p.y - (q.y - 0.3));
    if (d < bd) {
      bd = d;
      bi = i;
    }
  }
  return bi;
}

function hillGuide() {
  if (!hillOpen() || S.sheet || placing || areaNow() !== 2) return null;
  if (!S.hill.bush.some(Boolean)) {
    const q = bushXY(0);
    return [q.x, q.y - 0.55, '点这里种第一棵茶树'];
  }
  if (!W('tea').built && S.lvl >= WORKS.tea.lvl)
    return [WRECT.tea.x + WRECT.tea.w / 2, WRECT.tea.y + 0.45, '建茶坊，把鲜叶做成茶'];
  if (!S.hill.hive[0]) return [HIVES[0][0], HIVES[0][1] - 0.85, '安个蜂箱，蜜蜂自己酿蜜'];
  return null;
}

  [

    '12 级后完成村庄复兴第五步「修通上山的路」，地图最下面的青禾茶山就开放了。梯田种茶树、茉莉、桂花，长成后定时攒鲜叶和花，点一下就采；蜂箱自己酿蜜，旁边开花的越多越快；茶坊把它们做成绿茶、红茶、花茶和茶点。茶山篇还有「半山茶亭」「复原老茶馆」两步，修好老茶馆后会常来报酬翻倍的茶馆大单。20 级以后每升一级，农场名声 +1%，所有售价和订单报酬都跟着涨。画面右下角的按钮在农场、南岸、茶山之间切换。'
  ],
  [
    '节日',
    '每个季节第 3、4 天过节：春天花朝节、夏天荷灯节、秋天丰收节、冬天灯会。节日里会来很多「节日订单」，报酬多五成，每交一单盖一枚章，集 2、4、6 枚各领一次奖，6 枚第一次领时是这个节日的限定装饰。'
  ],
  [
    '村民',
    '订单面板顶上切到「村民」能看每个人的好感。给同一位村民交单会涨好感，带上他最爱的东西涨得更快；每多一颗心送一次礼、订单报酬 +4%，三颗心以上偶尔会下报酬翻倍的心愿订单。'
  ],
  [
    '图鉴',
    '在「成就」里切到「图鉴」。收获、加工、钓鱼、摆装饰都会收录；同一样东西攒得越多熟练度越高，每颗星让它的售价 +5%，最多 +15%。收齐一类还有奖励。'
  ],
  [
    '每日',
    '左上角的「今日」每天 0 点刷新三个小任务，做完领金币和经验，三个都做完再开一个宝箱。每天签到一次，7 天一轮，第 7 天送专属装饰「青禾风铃」；中间断了也不清零。'
  ],
  [
    '装饰',
    '在商店的「装饰农场」里挑装饰，摆在最下面的后花园和地图空地上。美观度越高，交订单多拿金币，最多 +30%。点已经摆好的装饰可以收起或换位置。'
  ],
  ['看地图', '在草地上拖动可以移动画面，双指可以缩放，电脑上可以用滚轮。右下角按钮在农场和南岸之间快速跳转。']
];
function resetGame() {
  const s = fresh();
  s.resetAt = Date.now();
  s.welcomed = true;
  S = s;
  F = null;
  crows = [];
  parts = [];
  floats = [];
  vis.hen.length = vis.cow.length = vis.sheep.length = 0;
  dog.x = 4;
  dog.y = 2.86;
  zoom = 1;
  camY = -99;
  camTarget = null;
  applyCam();
  buildSeeds();
  coinShown = S.coins;
  $('#coins').textContent = S.coins;
  hudKey = '';
  save();
  pushCloud();
  openSheet('welcome');
  toast('新的农场，新的开始');
}

/* 网页版（自己部署的网址）专用：添加到主屏幕引导、微信提示、备份提醒、静音键提示 */
const UA = navigator.userAgent,
  IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  IN_WX = /MicroMessenger/i.test(UA),
  STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches,
  ON_SITE = !!window.QH_SITE;
const lsGet = k => {
  try {
    return localStorage.getItem(k);
  } catch (e) {
    return null;
  }
};
const lsSet = (k, v) => {
  try {
    localStorage.setItem(k, v);
  } catch (e) {}
};
const SHARE_ICO =
  '<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5V2.5M6.5 6 10 2.5 13.5 6"/><path d="M6 9H4.5v8.5h11V9H14"/></svg>';
function siteSheet(k) {
  if (k === 'a2hs')
    return {
      t: '添加到主屏幕',
      h:
        `<p class="note">把青禾小农场放到手机桌面，像 App 一样一点就开，全屏更好玩，进度也不会被 Safari 自动清掉。</p>` +
        `<div class="a2steps"><div><b>1</b><span>点屏幕底部的分享按钮 ${SHARE_ICO}</span></div><div><b>2</b><span>往下翻，选「添加到主屏幕」</span></div><div><b>3</b><span>以后从桌面的「青禾小农场」图标进来玩</span></div></div>` +
        (S.play > 300
          ? `<p class="note">桌面图标里是新的存档。想接着现在的进度玩：先在「菜单 → 存档管理」复制存档码，到桌面图标里再导入。</p><button class="btn big" data-a="go:save">先复制存档码</button>`
          : '') +
        `<button class="btn gold big" data-a="close">知道了</button>`
    };
  if (k === 'backup')
    return {
      t: '备份一下进度',
      h:
        `<p class="note">进度存在这台手机的浏览器里。换手机、清理浏览器数据，或者很久没打开被系统清理，进度就没了。复制一份存档码存到备忘录或发给自己，随时能找回。</p>` +
        `<button class="btn gold big" data-a="go:save">去复制存档码</button><button class="btn alt big" data-a="close">下次再说</button>`
    };
  return null;
}
// 开局几秒后看一次要不要提醒
function siteTips() {
  if (IN_WX) {
    $('#wxtip').hidden = false;
    return;
  }
  if (!ON_SITE || S.tut < 4) return;
  // 刚关掉别的弹窗（欢迎回来、今日）就别马上再弹，过一会儿再看
  if (S.sheet || (sheetT > 0 && T - sheetT < 8)) return void setTimeout(siteTips, 15000);
  const now = Date.now();
  // 不再提示添加到主屏幕；Safari 网页的数据可能被系统清理，备份提醒提早一些
  if (S.play > 900 && now - (S.bakAt || S.bakNag || 0) > 3 * 864e5) {
    S.bakNag = now;
    openSheet('backup');
  }
}
$('#wxClose').onclick = () => ($('#wxtip').hidden = true);
// iPhone 第一次出声时提醒静音键
function muteTip() {
  if (!IS_IOS || lsGet('qh-mute-tip')) return;
  lsSet('qh-mute-tip', 1);
  setTimeout(() => toast('听不到音乐的话，看看手机侧面的静音键'), 1500);
}

// 发现新版本：回到前台时、以及每 10 分钟查一次 version.json
let updV = null,
  updT = 0;
const verNum = v =>
  String(v)
    .split('.')
    .map(Number)
    .reduce((a, x, i) => a + x * Math.pow(1000, 2 - i), 0);
async function checkUpdate() {
  if (!ON_SITE || updV || location.protocol !== 'https:') return;
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (j && j.v && verNum(j.v) > verNum(VERSION)) {
      updV = j.v;
      $('#updTxt').textContent = `新版本 v${j.v} 已就绪，点这里更新（进度会保留）`;
      $('#updbar').hidden = false;
    }
  } catch (e) {}
}
$('#updbar').onclick = e => {
  if (e.target.id === 'updClose') return void ($('#updbar').hidden = true);
  save();
  location.reload();
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkUpdate();
});
setInterval(checkUpdate, 600000);
setTimeout(checkUpdate, 8000);

/* 启动：离线补算、云存档、主循环 */
resize();
buildSeeds();
// 补算离开的时间（最多 8 小时），返回这段时间的收获汇总
function catchUp() {
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - (S.saved || Date.now())) / 1000));
  banner = null;
  if (away <= 20) return null;
  const inv0 = { ...S.inv },
    coins0 = S.coins;
  offStat = { hand: 0, lvUp: 0, keep: Math.floor(S.coins * 0.6) };
  offClock = 1440;
  simOff = true;
  try {
    // 步长随离开时长放大，最多算 6000 步，手机上也能很快打开
    const step = Math.max(1, away / 6000);
    for (let t = 0; t < away; t += step) update(step, true);
  } finally {
    simOff = false;
  }
  banner = null;
  const gains = {};
  for (const k in S.inv) if (S.inv[k] - (inv0[k] || 0) > 0) gains[k] = S.inv[k] - (inv0[k] || 0);
  return {
    away,
    gains,
    ready: { ...S.ready },
    works: worksReady(),
    fruit: S.trees.reduce((a, t) => a + (t ? t.f : 0), 0),
    ripe: S.plots.filter(p => p.c && p.g >= CROPS[p.c].time).length,
    hill: hillReady(),
    hand: offStat.hand,
    lvUp: offStat.lvUp,
    spent: Math.max(0, coins0 - S.coins),
    gift: away >= 3600 ? 50 + S.lvl * 20 : 0
  };
}
function adopt(s2) {
  S = s2;
  S.sheet = null;
  veil.hidden = true;
  F = null;
  S.welcomed = true;
  catchUp();
  buildSeeds();
  crows = [];
  coinShown = S.coins;
  $('#coins').textContent = fmtC(S.coins);
  hudKey = '';
  save();
}
async function pushCloud() {
  if (!cloud || cloud.busy) return;
  cloud.busy = true;
  try {
    S.saved = Date.now();
    await cloud.ref.set({ json: JSON.stringify(S), saved: S.saved, play: Math.round(S.play || 0), v: 3 });
    cloudState = 'on';
  } catch (e) {
    cloudState = e && e.code === 'quota_exceeded' ? 'full' : 'err';
  }
  cloud.busy = false;
}
async function initCloud() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc('data/users/' + id + '/farm');
    let snap;
    try {
      snap = await ref.get();
    } catch (e) {
      await new Promise(r => setTimeout(r, 800 + rand() * 800));
      snap = await ref.get();
    }
    cloud = { ref, busy: false };
    cloudState = 'on';
    if (snap.exists) {
      const d = snap.data() || {};
      if (
        typeof d.json === 'string' &&
        ((d.saved || 0) > bootSaved + 5000 || ((S.play || 0) < 90 && (d.play || 0) > (S.play || 0) + 60)) &&
        !(S.resetAt && (d.saved || 0) < S.resetAt)
      ) {
        let s2 = null;
        try {
          s2 = load(JSON.parse(d.json));
        } catch (e) {}
        if (s2) {
          adopt(s2);
          toast('已接上云端存档', 'gold');
        }
      }
    }
    pushCloud();
  } catch (e) {
    cloudState = cloud ? 'err' : 'off';
  }
}
bootSaved = S.saved || 0;
const ret0 = catchUp();
rollDaily();
banner = !S.welcomed
  ? null
  : festNow() >= 0
    ? { t: 3, text: FESTS[festNow()].n, sub: '两天节日 · 交节日订单攒章' }
    : { t: 3, text: SEA[season()].n + '天', sub: `第${Math.floor((S.day - 1) / 16) + 1}年` };
coinShown = S.coins;
$('#coins').textContent = fmtC(S.coins);
S.sheet = null;
if (!S.welcomed) {
  S.welcomed = true;
  openSheet('welcome');
} else if (ret0 && ret0.away >= 120) {
  retInfo = ret0;
  banner = null;
  openSheet('back');
}
let last = performance.now(),
  saveT = 0;
let perfT = 0,
  perfN = 0;
function frame(n) {
  const raw = (n - last) / 1000,
    dt = Math.min(0.1, raw);
  last = n;
  // 连续两秒帧率不到 40，就把画布分辨率往下调一档
  if (!document.hidden && raw < 0.5) {
    perfT += raw;
    perfN++;
    if (perfT > 2) {
      if (perfN / perfT < 40 && dprCap > 1) {
        dprCap = Math.max(1, dprCap - 0.25);
        resize();
      }
      perfT = perfN = 0;
    }
  }
  T += dt;
  const st = $('#stage');
  if (cw !== st.clientWidth || ch !== st.clientHeight) resize();
  update(dt, false);
  render();
  hud();
  saveT += dt;
  if (saveT > 4) {
    saveT = 0;
    save();
  }
  achT += dt;
  if (achT > 1) {
    achT = 0;
    checkAch();
  }
  if (S.sheet === 'works') {
    const j = W(wsTab).q[0],
      el = document.getElementById('wtime'),
      bar = document.getElementById('wbar0');
    if (j && el) el.textContent = '还要 ' + fmtT(j.t);
    if (j && bar) bar.style.width = (1 - j.t / RECIPES[j.r].t) * 100 + '%';
  }
  if (S.sheet === 'orders')
    document.querySelectorAll('[data-exp]').forEach(el => {
      const o = S.orders[+el.dataset.exp];
      if (o && o.exp) el.textContent = '加急 ' + fmtT(o.exp);
    });
  music();
  // 跨过零点换新任务；新手引导结束后，每天第一次打开提醒签到
  if (achT === 0) {
    if (rollDaily()) toast('新的一天，每日任务刷新了', 'gold');
    festRoll();
    if (
      S.tut >= 4 &&
      !S.sheet &&
      !placing &&
      !dailyPrompted &&
      T - sheetT > 6 &&
      S.daily &&
      !S.daily.signed
    ) {
      dailyPrompted = true;
      openSheet('daily');
    }
  }
  S.play = (S.play || 0) + dt;
  cloudT += dt;
  if (cloudT > 15) {
    cloudT = 0;
    pushCloud();
  }
  if (F && F.phase === 'bite') {
    const nd = document.getElementById('needle');
    if (nd) nd.style.left = F.pos * 100 + '%';
  }
  if (camTarget != null) {
    const b0 = camY;
    camY += (camTarget - camY) * Math.min(1, dt * 4);
    applyCam();
    if (Math.abs(camY - b0) < 0.002) camTarget = null;
  }
  updAreas();
  updAllBtn();
  if (coinShown !== S.coins) {
    const d = S.coins - coinShown;
    coinShown += Math.sign(d) * Math.max(1, Math.ceil(Math.abs(d) * 0.15));
    $('#coins').textContent = fmtC(coinShown);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    pushCloud();
  }
});
initCloud();
setTimeout(siteTips, 5000);
})();
</script>
